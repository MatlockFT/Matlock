<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta http-equiv="refresh" content="0; url={{ page.redirect_to | relative_url }}">
    <meta name="robots" content="noindex">
    <link rel="canonical" href="{{ page.redirect_to | absolute_url }}">
    <title>Redirecting…</title>
</head>
<body>
    <p>
        This page moved.
        <a href="{{ page.redirect_to | relative_url }}">Continue to the article</a>.
    </p>

    <script>
        window.location.replace(
            {{ page.redirect_to | relative_url | jsonify }}
        );
    </script>
</body>
</html>
