<svg xmlns="http://www.w3.org/2000/svg" width="720" height="480" viewBox="0 0 720 480">
  <defs>
    <filter id="grain" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.82" numOctaves="4" seed="37" stitchTiles="stitch" result="noise"/>
      <feColorMatrix in="noise" type="matrix" values="0 0 0 0 0.58  0 0 0 0 0.58  0 0 0 0 0.58  0 0 0 .22 0" result="grayNoise"/>
      <feBlend in="SourceGraphic" in2="grayNoise" mode="screen"/>
    </filter>
    <filter id="soft">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="scuff">
      <feTurbulence type="fractalNoise" baseFrequency="0.018 0.12" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="22" xChannelSelector="R" yChannelSelector="G"/>
      <feGaussianBlur stdDeviation="1.3"/>
    </filter>
    <linearGradient id="base" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#151515"/>
      <stop offset="0.55" stop-color="#0f0f0f"/>
      <stop offset="1" stop-color="#090909"/>
    </linearGradient>
  </defs>
  <rect width="720" height="480" fill="url(#base)" filter="url(#grain)"/>
  <ellipse cx="170" cy="145" rx="170" ry="90" fill="#d7d7d7" opacity=".028" filter="url(#soft)"/>
  <ellipse cx="545" cy="330" rx="190" ry="105" fill="#d0d0d0" opacity=".022" filter="url(#soft)"/>
  <path d="M-30 365 C120 330 235 388 392 348 S650 305 770 325" fill="none" stroke="#d7d7d7" stroke-width="5" opacity=".03" filter="url(#scuff)"/>
  <path d="M75 86 C190 117 310 76 430 104 S602 141 724 112" fill="none" stroke="#e2e2e2" stroke-width="3" opacity=".022" filter="url(#scuff)"/>
  <path d="M260 -25 C246 93 292 183 270 303 S250 434 292 510" fill="none" stroke="#cccccc" stroke-width="2" opacity=".02" filter="url(#scuff)"/>
</svg>
