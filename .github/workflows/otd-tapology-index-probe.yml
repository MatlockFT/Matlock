name: OTD Tapology index probe

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/otd-tapology-index-probe.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe public reader for exact Tapology pages
        shell: bash
        run: |
          python - <<'PY'
          import re
          import urllib.parse
          import urllib.request

          pages = [
              'https://www.tapology.com/fightcenter/events/bellator-28',
              'https://www.tapology.com/fightcenter/events/16750-bellator-98',
              'https://www.tapology.com/fightcenter/events/42533-ufc-215',
              'https://www.tapology.com/fightcenter/events/6777-pancrase-193-shining-7',
          ]
          ua = 'Mozilla/5.0 MMA-Matlock-OTD-reader-probe/1.0'

          for page in pages:
              reader = 'https://r.jina.ai/' + page
              req = urllib.request.Request(reader, headers={
                  'User-Agent': ua,
                  'Accept': 'text/plain,text/markdown,*/*',
              })
              print(f'PAGE={page}')
              try:
                  with urllib.request.urlopen(req, timeout=35) as response:
                      body = response.read().decode('utf-8', 'replace')
                      print(f'READER HTTP={response.status} BYTES={len(body)} FINAL={response.geturl()}')
              except Exception as exc:
                  print(f'READER ERROR={exc}')
                  continue

              posters = sorted(set(re.findall(r'https?://images\.tapology\.com/poster_images/[^\s)\]"\'<>]+', body, flags=re.I)))
              print(f'POSTER_URLS={len(posters)}')
              for poster in posters[:12]:
                  print(f'POSTER={poster}')
              for line in body.splitlines():
                  if any(token in line.lower() for token in ['title:', 'date:', 'event poster', 'bellator 28', 'bellator 98', 'ufc 215', 'shining 7']):
                      print('LINE=' + line[:300])
          PY
