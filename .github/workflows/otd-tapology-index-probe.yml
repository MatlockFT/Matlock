name: OTD Tapology index probe

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/otd-tapology-index-probe.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe Tapology event search through public reader
        shell: bash
        run: |
          python - <<'PY'
          import re
          import urllib.parse
          import urllib.request

          terms = ['Bellator 98', 'UFC 215', 'Pancrase Shining 7', 'Pride 7']
          ua = 'Mozilla/5.0 MMA-Matlock-OTD-reader-probe/1.0'

          for term in terms:
              query = urllib.parse.urlencode({
                  'model[events]': 'eventsSearch',
                  'search': 'Submit',
                  'term': term,
              })
              target = 'https://www.tapology.com/search?' + query
              reader = 'https://r.jina.ai/' + target
              req = urllib.request.Request(reader, headers={
                  'User-Agent': ua,
                  'Accept': 'text/plain,text/markdown,*/*',
              })
              print(f'=== TERM={term} ===')
              print(f'TARGET={target}')
              try:
                  with urllib.request.urlopen(req, timeout=40) as response:
                      body = response.read().decode('utf-8', 'replace')
                      print(f'READER HTTP={response.status} BYTES={len(body)}')
              except Exception as exc:
                  print(f'READER ERROR={exc}')
                  continue

              urls = sorted(set(re.findall(r'https?://(?:www\.)?tapology\.com/fightcenter/events/[^\s)\]"\'<>]+', body, flags=re.I)))
              rels = sorted(set(re.findall(r'\(/fightcenter/events/[^\s)\]"\'<>]+', body, flags=re.I)))
              print(f'ABS_EVENT_URLS={len(urls)} REL_EVENT_LINKS={len(rels)}')
              for url in urls[:20]: print(f'URL={url}')
              for rel in rels[:20]: print(f'REL={rel[1:]}')
              for line in body.splitlines():
                  low = line.lower()
                  if term.lower() in low or '/fightcenter/events/' in low:
                      print('LINE=' + line[:500])
          PY
