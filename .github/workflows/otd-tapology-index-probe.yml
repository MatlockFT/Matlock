name: OTD Tapology index probe

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/otd-tapology-index-probe.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe archived exact Tapology event pages
        shell: bash
        run: |
          python - <<'PY'
          import json
          import re
          import urllib.parse
          import urllib.request

          pages = [
              'https://www.tapology.com/fightcenter/events/bellator-28',
              'https://www.tapology.com/fightcenter/events/16750-bellator-98',
              'https://www.tapology.com/fightcenter/events/42533-ufc-215',
              'https://www.tapology.com/fightcenter/events/6777-pancrase-193-shining-7',
          ]

          ua = 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/152 Safari/537.36'

          def get(url):
              req = urllib.request.Request(url, headers={'User-Agent': ua, 'Accept-Language': 'en-US,en;q=0.9'})
              with urllib.request.urlopen(req, timeout=25) as response:
                  return response.status, response.geturl(), response.read().decode('utf-8', 'replace')

          for page in pages:
              cdx = 'https://web.archive.org/cdx/search/cdx?' + urllib.parse.urlencode({
                  'url': page,
                  'output': 'json',
                  'filter': 'statuscode:200',
                  'fl': 'timestamp,original,statuscode,digest',
                  'collapse': 'digest',
                  'limit': '5',
                  'from': '2008',
              })
              print(f'PAGE={page}')
              try:
                  status, final, body = get(cdx)
                  print(f'CDX HTTP={status} BYTES={len(body)} FINAL={final}')
                  rows = json.loads(body)
                  captures = rows[1:] if isinstance(rows, list) and rows and isinstance(rows[0], list) else []
                  print(f'CAPTURES={len(captures)}')
              except Exception as exc:
                  print(f'CDX ERROR={exc}')
                  continue

              for row in captures[-3:]:
                  ts = row[0]
                  snap = f'https://web.archive.org/web/{ts}id_/{page}'
                  try:
                      s, f, html = get(snap)
                      print(f'SNAPSHOT={ts} HTTP={s} BYTES={len(html)}')
                      poster_urls = sorted(set(re.findall(r'https?://images\.tapology\.com/poster_images/[^"\'<>\\s)&]+', html, flags=re.I)))
                      print(f'POSTER_URLS={len(poster_urls)}')
                      for poster in poster_urls[:8]:
                          print(f'POSTER={poster}')
                      title = re.search(r'<title[^>]*>([\s\S]*?)</title>', html, flags=re.I)
                      if title:
                          print('TITLE=' + re.sub(r'<[^>]+>', ' ', title.group(1)).strip()[:220])
                      if poster_urls:
                          break
                  except Exception as exc:
                      print(f'SNAPSHOT={ts} ERROR={exc}')
          PY
