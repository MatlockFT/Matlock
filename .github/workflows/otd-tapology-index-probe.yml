name: OTD Tapology index probe

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/otd-tapology-index-probe.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe search indexes and Tapology image CDN
        shell: bash
        run: |
          python - <<'PY'
          import re
          import urllib.parse
          import urllib.request

          ua = 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/152 Safari/537.36'
          events = ['Bellator 28', 'Bellator 98', 'UFC 215 Nunes Shevchenko 2', 'Pancrase 193 Shining 7']

          def get(url):
              req = urllib.request.Request(url, headers={'User-Agent': ua, 'Accept-Language': 'en-US,en;q=0.9'})
              with urllib.request.urlopen(req, timeout=20) as response:
                  return response.status, response.geturl(), response.read().decode('utf-8', 'replace')

          try:
              req = urllib.request.Request('https://images.tapology.com/poster_images/122/profile/ufc3.jpg?1551290735', headers={'User-Agent': ua}, method='HEAD')
              with urllib.request.urlopen(req, timeout=20) as response:
                  print(f'TAPOLOGY_CDN HTTP={response.status} TYPE={response.headers.get("content-type")} LENGTH={response.headers.get("content-length")}')
          except Exception as exc:
              print(f'TAPOLOGY_CDN ERROR={exc}')

          engines = {
              'google-web': lambda q: 'https://www.google.com/search?num=20&q=' + urllib.parse.quote(q),
              'google-images': lambda q: 'https://www.google.com/search?tbm=isch&num=50&q=' + urllib.parse.quote(q),
              'bing-web': lambda q: 'https://www.bing.com/search?count=30&q=' + urllib.parse.quote(q),
              'yahoo-images': lambda q: 'https://images.search.yahoo.com/search/images?p=' + urllib.parse.quote(q),
          }

          poster_rx = re.compile(r'https?(?:%3A%2F%2F|://)images(?:%2E|\.)tapology(?:%2E|\.com)(?:%2F|/)poster_images(?:%2F|/)[^"\'<>\\s)&]+', re.I)
          event_rx = re.compile(r'https?(?:%3A%2F%2F|://)(?:www(?:%2E|\.)|)tapology(?:%2E|\.com)(?:%2F|/)fightcenter(?:%2F|/)events(?:%2F|/)[^"\'<>\\s)&]+', re.I)

          for event in events:
              print(f'=== {event} ===')
              query = f'"{event}" Tapology'
              for name, builder in engines.items():
                  try:
                      status, final, raw = get(builder(query))
                      posters = sorted(set(poster_rx.findall(raw)))
                      pages = sorted(set(event_rx.findall(raw)))
                      print(f'{name} HTTP={status} BYTES={len(raw)} POSTERS={len(posters)} EVENT_URLS={len(pages)}')
                      for url in posters[:5]: print(f'{name} POSTER={urllib.parse.unquote(url)}')
                      for url in pages[:5]: print(f'{name} EVENT={urllib.parse.unquote(url)}')
                  except Exception as exc:
                      print(f'{name} ERROR={exc}')
          PY
