name: Promote article videos to Pages

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/promote-article-videos.yml"

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download release videos into same-origin site assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p assets/article-media
          gh release download writer-media-2026-09 \
            --repo MatlockFT/Matlock \
            --dir assets/article-media \
            --pattern 'rosas-jr-vs-barcelos-ufc-vegas-121-video-20260924-193315-968.mp4' \
            --pattern 'rosas-jr-vs-barcelos-ufc-vegas-121-video-20260925-011655-703.mp4'

      - name: Point article at same-origin copies
        run: |
          python3 - <<'PY'
          from pathlib import Path
          post = Path('_posts/2026-09-24-rosas-jr-vs-barcelos-ufc-vegas-121.md')
          text = post.read_text()
          replacements = {
              'https://github.com/MatlockFT/Matlock/releases/download/writer-media-2026-09/rosas-jr-vs-barcelos-ufc-vegas-121-video-20260924-193315-968.mp4':
                  '/assets/article-media/rosas-jr-vs-barcelos-ufc-vegas-121-video-20260924-193315-968.mp4',
              'https://github.com/MatlockFT/Matlock/releases/download/writer-media-2026-09/rosas-jr-vs-barcelos-ufc-vegas-121-video-20260925-011655-703.mp4':
                  '/assets/article-media/rosas-jr-vs-barcelos-ufc-vegas-121-video-20260925-011655-703.mp4',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'Missing expected video URL: {old}')
              text = text.replace(old, new)
          post.write_text(text)

          config = Path('_config.yml')
          cfg = config.read_text()
          if 'asset_version: "252"' in cfg:
              cfg = cfg.replace('asset_version: "252"', 'asset_version: "253"', 1)
          config.write_text(cfg)
          PY

      - name: Verify files are real MP4s
        run: |
          set -euo pipefail
          for file in assets/article-media/*.mp4; do
            test "$(dd if="$file" bs=1 skip=4 count=4 status=none)" = "ftyp"
            test -s "$file"
          done

      - name: Commit promoted media and remove one-shot workflow
        run: |
          set -euo pipefail
          git config user.name "MatlockFT"
          git config user.email "fighttalkmma@protonmail.com"
          git rm .github/workflows/promote-article-videos.yml
          git add assets/article-media _posts/2026-09-24-rosas-jr-vs-barcelos-ufc-vegas-121.md _config.yml
          git commit -m "Serve article videos from same-origin site assets"
          git push origin HEAD:main
