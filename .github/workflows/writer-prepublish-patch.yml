name: Writer prepublish patch runner

on:
  push:
    branches:
      - writer-prepublish-patch
    paths:
      - .github/workflows/writer-prepublish-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: writer-prepublish-patch
      - name: Patch Writer pre-publish checks and smoke coverage
        run: python scripts/writer-prepublish-patch.py
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/writer.js scripts/writer-smoke.spec.cjs
          git diff --cached --check
          git commit -m "Tighten Writer pre-publish validation"
          git push origin HEAD:writer-prepublish-patch
