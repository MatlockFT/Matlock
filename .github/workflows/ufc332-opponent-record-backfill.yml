name: UFC 332 opponent record backfill

on:
  push:
    branches: [main]
    paths:
      - "scripts/writer/backfill-ufc332-opponent-records.mjs"
      - ".github/workflows/ufc332-opponent-record-backfill.yml"

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
      - name: Backfill UFC 332 Tale opponent records
        run: node scripts/writer/backfill-ufc332-opponent-records.mjs
      - name: Commit updated draft
        run: |
          if git diff --quiet -- _posts/2026-09-25-ufc-332.md; then
            echo "No draft changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _posts/2026-09-25-ufc-332.md
          git commit -m "Backfill UFC 332 opponent combined records"
          git push
