name: UFC roster output audit

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - Update UFC roster tracker
    types:
      - completed
  schedule:
    - cron: "11 */6 * * *"

permissions:
  contents: read

concurrency:
  group: ufc-roster-output-audit
  cancel-in-progress: true

jobs:
  audit:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download published roster snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/ufc-roster-audit
          gh release download ufc-roster-data \
            --pattern "ufc-roster-latest.json" \
            --pattern "ufc-roster-state.json" \
            --dir /tmp/ufc-roster-audit \
            --clobber
          test -s /tmp/ufc-roster-audit/ufc-roster-latest.json
          test -s /tmp/ufc-roster-audit/ufc-roster-state.json

      - name: Validate published roster integrity
        run: >-
          node scripts/validate-ufc-roster-output.mjs
          /tmp/ufc-roster-audit/ufc-roster-latest.json
          /tmp/ufc-roster-audit/ufc-roster-state.json
