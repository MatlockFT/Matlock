name: Package Writer backend

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/package-writer-backend.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upload Writer backend source
        uses: actions/upload-artifact@v4
        with:
          name: writer-backend-source
          path: _netlify-auth
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
