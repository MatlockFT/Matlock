name: Writer UI refine once

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/writer-ui-refine-once.yml"

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
      - name: Apply Writer UI refinement
        run: |
          python .github/scripts/patch_writer_ui_refine.py
          node --check assets/writer.js
          grep -q 'writer-autosave-chip' write.html
          grep -q 'writer-meta-summary' write.html
          grep -q 'Writer refinement pass 2026-09-16' assets/writer.css
          grep -q 'setLocalStatus' assets/writer.js
      - name: Commit refined Writer UI
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add write.html assets/writer.js assets/writer.css
          git commit -m "Refine Writer interface and save status feedback"
          git push origin HEAD:main
