name: Inspect YouTube fallback link

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/inspect-youtube-fallback.yml"

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-save --no-package-lock @playwright/test@1.55.0
      - name: Inspect fallback DOM
        run: |
          node <<'NODE'
          const { chromium } = require('@playwright/test');
          (async () => {
            const browser = await chromium.launch({ channel: 'chrome' });
            const page = await browser.newPage();
            await page.goto('https://mmamatlock.com/live/?fallback_probe=' + Date.now(), { waitUntil: 'domcontentloaded', timeout: 45000 });
            await page.waitForTimeout(8000);
            const yt = page.frames().find(f => f.url().includes('youtube.com/embed'));
            if (!yt) throw new Error('No YouTube iframe');
            const info = await yt.evaluate(() => ({
              links: [...document.querySelectorAll('a')].map(a => ({
                text: (a.textContent || '').trim(),
                aria: a.getAttribute('aria-label'),
                href: a.href,
                cls: a.className
              })).filter(x => x.text || x.aria).slice(0, 40),
              buttons: [...document.querySelectorAll('button')].map(b => ({
                text: (b.textContent || '').trim(),
                aria: b.getAttribute('aria-label'),
                title: b.getAttribute('title'),
                cls: b.className
              })).filter(x => x.text || x.aria || x.title).slice(0, 40),
              bodyText: (document.body?.innerText || '').slice(0, 3000)
            }));
            console.log('FALLBACK_DOM', JSON.stringify(info));
            await browser.close();
          })().catch(e => { console.error(e); process.exit(1); });
          NODE
      - name: Remove inspector
        if: always()
        run: |
          git config user.name "MatlockFT"
          git config user.email "fighttalkmma@protonmail.com"
          git rm .github/workflows/inspect-youtube-fallback.yml
          git commit -m "Remove YouTube fallback inspector" || exit 0
          git push origin HEAD:main
