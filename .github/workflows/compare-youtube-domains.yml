name: Compare YouTube embed domains

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/compare-youtube-domains.yml"

permissions:
  contents: write

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-save --no-package-lock @playwright/test@1.55.0
      - name: Compare embed domains
        run: |
          node <<'NODE'
          const { chromium } = require('@playwright/test');
          (async () => {
            const browser = await chromium.launch({ channel: 'chrome' });
            for (const host of ['www.youtube.com', 'www.youtube-nocookie.com']) {
              const page = await browser.newPage();
              const url = `https://${host}/embed/cv2svtEOyIw?autoplay=1&mute=1&controls=1&playsinline=1`;
              await page.goto(url, { waitUntil: 'domcontentloaded', timeout: 45000 });
              await page.waitForTimeout(8000);
              const info = await page.evaluate(() => {
                const v = document.querySelector('video');
                return {
                  title: document.title,
                  bodyText: (document.body?.innerText || '').slice(0, 1500),
                  video: v ? {
                    paused: v.paused,
                    currentTime: v.currentTime,
                    duration: Number.isFinite(v.duration) ? v.duration : null,
                    readyState: v.readyState,
                    networkState: v.networkState,
                    currentSrc: v.currentSrc,
                    muted: v.muted,
                    error: v.error ? { code: v.error.code, message: v.error.message } : null
                  } : null
                };
              });
              console.log('DOMAIN_RESULT', host, JSON.stringify(info));
              await page.close();
            }
            await browser.close();
          })().catch(e => { console.error(e); process.exit(1); });
          NODE
      - name: Remove comparison
        if: always()
        run: |
          git config user.name "MatlockFT"
          git config user.email "fighttalkmma@protonmail.com"
          git rm .github/workflows/compare-youtube-domains.yml
          git commit -m "Remove YouTube domain comparison" || exit 0
          git push origin HEAD:main
