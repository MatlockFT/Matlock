name: Update Matchmaker data
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'matchmaker.html'
      - 'assets/matchmaker*'
      - 'assets/data/matchmaker/**'
      - 'scripts/matchmaker/**'
      - '.github/workflows/update-matchmaker.yml'
  push:
    branches:
      - main
    paths:
      - 'assets/matchmaker-engine.js'
      - 'assets/matchmaker-public.js'
      - 'scripts/matchmaker/update-matchmaker.mjs'
      - 'scripts/matchmaker/check-matchmaker.mjs'
      - 'scripts/matchmaker/**'
      - '.github/workflows/update-matchmaker.yml'
  schedule:
    # Weekdays: refresh the verified roster/history every four hours.
    - cron: '37 */4 * * 1-5'
    # Fight weekends: refresh hourly so newly posted UFCStats history propagates quickly.
    - cron: '17 * * * 0,6'
permissions:
  contents: write
concurrency:
  group: matchmaker-data
  cancel-in-progress: false
jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate Matchmaker
        run: |
          node --check assets/matchmaker.js
          node --check assets/matchmaker-public.js
          node --check assets/matchmaker-simple.js
          node --check assets/matchmaker-engine.js
          node --check scripts/matchmaker/enrich-official-portraits.mjs
          node --check scripts/matchmaker/enrich-verified-history.mjs
          node --check scripts/matchmaker/history-reconcile.mjs
          node --check scripts/matchmaker/profile-contradictions.mjs
          node --check scripts/matchmaker/check-verified-history-v2.mjs
          node --check scripts/matchmaker/check-career-lanes.mjs
          node --check scripts/matchmaker/check-career-states.mjs
          node --check scripts/matchmaker/check-eligible-recommendations.mjs
          node --check scripts/matchmaker/check-ranked-hierarchy.mjs
          node --check scripts/matchmaker/check-recent-form-quality.mjs
          node --check scripts/matchmaker/check-title-claims.mjs
          node --check scripts/matchmaker/check-opportunity-cost.mjs
          node --check scripts/matchmaker/check-contextual-rematches.mjs
          node --check scripts/matchmaker/check-turnaround-timing.mjs
          node --check scripts/matchmaker/audit-recommendations.mjs
          node --check scripts/matchmaker/backtest-recommendations.mjs
          node scripts/matchmaker/enrich-official-portraits.mjs --self-test
          node scripts/matchmaker/check-verified-history-v2.mjs
          node scripts/matchmaker/check-career-lanes.mjs
          node scripts/matchmaker/check-career-states.mjs
          node scripts/matchmaker/check-eligible-recommendations.mjs
          node scripts/matchmaker/check-ranked-hierarchy.mjs
          node scripts/matchmaker/check-recent-form-quality.mjs
          node scripts/matchmaker/check-title-claims.mjs
          node scripts/matchmaker/check-opportunity-cost.mjs
          node scripts/matchmaker/check-contextual-rematches.mjs
          node scripts/matchmaker/check-turnaround-timing.mjs
          node scripts/matchmaker/check-public-recommendations.mjs
          node scripts/matchmaker/check-ui-readability.mjs
          node scripts/matchmaker/check-matchmaker.mjs
      - name: Build Jekyll site
        uses: actions/jekyll-build-pages@v1
      - name: Check built internal links and assets
        run: node scripts/qa/check-site.mjs _site

  update:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/cache@v4
        with:
          path: .cache/matchmaker
          key: matchmaker-profiles-${{ github.run_id }}
          restore-keys: matchmaker-profiles-
      - name: Collect and atomically validate official data
        run: node scripts/matchmaker/update-matchmaker.mjs
      - name: Prefer official UFC athlete portraits
        run: node scripts/matchmaker/enrich-official-portraits.mjs
      - name: Apply official ranking identity aliases
        run: node scripts/matchmaker/apply-ranking-identity-aliases.mjs
      - name: Canonicalize verified UFC fight history
        run: node scripts/matchmaker/enrich-verified-history.mjs
      - name: Check verified history invariants
        run: node scripts/matchmaker/check-verified-history-v2.mjs
      - name: Report unverified active histories
        run: node scripts/matchmaker/report-unverified-active.mjs
      - name: Snapshot temporal roster and booking state
        run: node scripts/matchmaker/snapshot-temporal-state.mjs
      - name: Build historical UFC candidate universe
        run: node scripts/matchmaker/build-historical-universe.mjs
      - name: Build Writer fighter autofill index
        run: node scripts/matchmaker/build-writer-fighters.mjs
      - name: Check engine against refreshed data
        run: node scripts/matchmaker/check-matchmaker.mjs
      - name: Audit published recommendations
        run: node scripts/matchmaker/audit-recommendations.mjs
      - name: Backtest recent next-fight recommendations
        run: node scripts/matchmaker/backtest-recommendations-v4.mjs
      - name: Refine historical booking classifications
        run: node scripts/matchmaker/refine-backtest-classifications.mjs
      - name: Commit verified snapshots
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- assets/data/matchmaker assets/data/writer-fighters.json
          git diff --cached --quiet && exit 0
          git commit -m "Refresh verified Matchmaker data"
          # Only generated Matchmaker data is committed here. If main advanced during collection,
          # rebase onto upstream code while favoring this freshly validated generated snapshot.
          git pull --rebase -X theirs origin main
          git push origin HEAD:main
