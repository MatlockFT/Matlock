name: Update Writer fighter data

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'scripts/matchmaker/build-writer-fighters.mjs'
      - 'scripts/matchmaker/sources/ufcstats.mjs'
      - 'scripts/matchmaker/sources/ufc.mjs'
      - 'scripts/matchmaker/sources/sherdog.mjs'
      - 'assets/data/writer-fighter-career-fallbacks.json'
      - '.github/workflows/update-writer-fighters.yml'
  schedule:
    # Fighter data is lightweight enough to refresh hourly. Commits occur only when data changes.
    - cron: '23 * * * *'

permissions:
  contents: write

concurrency:
  group: writer-fighter-data
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Build verified Writer fighter index
        run: node scripts/matchmaker/build-writer-fighters.mjs

      - name: Validate generated fighter index
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const data = JSON.parse(fs.readFileSync('assets/data/writer-fighters.json', 'utf8'));
          const current = JSON.parse(fs.readFileSync('assets/data/matchmaker/current.json', 'utf8'));
          if (data.schemaVersion !== 1) throw new Error('Unexpected Writer fighter schema.');
          if (!Array.isArray(data.fighters) || data.fighters.length < 500) throw new Error('Writer fighter index is implausibly small.');
          const expectedFighters = (current.fighters || []).filter(fighter => fighter.id && fighter.name);
          if (data.fighters.length !== expectedFighters.length) {
            throw new Error('Writer fighter directory dropped roster identities: ' + data.fighters.length + '/' + expectedFighters.length);
          }
          if (!data.mirrorThrough) throw new Error('Writer fighter index is missing mirror freshness.');
          const completeStats = fighter => (
            fighter.stats &&
            fighter.stats.slpm != null &&
            fighter.stats.sapm != null &&
            fighter.stats.strAccuracy != null &&
            fighter.stats.strDefense != null &&
            fighter.stats.tdAvg != null &&
            fighter.stats.tdAccuracy != null &&
            fighter.stats.tdDefense != null &&
            fighter.stats.subAvg != null
          );
          const completeCareer = fighter => (
            fighter.career &&
            Number.isFinite(fighter.career.totalFinishes) &&
            Number.isFinite(fighter.career.winsByKnockout) &&
            Number.isFinite(fighter.career.winsBySubmission) &&
            Number.isFinite(fighter.career.unanimousDecisionWins) &&
            Number.isFinite(fighter.career.splitDecisionWins)
          );
          const statsCount = data.fighters.filter(completeStats).length;
          const careerCount = data.fighters.filter(completeCareer).length;
          if (statsCount < 400) throw new Error('Writer fighter stat coverage is implausibly low: ' + statsCount);
          if (careerCount < 650) {
            const missing = data.fighters.filter(fighter => !completeCareer(fighter)).slice(0, 20).map(fighter => fighter.name);
            throw new Error('Writer fighter career coverage collapsed: ' + careerCount + '/' + data.fighters.length + '; examples: ' + missing.join(', '));
          }
          const missingBooked = expectedFighters.filter(fighter => fighter.booking && !data.fighters.some(item => item.id === fighter.id));
          if (missingBooked.length) {
            throw new Error('Booked fighters are missing from Writer autocomplete: ' + missingBooked.map(fighter => fighter.name).join(', '));
          }
          const incompleteBooked = data.fighters.filter(fighter => fighter.booking && !completeCareer(fighter));
          if (incompleteBooked.length) {
            console.warn(
              'Booked fighters will use verified live career fallback on selection: ' +
              incompleteBooked.map(fighter => fighter.name).join(', ')
            );
          }

          // Brad is a regression sentinel because this exact veteran profile exposed a partial-autofill bug.
          // If a future source/parser change would recreate blank Tale or Stats fields, do not publish it.
          const brad = data.fighters.find(fighter => fighter.name === 'Brad Tavares');
          if (!brad) throw new Error('Brad Tavares regression sentinel is missing from Writer fighter data.');
          const bradRequired = {
            record: brad.record,
            ufcRecord: brad.ufcRecord,
            recordOutsideUfc: brad.recordOutsideUfc,
            height: brad.bio?.height,
            reach: brad.bio?.reach,
            dob: brad.bio?.dob
          };
          const missingBradProfile = Object.entries(bradRequired).filter(([, value]) => !String(value || '').trim());
          if (missingBradProfile.length) {
            throw new Error('Brad Tavares profile regression: missing ' + missingBradProfile.map(([key]) => key).join(', '));
          }
          if (!completeStats(brad)) throw new Error('Brad Tavares regression: one or more of the 8 Writer stats is missing.');
          if (!completeCareer(brad)) throw new Error('Brad Tavares regression: one or more career Tale values is missing.');
          if (!Array.isArray(brad.recent) || brad.recent.length < 5) {
            throw new Error('Brad Tavares regression: recent form is incomplete.');
          }

          const duplicateStatsIds = data.fighters
            .filter(f => f.ufcStatsId)
            .map(f => f.ufcStatsId)
            .filter((id, index, all) => all.indexOf(id) !== index);
          if (duplicateStatsIds.length) throw new Error('Duplicate UFCStats identities in Writer fighter index.');
          console.log(JSON.stringify({
            generatedAt: data.generatedAt,
            builtAt: data.builtAt,
            mirrorThrough: data.mirrorThrough,
            fighters: data.fighters.length,
            statsCount,
            careerCount,
            brad: {
              record: brad.record,
              ufcRecord: brad.ufcRecord,
              latestBoutDate: brad.latestBoutDate,
              statsFights: brad.stats?.sample?.fights,
              career: brad.career
            }
          }, null, 2));
          NODE

      - name: Commit refreshed fighter data
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- assets/data/writer-fighters.json
          git diff --cached --quiet && exit 0
          git commit -m "Refresh Writer fighter data"
          git pull --rebase -X theirs origin main
          git push origin HEAD:main
