name: Matchmaker build
on:
  pull_request:
    paths:
      - 'matchmaker.html'
      - 'assets/matchmaker*'
      - 'assets/data/matchmaker/**'
      - 'scripts/*matchmaker*'
      - 'scripts/matchmaker/**'
      - '.github/workflows/matchmaker-build.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate Matchmaker
        run: |
          node --check assets/matchmaker.js
          node --check assets/matchmaker-public.js
          node --check assets/matchmaker-simple.js
          node --check assets/matchmaker-engine.js
          node --check scripts/matchmaker/enrich-official-portraits.mjs
          node --check scripts/matchmaker/enrich-verified-history.mjs
          node --check scripts/matchmaker/history-reconcile.mjs
          node --check scripts/matchmaker/profile-contradictions.mjs
          node --check scripts/matchmaker/check-verified-history-v2.mjs
          node --check scripts/matchmaker/check-career-lanes.mjs
          node scripts/matchmaker/enrich-official-portraits.mjs --self-test
          node scripts/matchmaker/check-verified-history-v2.mjs
          node scripts/matchmaker/check-career-lanes.mjs
          node scripts/matchmaker/check-public-recommendations.mjs
          node scripts/matchmaker/check-ui-readability.mjs
          node scripts/check-matchmaker.mjs
      - name: Build Jekyll site
        uses: actions/jekyll-build-pages@v1
      - name: Check built internal links and assets
        run: node scripts/check-site.mjs _site