name: OTD poster asset probe

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/otd-poster-probe.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OTD_CURRENT_WINDOW_DAYS: "2"
      OTD_TIME_ZONE: "America/Chicago"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply final deterministic poster registry
        run: node scripts/apply-on-this-day-current-poster-fallbacks.mjs
      - name: Normalize image metadata
        run: node scripts/finalize-on-this-day-image-metadata.mjs
      - name: Run strict current-window poster QA
        run: npm run check:history-images
