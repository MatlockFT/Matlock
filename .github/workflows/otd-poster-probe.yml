name: OTD poster asset probe

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/otd-poster-probe.yml"
      - "scripts/probe-otd-poster-assets.mjs"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Probe official and Wikipedia poster assets
        run: node scripts/probe-otd-poster-assets.mjs
