name: Preview Pages CMS article

on:
  workflow_dispatch:
    inputs:
      payload:
        description: Pages CMS payload as JSON
        required: true
        type: string

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out current branch
        uses: actions/checkout@v4

      - name: Read Pages CMS article context
        id: context
        shell: bash
        env:
          PAGES_CMS_PAYLOAD: ${{ inputs.payload }}
        run: |
          article_path="$(printf '%s' "$PAGES_CMS_PAYLOAD" | jq -r '.context.path // empty')"
          echo "article_path=$article_path" >> "$GITHUB_OUTPUT"

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Build draft preview
        run: bundle exec jekyll build --unpublished --future --destination _site-preview

      - name: Upload preview
        uses: actions/upload-artifact@v4
        with:
          name: article-preview
          path: _site-preview
          retention-days: 3

      - name: Explain preview access
        shell: bash
        run: |
          {
            echo "## Article preview built"
            if [ -n "${{ steps.context.outputs.article_path }}" ]; then
              echo ""
              echo "Pages CMS entry: \`${{ steps.context.outputs.article_path }}\`"
            fi
            echo ""
            echo "Download the **article-preview** artifact from this workflow run."
            echo "The artifact contains the full Jekyll preview build, including unpublished and future-dated posts."
          } >> "$GITHUB_STEP_SUMMARY"
