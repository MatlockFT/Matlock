name: Preview Pages CMS article

on:
  workflow_dispatch:
    inputs:
      payload:
        description: Pages CMS payload as JSON
        required: true
        type: string

permissions:
  contents: write
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.context.outputs.preview_url }}

    steps:
      - name: Check out current branch
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Read Pages CMS article context
        id: context
        shell: bash
        env:
          PAGES_CMS_PAYLOAD: ${{ inputs.payload }}
        run: |
          article_path="$(printf '%s' "$PAGES_CMS_PAYLOAD" | jq -r '.context.path // empty')"

          if [[ -z "$article_path" || "$article_path" != _posts/*.md || ! -f "$article_path" ]]; then
            echo "Pages CMS did not provide a valid article path." >&2
            exit 1
          fi

          ARTICLE_PATH="$article_path" python3 <<'PY' >> "$GITHUB_OUTPUT"
          import os
          import re
          from pathlib import Path

          path = Path(os.environ['ARTICLE_PATH'])
          text = path.read_text(encoding='utf-8')
          filename = path.stem

          filename_match = re.match(r'^\d{4}-\d{2}-\d{2}-(.+)$', filename)
          if not filename_match:
              raise SystemExit(f'Unsupported post filename: {path.name}')

          frontmatter = re.match(r'^---\n([\s\S]*?)\n---', text)
          if not frontmatter:
              raise SystemExit(f'Missing YAML frontmatter: {path}')

          date_match = re.search(r'^date:\s*["\']?([^"\'\s]+)', frontmatter.group(1), re.M)
          if not date_match:
              raise SystemExit(f'Missing publication date: {path}')

          date = date_match.group(1)[:10]
          if not re.fullmatch(r'\d{4}-\d{2}-\d{2}', date):
              raise SystemExit(f'Unsupported publication date: {date}')

          year, month, day = date.split('-')
          slug = filename_match.group(1)
          preview_key = re.sub(r'[^A-Za-z0-9._-]+', '-', filename).strip('-')
          rendered_path = f'_site-draft/{year}/{month}/{day}/{slug}.html'
          preview_path = f'_site/preview/{preview_key}/index.html'
          source_preview_path = f'preview/{preview_key}/index.html'
          preview_url = f'https://mmamatlock.com/preview/{preview_key}/'

          print(f'article_path={path.as_posix()}')
          print(f'rendered_path={rendered_path}')
          print(f'preview_path={preview_path}')
          print(f'source_preview_path={source_preview_path}')
          print(f'preview_url={preview_url}')
          PY

      - name: Make selected article renderable for preview
        shell: bash
        env:
          ARTICLE_PATH: ${{ steps.context.outputs.article_path }}
        run: |
          python3 <<'PY'
          import os
          import re
          from pathlib import Path

          path = Path(os.environ['ARTICLE_PATH'])
          text = path.read_text(encoding='utf-8')

          if re.search(r'^published:\s*(?:true|false)\s*$', text, re.M):
              text = re.sub(
                  r'^published:\s*(?:true|false)\s*$',
                  'published: true',
                  text,
                  count=1,
                  flags=re.M,
              )
          else:
              text = text.replace('\n---\n', '\npublished: true\n---\n', 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Build draft-capable site
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site-draft
          future: true

      - name: Isolate rendered article
        shell: bash
        env:
          RENDERED_PATH: ${{ steps.context.outputs.rendered_path }}
          ARTICLE_PATH: ${{ steps.context.outputs.article_path }}
        run: |
          if [[ ! -f "$RENDERED_PATH" ]]; then
            echo "Rendered article was not found at $RENDERED_PATH" >&2
            find _site-draft -maxdepth 5 -type f -name '*.html' | sort | tail -100 >&2
            exit 1
          fi

          cp "$RENDERED_PATH" /tmp/matlock-article-preview.html
          sudo rm -rf _site-draft
          git checkout -- "$ARTICLE_PATH"

      - name: Build normal site
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - name: Prepare normal build for preview injection
        shell: bash
        run: |
          sudo chown -R "$(id -u):$(id -g)" _site

      - name: Add selected article to visual preview path
        shell: bash
        env:
          PREVIEW_PATH: ${{ steps.context.outputs.preview_path }}
        run: |
          mkdir -p "$(dirname "$PREVIEW_PATH")"
          cp /tmp/matlock-article-preview.html "$PREVIEW_PATH"

          python3 <<'PY'
          import os
          import re
          from pathlib import Path

          path = Path(os.environ['PREVIEW_PATH'])
          html = path.read_text(encoding='utf-8')

          robots = '<meta name="robots" content="noindex,nofollow,noarchive">'
          html, robots_count = re.subn(
              r'<meta\s+name=["\']robots["\'][^>]*>',
              robots,
              html,
              count=1,
              flags=re.I,
          )
          if robots_count == 0:
              html = html.replace('</head>', f'  {robots}\n</head>', 1)

          banner = '''<div id="matlock-preview-banner" style="position:fixed;right:14px;top:14px;z-index:2147483647;background:#111;color:#fff;border:1px solid rgba(255,255,255,.35);border-radius:8px;padding:9px 12px;font:700 12px/1.2 Arial,sans-serif;letter-spacing:.08em;box-shadow:0 4px 18px rgba(0,0,0,.35);">VISUAL PREVIEW</div>'''

          html, count = re.subn(
              r'(<body\b[^>]*>)',
              r'\1' + banner,
              html,
              count=1,
              flags=re.I,
          )
          if count == 0:
              raise SystemExit('Could not find <body> in rendered preview HTML')

          path.write_text(html, encoding='utf-8')
          PY

      - name: Verify preview artifact
        shell: bash
        env:
          PREVIEW_PATH: ${{ steps.context.outputs.preview_path }}
        run: |
          test -s "$PREVIEW_PATH"
          grep -q 'id="matlock-preview-banner"' "$PREVIEW_PATH"
          grep -q 'noindex,nofollow,noarchive' "$PREVIEW_PATH"

      - name: Persist preview for future site deployments
        shell: bash
        env:
          PREVIEW_PATH: ${{ steps.context.outputs.preview_path }}
          SOURCE_PREVIEW_PATH: ${{ steps.context.outputs.source_preview_path }}
          ARTICLE_PATH: ${{ steps.context.outputs.article_path }}
        run: |
          set -euo pipefail

          mkdir -p "$(dirname "$SOURCE_PREVIEW_PATH")"
          cp "$PREVIEW_PATH" "$SOURCE_PREVIEW_PATH"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "$SOURCE_PREVIEW_PATH"

          if git diff --cached --quiet; then
            echo "Persistent preview is already current."
            exit 0
          fi

          git commit -m "Update Pages CMS preview for ${ARTICLE_PATH##*/} [skip ci]"

          for attempt in 1 2 3; do
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              echo "Persistent preview saved to $SOURCE_PREVIEW_PATH"
              exit 0
            fi

            echo "Preview push raced with another commit; rebasing (attempt $attempt/3)."
            git fetch origin "${GITHUB_REF_NAME}"
            git rebase "origin/${GITHUB_REF_NAME}"
          done

          echo "Could not persist preview after three attempts." >&2
          exit 1

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

      - name: Wait for older Pages deployments
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs?per_page=100"

          for attempt in $(seq 1 30); do
            active="$(curl -fsSL \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$api" | jq '[.workflow_runs[] | select(.name == "pages build and deployment" and (.status == "queued" or .status == "in_progress" or .status == "pending"))] | length')"

            if [[ "$active" == "0" ]]; then
              echo "No older normal Pages deployment is still running."
              exit 0
            fi

            echo "Waiting for $active normal Pages deployment(s) to finish (attempt $attempt/30)."
            sleep 5
          done

          echo "Normal Pages deployment queue did not clear in time." >&2
          exit 1

      - name: Deploy visual preview
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify deployed preview
        shell: bash
        env:
          PREVIEW_URL: ${{ steps.context.outputs.preview_url }}
        run: |
          for attempt in $(seq 1 18); do
            status="$(curl -L -sS -o /tmp/deployed-preview.html -w '%{http_code}' "$PREVIEW_URL" || true)"
            if [[ "$status" == "200" ]] && grep -q 'id="matlock-preview-banner"' /tmp/deployed-preview.html; then
              echo "Preview is live: $PREVIEW_URL"
              exit 0
            fi

            echo "Preview not ready yet (attempt $attempt/18, HTTP ${status:-error})."
            sleep 5
          done

          echo "Preview deployment completed, but the preview URL did not become readable in time." >&2
          exit 1

      - name: Show preview link
        if: always()
        shell: bash
        run: |
          {
            echo "## Visual article preview"
            echo ""
            echo "[Open the visual preview](${{ steps.context.outputs.preview_url }})"
            echo ""
            echo "Article: \`${{ steps.context.outputs.article_path }}\`"
            echo ""
            echo "This preview is noindex and is persisted so later normal site deployments keep the preview URL working."
          } >> "$GITHUB_STEP_SUMMARY"
