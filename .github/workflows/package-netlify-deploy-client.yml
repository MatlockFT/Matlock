name: Package Netlify deploy client

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/package-netlify-deploy-client.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Netlify MCP client
        run: |
          mkdir -p .netlify-deploy-client
          cd .netlify-deploy-client
          npm init -y >/dev/null
          npm install --ignore-scripts --no-audit --no-fund @netlify/mcp@1.16.0
      - name: Upload deploy client
        uses: actions/upload-artifact@v4
        with:
          name: netlify-deploy-client
          path: .netlify-deploy-client
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
