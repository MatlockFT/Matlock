        if (!marker?.isConnected) return;
        try { marker.focus({ preventScroll: true }); } catch (_) { marker.focus(); }
        marker.dispatchEvent(new KeyboardEvent('keydown', {
            key: 'Enter',
            code: 'Enter',
            bubbles: false,
            cancelable: true
