name: One-time Event Map hardening

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/event-map-hardening-once.yml

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 6

      - name: Recover and run hardening patch
        shell: bash
        run: |
          set -euo pipefail
          git show 5a217ecd05ed5ca673d467042d6df549ee9ce65e:.github/workflows/event-map-hardening-once.yml > /tmp/previous-hardening.yml
          python3 - <<'PY'
          from pathlib import Path
          lines = Path('/tmp/previous-hardening.yml').read_text(encoding='utf-8').splitlines()
          start = next(i for i, line in enumerate(lines) if "python3 - <<'PY'" in line) + 1
          end = next(i for i in range(start, len(lines)) if lines[i].strip() == 'PY')
          body = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines[start:end]) + '\n'

          cluster_needle = "text = replace_once(text, old_cluster_loop, new_cluster_loop, 'cluster detail rows')"
          cluster_replacement = """pattern_cluster_rows = re.compile(r\"        ordered\\.forEach\\(event => \\{.*?\\n        \\}\\);\\n    \\}\\n\\n    function scrollDetailOnMobile\", re.S)\ntext, count = pattern_cluster_rows.subn(new_cluster_loop + \"\\n    function scrollDetailOnMobile\", text, count=1)\nif count != 1:\n    raise SystemExit('Patch target not found: cluster detail rows')"""
          if cluster_needle not in body:
              raise SystemExit('Could not locate cluster-row patch operation')
          body = body.replace(cluster_needle, cluster_replacement, 1)

          selection_needle = "text = replace_once(text, old_selection, new_selection, 'selection state machine')"
          selection_replacement = """pattern_selection = re.compile(r\"    function selectEvent\\(event,.*?\\n    function renderSelectedState\\(\\) \\{\", re.S)\ntext, count = pattern_selection.subn(new_selection + \"\\n    function renderSelectedState() {\", text, count=1)\nif count != 1:\n    raise SystemExit('Patch target not found: selection state machine')"""
          if selection_needle not in body:
              raise SystemExit('Could not locate selection patch operation')
          body = body.replace(selection_needle, selection_replacement, 1)

          Path('/tmp/event-map-hardening.py').write_text(body, encoding='utf-8')
          PY
          python3 /tmp/event-map-hardening.py

      - name: Validate patched source and data
        shell: bash
        run: |
          set -euo pipefail
          node --check assets/event-map-v2.js
          node --check assets/event-map-deferred.js
          node --check assets/event-map-enhancements.js
          node --check scripts/validate-event-map-quality.mjs
          node --check scripts/check-event-map-architecture.mjs
          node --check scripts/event-map-smoke.spec.cjs
          node scripts/validate-event-map-regional.mjs
          node scripts/validate-event-map-quality.mjs
          node scripts/check-event-map-architecture.mjs
          ! test -e assets/event-map-detail.js

      - name: Commit hardening pass
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Harden Event Map interactions and mobile behavior"
          git pull --rebase origin main
          git push origin HEAD:main
