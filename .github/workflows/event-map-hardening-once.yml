          text = read(path)
          text = text.replace('          node --check assets/event-map-detail.js\n', '')
          text = replace_once(text,
          """          node --check scripts/validate-event-map-regional.mjs
          node --check scripts/validate-regional-picker.mjs""",
          """          node --check scripts/validate-event-map-regional.mjs
          node --check scripts/validate-event-map-quality.mjs
          node --check scripts/check-event-map-architecture.mjs
          node --check scripts/validate-regional-picker.mjs""",
          'site-quality script syntax list')
          text = replace_once(text,
          """      - name: Check regional Event Map data
        run: node scripts/validate-event-map-regional.mjs

      - name: Check bundled MMA news data""",
          """      - name: Check regional Event Map data
        run: node scripts/validate-event-map-regional.mjs

      - name: Check Event Map quality and interaction architecture
        run: |
          node scripts/validate-event-map-quality.mjs
          node scripts/check-event-map-architecture.mjs

      - name: Check bundled MMA news data""",
          'site-quality Event Map checks')
          write(path, text)

          # Asset bump so production smoke can wait for this exact hardening pass.
          path = '_config.yml'
          text = read(path)
          match = re.search(r'asset_version:\s*"(\d+)"', text)
          if not match:
              raise SystemExit('asset_version not found')
          version = int(match.group(1))
          text = text[:match.start(1)] + str(version + 1) + text[match.end(1):]
          write(path, text)

          print(f'Event Map hardening prepared. asset_version {version} -> {version + 1}')
          PY

      - name: Validate patched source and data
        shell: bash
        run: |
          set -euo pipefail
          node --check assets/event-map-v2.js
          node --check assets/event-map-deferred.js
          node --check assets/event-map-enhancements.js
          node --check scripts/validate-event-map-quality.mjs
          node --check scripts/check-event-map-architecture.mjs
          node --check scripts/event-map-smoke.spec.cjs
          node scripts/validate-event-map-regional.mjs
          node scripts/validate-event-map-quality.mjs
          node scripts/check-event-map-architecture.mjs
          grep -q '/assets/event-map-v2.js' event-map.html
          ! test -e assets/event-map-detail.js

      - name: Commit hardening pass
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Harden Event Map interactions and mobile behavior"
          git pull --rebase origin main
          git push origin HEAD:main
