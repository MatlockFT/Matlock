name: One-time Event Map hardening

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/event-map-hardening-once.yml

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 8

      - name: Recover and run hardening patch
        shell: bash
        run: |
          set -euo pipefail
          git show 5a217ecd05ed5ca673d467042d6df549ee9ce65e:.github/workflows/event-map-hardening-once.yml > /tmp/previous-hardening.yml
          python3 - <<'PY'
          from pathlib import Path
          lines = Path('/tmp/previous-hardening.yml').read_text(encoding='utf-8').splitlines()
          start = next(i for i, line in enumerate(lines) if "python3 - <<'PY'" in line) + 1
          end = next(i for i in range(start, len(lines)) if lines[i].strip() == 'PY')
          body = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines[start:end]) + '\n'

          replacements = {
            "text = replace_once(text, old_cluster_loop, new_cluster_loop, 'cluster detail rows')": """pattern_cluster_rows = re.compile(r\"        ordered\\.forEach\\(event => \\{.*?\\n        \\}\\);\\n    \\}\\n\\n    function scrollDetailOnMobile\", re.S)\ntext, count = pattern_cluster_rows.subn(new_cluster_loop + \"\\n    function scrollDetailOnMobile\", text, count=1)\nif count != 1:\n    raise SystemExit('Patch target not found: cluster detail rows')""",
            "text = replace_once(text, old_selection, new_selection, 'selection state machine')": """pattern_selection = re.compile(r\"    function selectEvent\\(event,.*?\\n    function renderSelectedState\\(\\) \\{\", re.S)\ntext, count = pattern_selection.subn(new_selection + \"\\n    function renderSelectedState() {\", text, count=1)\nif count != 1:\n    raise SystemExit('Patch target not found: selection state machine')""",
            "text = replace_once(text, old_selected, new_selected, 'selected marker state')": """pattern_selected = re.compile(r\"    function renderSelectedState\\(\\) \\{.*?\\n    \\}\\n\\n    function renderResultSelectedState\", re.S)\ntext, count = pattern_selected.subn(new_selected + \"\\n    function renderResultSelectedState\", text, count=1)\nif count != 1:\n    raise SystemExit('Patch target not found: selected marker state')""",
            "text = replace_once(text, old_marker_selected, new_marker_selected, 'marker hit targets')": """pattern_marker_selected = re.compile(r\"            \\.attr\\('data-selected', cluster => String\\(.*?groups\\.append\\('circle'\\)\\.attr\\('class', 'event-map-pin-halo'\\)\\.attr\\('r', cluster => cluster\\.events\\.length > 1 \\? 15 : 11\\);\", re.S)\ntext, count = pattern_marker_selected.subn(new_marker_selected, text, count=1)\nif count != 1:\n    raise SystemExit('Patch target not found: marker hit targets')""",
            "text = replace_once(text, old_handlers, new_handlers, 'marker interaction handlers')": """pattern_handlers = re.compile(r\"        groups\\n            \\.on\\('mouseenter'.*?\\n            \\}\\);\\n    \\}\\n\\n    function makeResultButton\", re.S)\ntext, count = pattern_handlers.subn(new_handlers + \"    }\\n\\n    function makeResultButton\", text, count=1)\nif count != 1:\n    raise SystemExit('Patch target not found: marker interaction handlers')"""
          }
          for needle, replacement in replacements.items():
              if needle not in body:
                  raise SystemExit(f'Could not locate patch operation: {needle}')
              body = body.replace(needle, replacement, 1)

          Path('/tmp/event-map-hardening.py').write_text(body, encoding='utf-8')
          PY
          python3 /tmp/event-map-hardening.py

      - name: Validate patched source and data
        shell: bash
        run: |
          set -euo pipefail
          node --check assets/event-map-v2.js
          node --check assets/event-map-deferred.js
          node --check assets/event-map-enhancements.js
          node --check scripts/validate-event-map-quality.mjs
          node --check scripts/check-event-map-architecture.mjs
          node --check scripts/event-map-smoke.spec.cjs
          node scripts/validate-event-map-regional.mjs
          node scripts/validate-event-map-quality.mjs
          node scripts/check-event-map-architecture.mjs
          ! test -e assets/event-map-detail.js

      - name: Commit hardening pass
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Harden Event Map interactions and mobile behavior"
          git pull --rebase origin main
          git push origin HEAD:main
