        detailCard.hidden = true;
        clusterCard.hidden = true;
        detailEmpty.hidden = false;
        currentDetailEvent = null;
    }
''',
          r'''    function showEmptyDetail() {
        detailCard.hidden = true;
        clusterCard.hidden = true;
        detailEmpty.hidden = false;
        currentDetailEvent = null;
        hidePoster();
        setHoverPreview(false);
        updateDetailLock();
