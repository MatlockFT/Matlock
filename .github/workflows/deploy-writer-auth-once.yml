name: Deploy Writer Auth Backend

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/deploy-writer-auth-once.yml"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: _netlify-auth
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"

      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Deploy current backend to Netlify
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: 7321d7b0-10c2-4ce8-a885-2fbdfdd6a623
        run: |
          if [ -z "${NETLIFY_AUTH_TOKEN:-}" ]; then
            echo "NETLIFY_AUTH_TOKEN repository secret is not configured."
            exit 2
          fi
          npx -y netlify-cli@latest deploy --build --prod --site "$NETLIFY_SITE_ID" --auth "$NETLIFY_AUTH_TOKEN"
