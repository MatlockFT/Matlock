name: Update UFC roster tracker

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/update-ufc-roster.yml"
      - "scripts/update-ufc-roster.mjs"
      - "ufc-roster.html"
      - "assets/ufc-roster.js"
      - "assets/ufc-roster.css"
  schedule:
    - cron: "4-59/5 * * * *"

permissions:
  contents: write

concurrency:
  group: ufc-roster-tracker
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download previous roster snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/ufc-roster
          gh release download ufc-roster-data \
            --pattern "ufc-roster-state.json" \
            --dir /tmp/ufc-roster || true

      - name: Check UFC athlete database
        id: collect
        continue-on-error: true
        run: |
          node scripts/update-ufc-roster.mjs \
            --state /tmp/ufc-roster/ufc-roster-state.json \
            --output-state /tmp/ufc-roster-state.json \
            --output-public /tmp/ufc-roster-latest.json

      - name: Publish roster data
        id: publish
        if: steps.collect.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view ufc-roster-data > /dev/null 2>&1; then
            gh release edit ufc-roster-data \
              --title "UFC Roster Tracker Data" \
              --notes-file /tmp/ufc-roster-latest.json
          else
            gh release create ufc-roster-data \
              --title "UFC Roster Tracker Data" \
              --notes-file /tmp/ufc-roster-latest.json \
              --prerelease
          fi

          gh release upload ufc-roster-data \
            /tmp/ufc-roster-state.json \
            --clobber

      - name: Record first live-test result
        if: always()
        env:
          COLLECT_OUTCOME: ${{ steps.collect.outcome }}
          PUBLISH_OUTCOME: ${{ steps.publish.outcome }}
        run: |
          if [ -e .github/ufc-roster-bootstrap.json ]; then
            exit 0
          fi

          node <<'NODE'
          const fs = require('fs');
          let profileCount = null;
          let additionCount = null;
          try {
            const state = JSON.parse(fs.readFileSync('/tmp/ufc-roster-state.json', 'utf8'));
            profileCount = Array.isArray(state.profiles) ? state.profiles.length : null;
            additionCount = Array.isArray(state.additions) ? state.additions.length : null;
          } catch {}
          const result = {
            checkedAt: new Date().toISOString(),
            collect: process.env.COLLECT_OUTCOME || 'unknown',
            publish: process.env.PUBLISH_OUTCOME || 'unknown',
            profileCount,
            additionCount
          };
          fs.writeFileSync('.github/ufc-roster-bootstrap.json', JSON.stringify(result, null, 2) + '\n');
          NODE

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/ufc-roster-bootstrap.json
          git commit -m "Record UFC roster tracker live test"
          git push

      - name: Fail when roster update failed
        if: always()
        env:
          COLLECT_OUTCOME: ${{ steps.collect.outcome }}
          PUBLISH_OUTCOME: ${{ steps.publish.outcome }}
        run: |
          if [ "$COLLECT_OUTCOME" != "success" ] || [ "$PUBLISH_OUTCOME" != "success" ]; then
            exit 1
          fi
