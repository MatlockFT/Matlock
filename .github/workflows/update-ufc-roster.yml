name: Update UFC roster tracker

on:
  workflow_dispatch:
  issues:
    types:
      - opened
  push:
    branches:
      - main
    paths:
      - ".github/workflows/update-ufc-roster.yml"
      - "scripts/update-ufc-roster-v4.mjs"
      - "scripts/filter-ufc-roster-additions.mjs"
      - "scripts/check-ufc-event-cards.mjs"
      - "scripts/normalize-ufc-roster-events.mjs"
      - "scripts/check-ufc-antidoping.mjs"
      - "ufc-roster.html"
      - "assets/ufc-roster.js"
      - "assets/ufc-roster.css"
      - "assets/ufc-roster-backfill.json"
  schedule:
    - cron: "4-59/15 * * * *"

permissions:
  contents: write

concurrency:
  group: ufc-roster-tracker
  cancel-in-progress: true

jobs:
  update:
    if: >-
      github.event_name != 'issues' ||
      (github.event.issue.title == 'Run UFC roster validation' && github.actor == github.repository_owner)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download previous roster snapshot
        id: previous_state
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/ufc-roster

          if gh release view ufc-roster-data > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            gh release download ufc-roster-data \
              --pattern "ufc-roster-state.json" \
              --dir /tmp/ufc-roster \
              --clobber

            test -s /tmp/ufc-roster/ufc-roster-state.json
            jq -e '
              type == "object" and
              (.collectorId | type == "string") and
              (.activeProfiles | type == "array") and
              (.activeProfiles | length >= 500)
            ' /tmp/ufc-roster/ufc-roster-state.json > /dev/null
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "No prior roster-data release exists; this run will establish the first baseline."
          fi

      - name: Check UFC active roster
        id: roster_check
        shell: bash
        run: |
          set +e
          node scripts/update-ufc-roster-v4.mjs \
            --state /tmp/ufc-roster/ufc-roster-state.json \
            --backfill assets/ufc-roster-backfill.json \
            --output-state /tmp/ufc-roster-state.json \
            --output-public /tmp/ufc-roster-latest.json \
            2>&1 | tee /tmp/ufc-roster-run.log
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit "$code"

      - name: Preserve competition cross-check history
        if: steps.roster_check.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail

          if [ -s /tmp/ufc-roster/ufc-roster-state.json ]; then
            jq -s '
              .[0] as $new |
              .[1] as $old |
              $new
              | .reactivations = ($new.reactivations // $old.reactivations // [])
              | .backfillCompetitionChecks = ($new.backfillCompetitionChecks // $old.backfillCompetitionChecks // {})
              | .competitionRuleVersion = ($new.competitionRuleVersion // $old.competitionRuleVersion // 0)
            ' \
              /tmp/ufc-roster-state.json \
              /tmp/ufc-roster/ufc-roster-state.json \
              > /tmp/ufc-roster-state-merged.json
            mv /tmp/ufc-roster-state-merged.json /tmp/ufc-roster-state.json
          fi

      - name: Cross-check official UFC event cards
        id: event_card_check
        if: steps.roster_check.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          node scripts/check-ufc-event-cards.mjs \
            --state /tmp/ufc-roster-state.json \
            --public /tmp/ufc-roster-latest.json \
            --previous /tmp/ufc-roster/ufc-roster-state.json \
            2>&1 | tee -a /tmp/ufc-roster-run.log

      - name: Normalize newcomer confirmation paths
        if: steps.event_card_check.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          node scripts/normalize-ufc-roster-events.mjs \
            --state /tmp/ufc-roster-state.json \
            --public /tmp/ufc-roster-latest.json \
            2>&1 | tee -a /tmp/ufc-roster-run.log

      - name: Cross-check prior UFC competition
        id: competition_check
        if: steps.event_card_check.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          node scripts/filter-ufc-roster-additions.mjs \
            --state /tmp/ufc-roster-state.json \
            --public /tmp/ufc-roster-latest.json \
            --backfill assets/ufc-roster-backfill.json \
            2>&1 | tee -a /tmp/ufc-roster-run.log

      - name: Finalize newcomer confirmation paths
        id: finalize_check
        if: steps.competition_check.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          node scripts/normalize-ufc-roster-events.mjs \
            --state /tmp/ufc-roster-state.json \
            --public /tmp/ufc-roster-latest.json \
            --finalize-public \
            2>&1 | tee -a /tmp/ufc-roster-run.log

      - name: Cross-check UFC anti-doping test history
        id: antidoping_check
        if: steps.finalize_check.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          node scripts/check-ufc-antidoping.mjs \
            --state /tmp/ufc-roster-state.json \
            --previous /tmp/ufc-roster/ufc-roster-state.json

      - name: Publish roster data
        id: publish
        if: steps.antidoping_check.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          if gh release view ufc-roster-data > /dev/null 2>&1; then
            gh release edit ufc-roster-data \
              --title "UFC Roster Tracker Data" \
              --notes-file /tmp/ufc-roster-latest.json
          else
            gh release create ufc-roster-data \
              --title "UFC Roster Tracker Data" \
              --notes-file /tmp/ufc-roster-latest.json \
              --prerelease
          fi

          gh release upload ufc-roster-data \
            /tmp/ufc-roster-state.json \
            /tmp/ufc-roster-latest.json \
            --clobber

      - name: Record live validation
        if: >-
          always() &&
          !cancelled() &&
          github.event_name != 'schedule' &&
          steps.roster_check.outcome != 'skipped'
        env:
          GH_TOKEN: ${{ github.token }}
          CHECK_RESULT: ${{ steps.roster_check.outcome }}
          EVENT_CARD_RESULT: ${{ steps.event_card_check.outcome }}
          CROSSCHECK_RESULT: ${{ steps.competition_check.outcome }}
          FINALIZE_RESULT: ${{ steps.finalize_check.outcome }}
          ANTIDOPING_RESULT: ${{ steps.antidoping_check.outcome }}
          PUBLISH_RESULT: ${{ steps.publish.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, re
          from datetime import datetime, timezone
          from pathlib import Path

          log = Path('/tmp/ufc-roster-run.log').read_text(errors='replace') if Path('/tmp/ufc-roster-run.log').exists() else ''
          match = re.search(r'Validated active UFC roster: (\d+) fighters via (.+?) \((.+?)\)\.', log)
          check_result = os.environ.get('CHECK_RESULT', '')
          event_card_result = os.environ.get('EVENT_CARD_RESULT', '')
          crosscheck_result = os.environ.get('CROSSCHECK_RESULT', '')
          finalize_result = os.environ.get('FINALIZE_RESULT', '')
          antidoping_result = os.environ.get('ANTIDOPING_RESULT', '')
          publish_result = os.environ.get('PUBLISH_RESULT', '')
          payload = {
              'checkedAt': datetime.now(timezone.utc).isoformat(),
              'outcome': check_result,
              'eventCardOutcome': event_card_result,
              'crossCheckOutcome': crosscheck_result,
              'finalizeOutcome': finalize_result,
              'antiDopingOutcome': antidoping_result,
              'publishOutcome': publish_result,
              'validated': (
                  bool(match)
                  and check_result == 'success'
                  and event_card_result == 'success'
                  and crosscheck_result == 'success'
                  and finalize_result == 'success'
                  and antidoping_result == 'success'
                  and publish_result == 'success'
              ),
              'activeCount': int(match.group(1)) if match else None,
              'source': match.group(2) if match else None,
              'mode': match.group(3) if match else None,
              'tail': log.splitlines()[-120:],
          }
          Path('/tmp/ufc-active-live-validation.json').write_text(json.dumps(payload, indent=2) + '\n')
          PY

          content="$(base64 -w0 /tmp/ufc-active-live-validation.json)"
          existing_sha="$(gh api "repos/${GITHUB_REPOSITORY}/contents/.github/ufc-active-live-validation.json?ref=main" --jq '.sha' 2>/dev/null || true)"

          if [ -n "$existing_sha" ]; then
            gh api \
              --method PUT \
              "repos/${GITHUB_REPOSITORY}/contents/.github/ufc-active-live-validation.json" \
              -f message="Refresh live UFC active roster validation" \
              -f content="$content" \
              -f sha="$existing_sha" \
              -f branch="main"
          else
            gh api \
              --method PUT \
              "repos/${GITHUB_REPOSITORY}/contents/.github/ufc-active-live-validation.json" \
              -f message="Record live UFC active roster validation" \
              -f content="$content" \
              -f branch="main"
          fi
