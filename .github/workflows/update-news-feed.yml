name: Update MMA news feed

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/update-news-feed.yml"
      - "package.json"
      - "package-lock.json"
      - "scripts/news/build-news-feed.mjs"
      - "scripts/news/build-broadcast-videos.mjs"
      - "scripts/news/build-japan-mma-news.mjs"
      - "scripts/news/japan-mma-glossary.json"
      - "scripts/news/dedupe-news-headlines.mjs"
      - "scripts/news/check-news-data.mjs"
      - "assets/data/news-lead-override.json"
      - "assets/data/news-refresh-trigger.json"
  schedule:
    - cron: "2-57/5 * * * *"

permissions:
  contents: write

concurrency:
  group: mma-news-feed
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Reuse previous article preview images
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/releases/tags/mma-news-data" \
            --jq '.body' > /tmp/mma-news-previous.json || true

      - name: Collect current MMA stories
        run: >-
          npm run update:news --
          --output /tmp/mma-news.json
          --previous /tmp/mma-news-previous.json

      - name: Remove duplicate normalized headlines
        run: node scripts/news/dedupe-news-headlines.mjs /tmp/mma-news.json

      - name: Validate generated news
        run: npm run check:news -- /tmp/mma-news.json

      - name: Collect Japanese MMA stories
        run: >-
          node scripts/news/build-japan-mma-news.mjs
          --output /tmp/japan-mma-news.json
          --previous-url https://raw.githubusercontent.com/${{ github.repository }}/live-news-data/japan-mma-news.json

      - name: Collect full-length MMA YouTube videos
        run: >-
          node scripts/news/build-broadcast-videos.mjs
          --output /tmp/broadcast-news-videos.json
          --previous-url https://raw.githubusercontent.com/${{ github.repository }}/live-news-data/broadcast-news-videos.json

      - name: Publish browser-friendly live snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -rf /tmp/mma-news-live-branch
          git worktree add --detach /tmp/mma-news-live-branch
          cd /tmp/mma-news-live-branch
          git switch --orphan live-news-data
          git rm -rf . >/dev/null 2>&1 || true
          cp /tmp/mma-news.json mma-news.json
          cp /tmp/broadcast-news-videos.json broadcast-news-videos.json
          cp /tmp/japan-mma-news.json japan-mma-news.json
          git add mma-news.json broadcast-news-videos.json japan-mma-news.json
          git commit -m "Refresh MMA news data"
          git push --force origin HEAD:live-news-data

      - name: Publish the latest data snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view mma-news-data > /dev/null 2>&1; then
            gh release edit mma-news-data \
              --title "MMA News Data" \
              --notes-file /tmp/mma-news.json
          else
            gh release create mma-news-data \
              --title "MMA News Data" \
              --notes-file /tmp/mma-news.json \
              --prerelease
          fi
