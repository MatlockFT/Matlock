name: One-time Event Map interaction fix

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/event-map-interaction-fix-once.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Apply interaction fix
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          enhancements_path = Path('assets/event-map-enhancements.js')
          enhancements = enhancements_path.read_text(encoding='utf-8')
          enhancements, count = re.subn(r'^\(\(\) => \{.*?\n\}\)\(\);\n\n(?=\(\(\) => \{)', '', enhancements, count=1, flags=re.S)
          if count != 1:
              raise SystemExit('Could not remove duplicate marker pointer controller')
          enhancements_path.write_text(enhancements, encoding='utf-8')

          core_path = Path('assets/event-map-v2.js')
          core = core_path.read_text(encoding='utf-8')
          scroll_pattern = re.compile(r"    function scrollDetailOnMobile\(\) \{.*?\n    \}\n\n    function selectEvent", re.S)
          scroll_replacement = "    function scrollDetailOnMobile({ smooth = true } = {}) {\n        if (!window.matchMedia('(max-width: 820px)').matches) return;\n        const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;\n        detailPanel.scrollIntoView({\n            behavior: smooth && !reduceMotion ? 'smooth' : 'auto',\n            block: 'start'\n        });\n    }\n\n    function selectEvent"
          core, count = scroll_pattern.subn(lambda _: scroll_replacement, core, count=1)
          if count != 1:
              raise SystemExit('Could not locate mobile detail scroll helper')
          old_cluster_tail = "        if (scroll) scrollDetailOnMobile();\n    }\n\n    function previewEvent"
          new_cluster_tail = "        if (scroll) scrollDetailOnMobile({ smooth: false });\n    }\n\n    function previewEvent"
          if old_cluster_tail not in core:
              raise SystemExit('Could not locate cluster mobile scroll call')
          core = core.replace(old_cluster_tail, new_cluster_tail, 1)
          core_path.write_text(core, encoding='utf-8')

          checker_path = Path('scripts/check-event-map-architecture.mjs')
          checker = checker_path.read_text(encoding='utf-8')
          old_guard = "requireText(enhancements, 'pressedPointerId', 'Pointer controller must track the active pointer ID.');\nrequireText(enhancements, 'a drag that begins on a pin must still pan the map', 'Pin pointerdown must not block map panning.');"
          new_guard = "forbid(enhancements, 'pressedPointerId', 'Enhancements must not install a second marker activation controller.');"
          if old_guard not in checker:
              raise SystemExit('Could not locate pointer-controller architecture guard')
          checker_path.write_text(checker.replace(old_guard, new_guard, 1), encoding='utf-8')

          config_path = Path('_config.yml')
          config = config_path.read_text(encoding='utf-8')
          match = re.search(r'(?m)^asset_version: "(\d+)"$', config)
          if not match:
              raise SystemExit('Could not locate asset_version')
          old_version = int(match.group(1))
          config = config[:match.start(1)] + str(old_version + 1) + config[match.end(1):]
          config_path.write_text(config, encoding='utf-8')
          print(f'Event Map interaction fix prepared. asset_version {old_version} -> {old_version + 1}')
          PY

      - name: Validate interaction fix
        shell: bash
        run: |
          set -euo pipefail
          node --check assets/event-map-v2.js
          node --check assets/event-map-enhancements.js
          node --check scripts/check-event-map-architecture.mjs
          node --check scripts/event-map-smoke.spec.cjs
          node scripts/validate-event-map-regional.mjs
          node scripts/validate-event-map-quality.mjs
          node scripts/check-event-map-architecture.mjs

      - name: Commit interaction fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/event-map-v2.js assets/event-map-enhancements.js scripts/check-event-map-architecture.mjs _config.yml
          git commit -m "Fix Event Map click and mobile cluster interactions"
          git pull --rebase origin main
          git push origin HEAD:main
