name: Writer preflight once

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/writer-preflight-once.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
      - name: Apply Writer production validation patch
        run: |
          python .github/scripts/patch_writer_preflight.py
          node --check assets/writer.js
          grep -q 'data-publish-check-dialog' write.html
          grep -q 'collectPublishChecks' assets/writer.js
          grep -q 'requestPublishWithChecks' assets/writer.js
          grep -q 'Writer publish safety pass 2026-09-16' assets/writer.css
          test -f scripts/writer-smoke.spec.cjs
      - name: Static Writer regression checks
        run: |
          node <<'NODE'
          const fs = require('fs');
          const js = fs.readFileSync('assets/writer.js','utf8');
          const html = fs.readFileSync('write.html','utf8');
          const checks = [
            ['autosave', js.includes('window.setTimeout(persistLocalAutosave, 500)')],
            ['HTML expansion', js.includes('expandHtmlBlocks(bodyEditor.value)')],
            ['conflict check', js.includes('checkRemoteConflict(mode)')],
            ['pre-publish collection', js.includes('collectPublishChecks()')],
            ['pre-publish gate', js.includes("publishButton.addEventListener('click', requestPublishWithChecks)")],
            ['publish dialog', html.includes('data-publish-check-dialog')],
            ['splitter', html.includes('data-writer-splitter')],
            ['HTML rail', html.includes('data-html-block-rail')]
          ];
          const failed = checks.filter(([, ok]) => !ok);
          if (failed.length) throw new Error('Failed: ' + failed.map(([name]) => name).join(', '));
          console.log('Writer regression invariants OK:', checks.map(([name]) => name).join(', '));
          NODE
      - name: Commit Writer production safety pass
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add write.html assets/writer.js assets/writer.css scripts/writer-smoke.spec.cjs
          git commit -m "Add Writer pre-publish safety checks and production smoke test"
          git push origin HEAD:main
