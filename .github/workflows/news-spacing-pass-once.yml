name: One-time News spacing and padding pass

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/news-spacing-pass-once.yml

permissions:
  contents: write

jobs:
  tune-news-layout:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Apply News layout spacing pass
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('assets/news.css')
          css = path.read_text(encoding='utf-8')

          replacements = [
              (
                  '''.news-lead,\n.news-more {\n    margin-top: clamp(1.6rem, 3.5vw, 2.6rem);\n}\n''',
                  '''.news-lead,\n.news-more {\n    margin-top: clamp(1.4rem, 2.8vw, 2.2rem);\n}\n'''
              ),
              (
                  '''.news-lead-grid {\n    display: grid;\n    grid-template-columns: minmax(0, 1.55fr) minmax(330px, 0.72fr);\n    gap: clamp(0.9rem, 2vw, 1.35rem);\n    align-items: stretch;\n}\n''',
                  '''.news-lead-grid {\n    display: grid;\n    grid-template-columns: minmax(0, 1.48fr) minmax(360px, 0.78fr);\n    gap: clamp(1rem, 1.8vw, 1.4rem);\n    align-items: stretch;\n}\n'''
              ),
              (
                  '''.news-top-story,\n.news-latest-panel {\n    min-width: 0;\n}\n''',
                  '''.news-top-story,\n.news-latest-panel {\n    min-width: 0;\n}\n\n.news-top-story {\n    display: flex;\n}\n'''
              ),
              (
                  '''.news-lead-card {\n    position: relative;\n    display: grid;\n    min-height: 560px;\n''',
                  '''.news-lead-card {\n    position: relative;\n    display: grid;\n    width: 100%;\n    height: 100%;\n    min-height: 560px;\n'''
              ),
              (
                  '''.news-latest-panel {\n    display: flex;\n    flex-direction: column;\n    min-height: 560px;\n    padding: clamp(1rem, 2vw, 1.25rem);\n''',
                  '''.news-latest-panel {\n    display: flex;\n    flex-direction: column;\n    min-height: 560px;\n    padding: clamp(1.15rem, 1.8vw, 1.4rem);\n'''
              ),
              (
                  '''.news-latest-header {\n    display: flex;\n    align-items: center;\n    justify-content: space-between;\n    gap: 0.8rem;\n    padding-bottom: 0.85rem;\n''',
                  '''.news-latest-header {\n    display: flex;\n    align-items: center;\n    justify-content: space-between;\n    gap: 1rem;\n    padding: 0.1rem 0 1rem;\n'''
              ),
              (
                  '''.news-latest-list {\n    display: grid;\n    gap: 0;\n    flex: 1;\n}\n''',
                  '''.news-latest-list {\n    display: grid;\n    gap: 0;\n    flex: 1;\n    margin-top: 0.1rem;\n}\n'''
              ),
              (
                  '''.news-latest-row {\n    display: grid;\n    grid-template-columns: 94px minmax(0, 1fr);\n    gap: 0.8rem;\n    align-items: center;\n    min-width: 0;\n    padding: 0.9rem 0;\n''',
                  '''.news-latest-row {\n    display: grid;\n    grid-template-columns: 84px minmax(0, 1fr);\n    gap: 0.85rem;\n    align-items: center;\n    min-width: 0;\n    padding: 0.82rem 0;\n'''
              ),
              (
                  '''.news-latest-meta {\n    margin-bottom: 0.32rem;\n''',
                  '''.news-latest-meta {\n    margin-bottom: 0.38rem;\n'''
              ),
              (
                  '''    line-height: 1.15;\n    text-wrap: pretty;\n}\n\n.news-latest-title a {\n''',
                  '''    line-height: 1.18;\n    text-wrap: pretty;\n}\n\n.news-latest-title a {\n'''
              ),
              (
                  '''    .news-latest-row {\n        grid-template-columns: 78px minmax(0, 1fr);\n        gap: 0.65rem;\n        padding-block: 0.72rem;\n    }\n''',
                  '''    .news-latest-row {\n        grid-template-columns: 76px minmax(0, 1fr);\n        gap: 0.75rem;\n        padding-block: 0.78rem;\n    }\n'''
              ),
          ]

          for old, new in replacements:
              if old not in css:
                  raise SystemExit(f'News spacing patch could not find expected block:\n{old}')
              css = css.replace(old, new, 1)

          path.write_text(css, encoding='utf-8')

          cfg_path = Path('_config.yml')
          cfg = cfg_path.read_text(encoding='utf-8')
          match = re.search(r'(?m)^asset_version: "(\d+)"$', cfg)
          if not match:
              raise SystemExit('Could not locate asset_version')
          version = int(match.group(1))
          cfg = cfg[:match.start(1)] + str(version + 1) + cfg[match.end(1):]
          cfg_path.write_text(cfg, encoding='utf-8')
          print(f'News spacing pass prepared. asset_version {version} -> {version + 1}')
          PY

      - name: Validate changed files
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'grid-template-columns: minmax(0, 1.48fr) minmax(360px, 0.78fr);' assets/news.css
          grep -Fq 'grid-template-columns: 84px minmax(0, 1fr);' assets/news.css
          grep -Fq 'height: 100%;' assets/news.css
          grep -Eq '^asset_version: "[0-9]+"$' _config.yml

      - name: Commit News spacing pass
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/news.css _config.yml
          git commit -m "Refine News spacing and Latest panel"
          git pull --rebase origin main
          git push origin HEAD:main
