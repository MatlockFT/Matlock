name: Probe UFC active roster endpoint (PR)

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/ufc-probe-kick.txt"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Brute force UFC status facet IDs
        run: |
          node <<'NODE'
          const ORIGIN = 'https://www.ufc.com';
          const ATHLETES = `${ORIGIN}/athletes/all`;
          const AJAX = `${ORIGIN}/views/ajax?_wrapper_format=drupal_ajax`;
          const ua = 'Mozilla/5.0 (compatible; MMAMatlockRosterProbe/3.0; +https://matlockfighttalk.com/)';

          async function fetchText(url, options={}) {
            const r = await fetch(url, {
              redirect: 'follow',
              ...options,
              headers: {
                'user-agent': ua,
                accept: 'text/html,application/json;q=0.9,*/*;q=0.8',
                ...(options.headers || {})
              }
            });
            return { status: r.status, text: await r.text() };
          }

          function decodeAjax(text) {
            try {
              const parsed = JSON.parse(text);
              if (!Array.isArray(parsed)) return text;
              return parsed.map(cmd => typeof cmd?.data === 'string' ? cmd.data : '').join('\n');
            } catch {
              return text;
            }
          }

          function athleteCount(text) {
            const decoded = decodeAjax(text)
              .replace(/\\u003C/g,'<').replace(/\\u003E/g,'>')
              .replace(/\\u0026/g,'&').replace(/\\n/g,' ')
              .replace(/<script[\s\S]*?<\/script>/gi,' ')
              .replace(/<style[\s\S]*?<\/style>/gi,' ')
              .replace(/<[^>]+>/g,' ')
              .replace(/&nbsp;/g,' ').replace(/&amp;/g,'&')
              .replace(/\s+/g,' ');
            const hits = [...decoded.matchAll(/\b(\d{2,5})\s+Athletes\b/gi)].map(m => Number(m[1]));
            return hits.length ? hits[0] : null;
          }

          function athleteUrls(text) {
            const decoded = decodeAjax(text)
              .replace(/\\u002F/g,'/')
              .replace(/\\\//g,'/');
            const out = new Set();
            for (const m of decoded.matchAll(/href=["'](?:https?:\/\/(?:www\.)?ufc\.com)?(\/athlete\/[^"'?#/]+)\/?["']/gi)) out.add(m[1]);
            return [...out];
          }

          async function probe(id) {
            const body = new URLSearchParams({
              view_name: 'all_athletes',
              view_display_id: 'page',
              view_path: '/athletes/all',
              pager_element: '0',
              gender: 'All',
              page: '0'
            });
            const query = `&filters%5B0%5D=status%3A${id}`;
            const r = await fetchText(AJAX + query, {
              method: 'POST',
              headers: {
                'content-type':'application/x-www-form-urlencoded; charset=UTF-8',
                'x-requested-with':'XMLHttpRequest',
                referer: ATHLETES
              },
              body
            });
            return {
              id,
              http: r.status,
              count: athleteCount(r.text),
              urls: athleteUrls(r.text)
            };
          }

          const baselineBody = new URLSearchParams({
            view_name:'all_athletes', view_display_id:'page', view_path:'/athletes/all',
            pager_element:'0', gender:'All', page:'0'
          });
          const baseline = await fetchText(AJAX, {
            method:'POST',
            headers:{'content-type':'application/x-www-form-urlencoded; charset=UTF-8','x-requested-with':'XMLHttpRequest',referer:ATHLETES},
            body: baselineBody
          });
          console.log(`BASELINE count=${athleteCount(baseline.text)} urls=${athleteUrls(baseline.text).length} bytes=${baseline.text.length}`);

          const ids = Array.from({length: 60}, (_,i) => i + 1);
          const results = [];
          const concurrency = 8;
          for (let i=0; i<ids.length; i+=concurrency) {
            const batch = await Promise.all(ids.slice(i,i+concurrency).map(probe));
            results.push(...batch);
          }

          const interesting = results.filter(r => r.count !== null && r.count !== 3168);
          for (const r of interesting) {
            console.log(`STATUS_ID ${r.id} count=${r.count} urls=${r.urls.length} sample=${JSON.stringify(r.urls.slice(0,8))}`);
          }

          const exact = interesting.filter(r => r.count === 524);
          console.log(`EXACT_524 ${JSON.stringify(exact.map(r => ({id:r.id,count:r.count,urls:r.urls.length,sample:r.urls.slice(0,12)})))}`);

          if (!exact.length) {
            console.log('NO_EXACT_524_IN_1_60');
          }
          NODE
