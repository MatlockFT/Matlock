name: Update upcoming MMA events

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: upcoming-mma-events
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate updater syntax
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/update-upcoming-ufc-events.mjs
          node --check scripts/update-pfl-upcoming-events.mjs
          node --check scripts/update-rizin-upcoming-events.mjs
          node --check scripts/resolve-espn-fighter-portraits.mjs
          node --check scripts/enrich-fighter-portraits.mjs
          node --check scripts/publish-fighter-portraits.mjs
          node --check scripts/validate-upcoming-events.mjs

      - name: Snapshot current Events page
        run: cp upcoming-events.html /tmp/upcoming-events.before.html

      - name: Read UFC event cards
        run: node scripts/update-upcoming-ufc-events.mjs

      - name: Read PFL event cards
        run: node scripts/update-pfl-upcoming-events.mjs

      - name: Read RIZIN event cards
        if: ${{ false }}
        run: node scripts/update-rizin-upcoming-events.mjs

      - name: Resolve ESPN portraits by fighter name
        run: node scripts/resolve-espn-fighter-portraits.mjs

      - name: Resolve and frame fighter portraits
        run: node scripts/enrich-fighter-portraits.mjs

      - name: Publish fighter portrait cache
        run: node scripts/publish-fighter-portraits.mjs

      - name: Validate candidate Events page
        id: validate_events
        shell: bash
        run: node scripts/validate-upcoming-events.mjs /tmp/upcoming-events.before.html upcoming-events.html

      - name: Restore Events page after validation failure
        if: ${{ failure() && steps.validate_events.outcome == 'failure' }}
        run: cp /tmp/upcoming-events.before.html upcoming-events.html

      - name: Commit event and portrait changes
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git status --porcelain -- upcoming-events.html _data/fighter_portraits.json assets/fighter-portraits.json || true)"
          if [ -z "$changed" ]; then
            echo "No MMA card or portrait changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- upcoming-events.html _data/fighter_portraits.json assets/fighter-portraits.json
          git commit -m "Refresh upcoming MMA cards and portraits"
          git push origin HEAD:main
