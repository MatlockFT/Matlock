name: Update upcoming MMA events

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/update-upcoming-ufc-events.yml"
      - "_data/upcoming_events_overrides.json"
      - "scripts/upcoming-events-data.mjs"
      - "scripts/event-location-utils.mjs"
      - "scripts/enrich-upcoming-event-locations.mjs"
      - "scripts/build-event-map-us.mjs"
      - "scripts/validate-event-map-us.mjs"
      - "scripts/report-event-map-locations.mjs"
      - "scripts/update-upcoming-ufc-events.mjs"
      - "scripts/normalize-upcoming-ufc-events.mjs"
      - "scripts/update-dwcs-upcoming-events.mjs"
      - "scripts/update-pfl-upcoming-events.mjs"
      - "scripts/update-rizin-upcoming-events.mjs"
      - "scripts/apply-upcoming-event-overrides.mjs"
      - "scripts/resolve-espn-fighter-portraits.mjs"
      - "scripts/enrich-fighter-portraits.mjs"
      - "scripts/enforce-ufc-fighter-portraits.mjs"
      - "scripts/check-verdict-upcoming-events.mjs"
      - "scripts/publish-fighter-portraits.mjs"
      - "scripts/validate-upcoming-events.mjs"
      - "scripts/diff-upcoming-events.mjs"
  schedule:
    - cron: "7,22,37,52 * * * *"

permissions:
  contents: write

concurrency:
  group: upcoming-mma-events
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EVENT_LOCATION_CONCURRENCY: "3"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Validate updater syntax
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/upcoming-events-data.mjs
          node --check scripts/event-location-utils.mjs
          node --check scripts/enrich-upcoming-event-locations.mjs
          node --check scripts/build-event-map-us.mjs
          node --check scripts/validate-event-map-us.mjs
          node --check scripts/report-event-map-locations.mjs
          node --check scripts/update-upcoming-ufc-events.mjs
          node --check scripts/normalize-upcoming-ufc-events.mjs
          node --check scripts/update-dwcs-upcoming-events.mjs
          node --check scripts/update-pfl-upcoming-events.mjs
          node --check scripts/update-rizin-upcoming-events.mjs
          node --check scripts/apply-upcoming-event-overrides.mjs
          node --check scripts/resolve-espn-fighter-portraits.mjs
          node --check scripts/enrich-fighter-portraits.mjs
          node --check scripts/enforce-ufc-fighter-portraits.mjs
          node --check scripts/check-verdict-upcoming-events.mjs
          node --check scripts/publish-fighter-portraits.mjs
          node --check scripts/validate-upcoming-events.mjs
          node --check scripts/diff-upcoming-events.mjs

      - name: Snapshot current event data
        run: cp _data/upcoming_events.json /tmp/upcoming-events.before.json

      - name: Read UFC event data
        run: node scripts/update-upcoming-ufc-events.mjs

      - name: Normalize UFC event metadata
        run: node scripts/normalize-upcoming-ufc-events.mjs

      - name: Apply verified late card changes
        run: node scripts/apply-upcoming-event-overrides.mjs

      - name: Read DWCS event data
        run: node scripts/update-dwcs-upcoming-events.mjs

      - name: Read PFL event data
        run: node scripts/update-pfl-upcoming-events.mjs

      - name: Read RIZIN event data
        run: node scripts/update-rizin-upcoming-events.mjs

      - name: Enrich event locations from official sources
        run: node scripts/enrich-upcoming-event-locations.mjs

      - name: Rebuild trusted U.S. map from major event data
        run: |
          node scripts/build-event-map-us.mjs
          node scripts/report-event-map-locations.mjs
          node scripts/validate-event-map-us.mjs
          node scripts/report-event-map-locations.mjs --check

      - name: Resolve verified promotion portraits
        run: node scripts/enrich-fighter-portraits.mjs

      - name: Fill remaining portraits from ESPN
        run: node scripts/resolve-espn-fighter-portraits.mjs

      - name: Enforce UFC.com portraits on UFC cards
        run: node scripts/enforce-ufc-fighter-portraits.mjs

      - name: Validate merged event data
        run: node scripts/validate-upcoming-events.mjs /tmp/upcoming-events.before.json _data/upcoming_events.json upcoming-events.html

      - name: Compare cards with Verdict MMA
        run: node scripts/check-verdict-upcoming-events.mjs

      - name: Record meaningful event changes
        run: node scripts/diff-upcoming-events.mjs /tmp/upcoming-events.before.json _data/upcoming_events.json _data/upcoming_events_changes.json

      - name: Publish fighter portrait cache
        run: node scripts/publish-fighter-portraits.mjs

      - name: Commit meaningful event, map, and portrait changes
        shell: bash
        run: |
          set -euo pipefail
          meaningful="$(git status --porcelain -- _data/upcoming_events_changes.json _data/upcoming_events_verdict_watch.json _data/fighter_portraits.json assets/fighter-portraits.json _data/event_map_us.json _data/event_map_location_report.json || true)"
          if [ -z "$meaningful" ]; then
            echo "No meaningful MMA event, map, watchdog, location, or portrait changes. Timestamp-only refresh discarded."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- _data/upcoming_events.json _data/upcoming_events_changes.json _data/upcoming_events_verdict_watch.json _data/fighter_portraits.json assets/fighter-portraits.json _data/event_map_us.json _data/event_map_location_report.json
          git commit -m "Refresh upcoming MMA event data"
          git pull --rebase origin main
          git push origin HEAD:main
