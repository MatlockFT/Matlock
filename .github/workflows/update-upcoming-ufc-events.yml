name: Update upcoming MMA events

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/update-upcoming-ufc-events.yml"
      - "scripts/update-upcoming-ufc-events.mjs"
      - "scripts/update-pfl-upcoming-events.mjs"
      - "scripts/update-rizin-upcoming-events.mjs"
      - "scripts/resolve-espn-fighter-portraits.mjs"
      - "scripts/enrich-fighter-portraits.mjs"
      - "scripts/publish-fighter-portraits.mjs"
  schedule:
    - cron: "7,22,37,52 * * * *"

permissions:
  contents: write

concurrency:
  group: upcoming-mma-events
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate updater syntax
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/update-upcoming-ufc-events.mjs
          node --check scripts/update-pfl-upcoming-events.mjs
          node --check scripts/update-rizin-upcoming-events.mjs
          node --check scripts/resolve-espn-fighter-portraits.mjs
          node --check scripts/enrich-fighter-portraits.mjs
          node --check scripts/publish-fighter-portraits.mjs

      - name: Read UFC event cards
        run: node scripts/update-upcoming-ufc-events.mjs

      - name: Read PFL event cards
        run: node scripts/update-pfl-upcoming-events.mjs

      - name: Read RIZIN event cards
        run: node scripts/update-rizin-upcoming-events.mjs

      - name: Resolve ESPN portraits by fighter name
        run: node scripts/resolve-espn-fighter-portraits.mjs

      - name: Resolve and frame fighter portraits
        run: node scripts/enrich-fighter-portraits.mjs

      - name: Publish fighter portrait cache
        run: node scripts/publish-fighter-portraits.mjs

      - name: Retire legacy UFC event data
        shell: bash
        run: |
          set -euo pipefail
          if ! grep -q 'site\.data\.ufc_events' upcoming-events.html; then
            rm -f _data/ufc_events.json
          fi

      - name: Commit event and portrait changes
        shell: bash
        run: |
          set -euo pipefail

          changed="$(git status --porcelain -- upcoming-events.html _data/fighter_portraits.json assets/fighter-portraits.json _data/ufc_events.json || true)"
          if [ -z "$changed" ]; then
            echo "No MMA card or portrait changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- upcoming-events.html _data/fighter_portraits.json assets/fighter-portraits.json
          if git ls-files --error-unmatch _data/ufc_events.json >/dev/null 2>&1 || [ -e _data/ufc_events.json ]; then
            git add -A -- _data/ufc_events.json
          fi
          git commit -m "Refresh upcoming MMA cards and portraits"
          git push origin HEAD:main
