name: Inspect YouTube embed message

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/inspect-youtube-embed.yml"

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright client
        run: npm install --no-save --no-package-lock @playwright/test@1.55.0
      - name: Inspect live iframe
        run: |
          node <<'NODE'
          const { chromium } = require('@playwright/test');
          (async () => {
            const browser = await chromium.launch({ channel: 'chrome' });
            const page = await browser.newPage({ viewport: { width: 1365, height: 900 } });
            page.on('console', m => console.log('PAGE_CONSOLE', m.type(), m.text()));
            await page.goto('https://mmamatlock.com/live/?embed_message_probe=' + Date.now(), {
              waitUntil: 'domcontentloaded',
              timeout: 45000
            });
            await page.waitForTimeout(8000);
            const yt = page.frames().find(f => f.url().includes('youtube.com/embed'));
            if (!yt) throw new Error('No YouTube iframe found');
            const info = await yt.evaluate(() => {
              const text = document.body?.innerText || '';
              const selectors = [
                '.ytp-error',
                '.ytp-error-content-wrap',
                '.ytp-error-content',
                '.ytp-offline-slate',
                '.ytp-live-badge',
                '.ytp-title-text',
                '.ytp-impression-link'
              ];
              const nodes = {};
              for (const sel of selectors) {
                const el = document.querySelector(sel);
                if (el) nodes[sel] = {
                  text: el.textContent?.trim() || '',
                  display: getComputedStyle(el).display,
                  visibility: getComputedStyle(el).visibility,
                  opacity: getComputedStyle(el).opacity
                };
              }
              const v = document.querySelector('video');
              return {
                url: location.href,
                title: document.title,
                bodyText: text.slice(0, 5000),
                nodes,
                video: v ? {
                  paused: v.paused,
                  currentTime: v.currentTime,
                  duration: Number.isFinite(v.duration) ? v.duration : null,
                  readyState: v.readyState,
                  networkState: v.networkState,
                  currentSrc: v.currentSrc,
                  error: v.error ? { code: v.error.code, message: v.error.message } : null
                } : null
              };
            });
            console.log('IFRAME_INFO', JSON.stringify(info));
            await browser.close();
          })().catch(e => { console.error(e); process.exit(1); });
          NODE
      - name: Remove one-shot inspector
        if: always()
        run: |
          git config user.name "MatlockFT"
          git config user.email "fighttalkmma@protonmail.com"
          git rm .github/workflows/inspect-youtube-embed.yml
          git commit -m "Remove YouTube embed inspector" || exit 0
          git push origin HEAD:main
