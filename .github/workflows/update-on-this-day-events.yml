name: Update On This Day events

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - on-this-day-continuous-history
    paths:
      - ".github/workflows/update-on-this-day-events.yml"
      - "assets/data/on-this-day-event-sources.json"
      - "assets/data/on-this-day-pancrase-cache.json"
      - "assets/data/on-this-day-image-source-overrides.json"
      - "assets/data/on-this-day-current-poster-fallbacks.json"
      - "assets/data/fighter-birthday-seeds.json"
      - "assets/fighter-portraits.json"
      - "scripts/update-fighter-birthdays.mjs"
      - "scripts/update-on-this-day-events.mjs"
      - "scripts/normalize-on-this-day-titles.mjs"
      - "scripts/apply-on-this-day-image-cache.mjs"
      - "scripts/apply-on-this-day-image-source-overrides.mjs"
      - "scripts/apply-on-this-day-current-poster-fallbacks.mjs"
      - "scripts/resolve-on-this-day-images.mjs"
      - "scripts/resolve-on-this-day-event-posters.mjs"
      - "scripts/sanitize-on-this-day-event-images.mjs"
      - "scripts/finalize-on-this-day-image-metadata.mjs"
      - "scripts/check-on-this-day-images.mjs"
      - "scripts/verify-on-this-day-event-images.mjs"
      - "scripts/enrich-on-this-day-content.mjs"
      - "scripts/enrich-on-this-day-pancrase.mjs"
      - "scripts/enrich-on-this-day-pancrase-images.mjs"
      - "scripts/curate-on-this-day-events.mjs"
      - "scripts/build-on-this-day-home.mjs"
      - "scripts/build-on-this-day-leads.mjs"
      - "scripts/build-on-this-day-runtime.mjs"
      - "scripts/build-on-this-day-share-images.mjs"
      - "scripts/build-on-this-day-share-safe.mjs"
      - "scripts/share-title-layout.mjs"
      - "scripts/share-card-composition.mjs"
      - "assets/share-gobold.mjs"
      - "assets/textures/otd-gaffer-tape-v1.png"
      - "scripts/check-on-this-day-share.mjs"
      - "assets/data/on-this-day-share-sources.json"
      - "assets/textures/otd-xerox-paper-v1.webp"
      - "scripts/report-on-this-day-coverage.mjs"
      - "scripts/check-on-this-day.mjs"
  schedule:
    - cron: "42 9 * * *"

permissions:
  contents: write

concurrency:
  group: on-this-day-history
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OTD_TARGET_PROMOTIONS: "ufc,wec,strikeforce,pfl,one,pancrase,bellator,rizin,pride"
      OTD_IMAGE_VERIFY_LIMIT: "100"
      OTD_IMAGE_RESOLVE_LIMIT: "180"
      OTD_EVENT_POSTER_LIMIT: "220"
      OTD_CURRENT_WINDOW_DAYS: "2"
      OTD_TIME_ZONE: "America/Chicago"
      OTD_CONTENT_ENRICH_LIMIT: "80"
      OTD_CONTENT_CONCURRENCY: "1"
      OTD_PANCRASE_ENRICH_LIMIT: "24"
      OTD_PANCRASE_IMAGE_LIMIT: "80"
      OTD_SHARE_WINDOW_DAYS: "2"
      OTD_SHARE_MAX_PER_DAY: "12"
      OTD_SHARE_CONCURRENCY: "3"
      OTD_SHARE_OUTPUT_DIR: ".otd-share-cache"
      OTD_SHARE_MANIFEST_PATH: "assets/data/on-this-day-share-manifest.json"
      OTD_SHARE_PUBLIC_BASE: "https://raw.githubusercontent.com/MatlockFT/Matlock/otd-share-cache"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Check updater syntax
        run: |
          node --check scripts/update-fighter-birthdays.mjs
          node --check scripts/update-on-this-day-events.mjs
          node --check scripts/normalize-on-this-day-titles.mjs
          node --check scripts/apply-on-this-day-image-cache.mjs
          node --check scripts/apply-on-this-day-image-source-overrides.mjs
          node --check scripts/apply-on-this-day-current-poster-fallbacks.mjs
          node --check scripts/resolve-on-this-day-images.mjs
          node --check scripts/resolve-on-this-day-tapology-posters.mjs
          node --check scripts/check-on-this-day-poster-registry.mjs
          node --check scripts/resolve-on-this-day-event-posters.mjs
          node --check scripts/sanitize-on-this-day-event-images.mjs
          node --check scripts/finalize-on-this-day-image-metadata.mjs
          node --check scripts/check-on-this-day-images.mjs
          node --check scripts/verify-on-this-day-event-images.mjs
          node --check scripts/enrich-on-this-day-content.mjs
          node --check scripts/enrich-on-this-day-pancrase.mjs
          node --check scripts/enrich-on-this-day-pancrase-images.mjs
          node --check scripts/curate-on-this-day-events.mjs
          node --check scripts/build-on-this-day-home.mjs
          node --check scripts/build-on-this-day-leads.mjs
          node --check scripts/build-on-this-day-runtime.mjs
          node --check scripts/build-on-this-day-share-images.mjs
          node --check scripts/build-on-this-day-share-safe.mjs
          node --check scripts/share-title-layout.mjs
          node --check scripts/check-on-this-day-share.mjs
          node --check scripts/report-on-this-day-coverage.mjs
          node --check scripts/check-on-this-day.mjs
          node --check assets/otd-share-v3.js

      - name: Refresh fighter birthdays from Wikipedia and Wikidata
        id: refresh_birthdays
        continue-on-error: true
        run: npm run update:birthdays

      - name: Note birthday source fallback
        if: steps.refresh_birthdays.outcome == 'failure'
        run: echo "Birthday source refresh was rate-limited/unavailable; preserving the existing verified birthday archive for this image/share run."

      - name: Refresh event anniversaries from Wikipedia
        run: node scripts/update-on-this-day-events.mjs

      - name: Normalize generated event titles
        run: node scripts/normalize-on-this-day-titles.mjs

      - name: Add targeted main-event context
        run: node scripts/enrich-on-this-day-content.mjs

      - name: Backfill Pancrase from the official archive
        run: node scripts/enrich-on-this-day-pancrase.mjs

      - name: Resolve Pancrase images from the official archive
        run: node scripts/enrich-on-this-day-pancrase-images.mjs

      - name: Verify event-specific poster matches
        run: node scripts/verify-on-this-day-event-images.mjs

      - name: Curate duplicate events and generated copy
        run: node scripts/curate-on-this-day-events.mjs

      - name: Protect exact cached event posters
        run: node scripts/apply-on-this-day-image-cache.mjs

      - name: Apply verified source overrides for hard image matches
        run: node scripts/apply-on-this-day-image-source-overrides.mjs

      - name: Resolve images from exact trusted sources
        run: npm run resolve:history-images

      - name: Resolve actual event posters with Tapology priority
        run: node scripts/resolve-on-this-day-event-posters.mjs

      - name: Reject ambiguous or untrusted historical event images
        run: node scripts/sanitize-on-this-day-event-images.mjs

      - name: Apply verified current-window poster fallbacks
        run: node scripts/apply-on-this-day-current-poster-fallbacks.mjs

      - name: Normalize image provenance metadata
        run: node scripts/finalize-on-this-day-image-metadata.mjs

      - name: Enforce current-window, birthday, and event-poster QA
        id: image_qa
        continue-on-error: true
        run: npm run check:history-images

      - name: Build optimized browser history shards
        run: npm run build:history-runtime

      - name: Build share-ready social images safely
        run: node scripts/build-on-this-day-share-safe.mjs

      - name: Validate share image manifest
        run: npm run check:history-share

      - name: Publish rolling share image cache
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cache_repo="$(mktemp -d)"
          cp -R .otd-share-cache/. "$cache_repo/"
          cd "$cache_repo"
          git init
          git checkout -b otd-share-cache
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Refresh On This Day share cache"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin HEAD:refs/heads/otd-share-cache
          cd - >/dev/null
          rm -rf .otd-share-cache "$cache_repo"

      - name: Build homepage history snapshot
        run: node scripts/build-on-this-day-home.mjs

      - name: Build lead image preload indexes
        shell: bash
        run: |
          set -euo pipefail
          node scripts/build-on-this-day-leads.mjs
          mkdir -p _data
          cp assets/data/on-this-day-leads.json _data/on_this_day_leads.json

      - name: Check calendar and image coverage
        run: node scripts/report-on-this-day-coverage.mjs

      - name: Validate On This Day archive
        run: npm run check:history

      - name: Commit event archive changes
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          tracked_paths=(
            assets/data/on-this-day.json
            assets/data/on-this-day-home.json
            assets/data/on-this-day-leads.json
            assets/data/on-this-day-image-cache.json
            assets/data/on-this-day-poster-registry.json
            assets/data/on-this-day-content-cache.json
            assets/data/on-this-day-pancrase-cache.json
            assets/data/on-this-day-share-manifest.json
            assets/data/on-this-day-runtime
            _data/on_this_day_leads.json
          )
          if [ -z "$(git status --porcelain -- "${tracked_paths[@]}")" ]; then
            echo "No On This Day event archive changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "${tracked_paths[@]}"
          git commit -m "Refresh On This Day event archive"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Report unresolved image QA blockers
        if: steps.image_qa.outcome == 'failure'
        run: echo "::warning::Resolved OTD data was safely published, but some current-window posters still need exact verification."
