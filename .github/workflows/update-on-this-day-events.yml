name: Update On This Day events

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - on-this-day-continuous-history
    paths:
      - ".github/workflows/update-on-this-day-events.yml"
      - "assets/data/on-this-day-event-sources.json"
      - "scripts/update-on-this-day-events.mjs"
      - "scripts/enrich-on-this-day-images.mjs"
      - "scripts/enrich-on-this-day-content.mjs"
      - "scripts/curate-on-this-day-events.mjs"
      - "scripts/report-on-this-day-coverage.mjs"
      - "scripts/check-on-this-day.mjs"
  schedule:
    - cron: "42 9 * * *"

permissions:
  contents: write

concurrency:
  group: on-this-day-events
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OTD_TARGET_PROMOTIONS: "pancrase,bellator,rizin,pride"
      OTD_IMAGE_ENRICH_LIMIT: "260"
      OTD_IMAGE_CONCURRENCY: "4"
      OTD_CONTENT_ENRICH_LIMIT: "160"
      OTD_CONTENT_CONCURRENCY: "4"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check updater syntax
        run: |
          node --check scripts/update-on-this-day-events.mjs
          node --check scripts/enrich-on-this-day-images.mjs
          node --check scripts/enrich-on-this-day-content.mjs
          node --check scripts/curate-on-this-day-events.mjs
          node --check scripts/report-on-this-day-coverage.mjs
          node --check scripts/check-on-this-day.mjs

      - name: Refresh event anniversaries from Wikipedia
        run: node scripts/update-on-this-day-events.mjs

      - name: Add targeted main-event context
        run: node scripts/enrich-on-this-day-content.mjs

      - name: Prefer posters and event imagery for weak promotions
        run: node scripts/enrich-on-this-day-images.mjs

      - name: Curate duplicate events and generated copy
        run: node scripts/curate-on-this-day-events.mjs

      - name: Check calendar and image coverage
        run: node scripts/report-on-this-day-coverage.mjs

      - name: Validate On This Day archive
        run: npm run check:history

      - name: Commit event archive changes
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- assets/data/on-this-day.json assets/data/on-this-day-image-cache.json assets/data/on-this-day-content-cache.json; then
            echo "No On This Day event archive changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- assets/data/on-this-day.json assets/data/on-this-day-image-cache.json assets/data/on-this-day-content-cache.json
          git commit -m "Refresh On This Day event archive"
          git pull --rebase origin main
          git push origin HEAD:main
