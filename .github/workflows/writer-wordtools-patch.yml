name: Writer word tools patch

on:
  push:
    branches:
      - writer-wordtools
    paths:
      - .github/workflows/writer-wordtools-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: writer-wordtools
      - name: Wire word tools into Writer
        run: python scripts/writer-wordtools-patch.py
      - name: Validate JavaScript syntax
        run: |
          node --check assets/writer-wordtools.js
          node --check scripts/writer-wordtools-smoke.spec.cjs
      - name: Commit integration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add write.html .github/workflows/writer-production-smoke.yml
          git diff --cached --check
          git commit -m "Wire Writer word processor tools"
          git push origin HEAD:writer-wordtools
