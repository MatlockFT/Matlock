name: QA Writer Draft State

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/qa-writer-draft-state-once.yml"

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"

      - name: Install Playwright
        run: |
          npm install --no-save --no-package-lock @playwright/test@1.55.0
          npx playwright install --with-deps chromium

      - name: Create focused draft-state test
        run: |
          cat > /tmp/writer-draft-state.spec.cjs <<'NODE'
          const { test, expect } = require('@playwright/test');

          const BASE='https://mmamatlock.com/write/';
          const repoRoot='/repos/MatlockFT/Matlock';

          function cors(){
            return {
              'content-type':'application/json; charset=utf-8',
              'access-control-allow-origin':'https://mmamatlock.com',
              'access-control-allow-methods':'GET,PUT,OPTIONS',
              'access-control-allow-headers':'authorization,content-type,x-github-api-version,accept'
            };
          }
          const b64=s=>Buffer.from(String(s||''),'utf8').toString('base64');
          const unb64=s=>Buffer.from(String(s||''),'base64').toString('utf8');

          test('Writer draft identity and recovery stay article-scoped', async ({page})=>{
            test.setTimeout(90000);
            let remote=null;
            let shaCounter=1;
            const pageErrors=[];
            page.on('pageerror',e=>pageErrors.push(e.message));

            await page.route('https://mmamatlock-writer-auth.netlify.app/**', async route=>{
              const url=new URL(route.request().url());
              if(url.pathname.endsWith('/auth/github/health')){
                return route.fulfill({status:200,headers:{...cors(),'access-control-allow-origin':'*'},body:JSON.stringify({ok:true,configured:false})});
              }
              return route.fulfill({status:401,headers:{...cors(),'access-control-allow-origin':'*'},body:JSON.stringify({ok:false})});
            });

            await page.route('https://api.github.com/repos/MatlockFT/Matlock', async route=>{
              if(route.request().method()==='GET') return route.fulfill({status:200,headers:cors(),body:JSON.stringify({owner:{login:'MatlockFT'},name:'Matlock'})});
              return route.fulfill({status:405,headers:cors(),body:JSON.stringify({message:'method'})});
            });

            await page.route('https://api.github.com/repos/MatlockFT/Matlock/**', async route=>{
              const req=route.request(), url=new URL(req.url()), method=req.method(), headers=cors();
              if(method==='OPTIONS') return route.fulfill({status:204,headers,body:''});
              if(url.pathname===repoRoot+'/contents/_posts' && method==='GET'){
                const list=remote?[{type:'file',name:remote.name,path:remote.path,sha:remote.sha}]:[];
                return route.fulfill({status:200,headers,body:JSON.stringify(list)});
              }
              if(url.pathname.startsWith(repoRoot+'/contents/_posts/')){
                const path=decodeURIComponent(url.pathname.slice((repoRoot+'/contents/').length));
                if(method==='GET'){
                  if(!remote || remote.path!==path) return route.fulfill({status:404,headers,body:JSON.stringify({message:'Not Found'})});
                  return route.fulfill({status:200,headers,body:JSON.stringify({name:remote.name,path:remote.path,sha:remote.sha,content:b64(remote.text)})});
                }
                if(method==='PUT'){
                  const payload=req.postDataJSON();
                  const sha='mocksha'+(shaCounter++);
                  remote={path,name:path.split('/').pop(),sha,text:unb64(payload.content)};
                  return route.fulfill({status:200,headers,body:JSON.stringify({content:{path,sha},commit:{sha:'commit-'+sha}})});
                }
              }
              if(url.pathname===repoRoot+'/commits' && method==='GET'){
                return route.fulfill({status:200,headers,body:'[]'});
              }
              return route.fulfill({status:404,headers,body:JSON.stringify({message:'Unhandled '+method+' '+url.pathname})});
            });

            await page.goto(BASE,{waitUntil:'domcontentloaded'});
            await expect(page.locator('[data-library-view]')).toBeVisible();
            expect(new URL(page.url()).search).toBe('');
            await expect(page.locator('[data-save-draft]')).toBeHidden();
            await expect(page.getByText('Restore last session',{exact:false})).toHaveCount(0);

            await page.click('[data-library-new]');
            await expect(page.locator('[data-editor-view]')).toBeVisible();
            expect(new URL(page.url()).searchParams.get('new')).toBe('1');
            await expect(page.locator('[data-save-draft]')).toBeEnabled();

            const date=await page.locator('[data-field="date"]').inputValue();
            const filename=date+'-draft-state-qa.md';
            await page.fill('[data-field="title"]','Draft State QA');
            const advanced=page.locator('.writer-meta-advanced');
            if(!(await advanced.evaluate(el=>el.open))) await advanced.locator('summary').click();
            await page.fill('[data-field="filename"]',filename);
            await page.fill('#writer-body','Browser local body\n\n## State marker');
            await expect(page.locator('[data-local-status]')).toContainText('Saved locally',{timeout:5000});

            await page.click('[data-show-library]');
            await expect(page.locator('[data-library-view]')).toBeVisible();
            expect(new URL(page.url()).search).toBe('');
            await expect(page.locator('[data-save-draft]')).toBeHidden();
            await expect(page.locator('[data-library-local-draft]')).toContainText('Draft State QA');
            await expect(page.getByText('Restore last session',{exact:false})).toHaveCount(0);

            await page.locator('[data-library-resume-local]').click();
            await expect(page.locator('[data-editor-view]')).toBeVisible();
            expect(new URL(page.url()).searchParams.get('new')).toBe('1');
            await expect(page.locator('#writer-body')).toHaveValue(/State marker/);

            await page.click('[data-github-connect]');
            const dialog=page.locator('[data-connect-dialog]');
            await dialog.evaluate(node=>{ const d=node.querySelector('.writer-token-fallback'); if(d)d.open=true; });
            await page.fill('[data-github-token]','github_pat_state_qa_fake');
            await page.click('[data-github-authorize]');
            await expect(page.locator('[data-github-status]')).toContainText('Connected to MatlockFT/Matlock',{timeout:10000});

            await page.click('[data-save-draft]');
            await expect(page.locator('[data-save-state]')).toContainText('Saved',{timeout:10000});
            expect(new URL(page.url()).searchParams.get('new')).toBeNull();
            expect(new URL(page.url()).searchParams.get('path')).toBe('_posts/'+filename);
            expect(remote).toBeTruthy();
            expect(remote.text).toContain('published: false');

            const savedSha=remote.sha;
            await page.evaluate(({path,sha,date,filename})=>{
              localStorage.setItem('matlock-writer:'+path,JSON.stringify({
                currentPath:path,currentSha:sha,currentPublished:false,
                title:'Draft State QA — Local Revision',
                description:'Local metadata',
                date,category:'Breakdown',tags:'State QA',
                imagePath:'https://example.com/local-cover.jpg',
                imageAlt:'',imagePosition:'center center',filename,publishAt:'',
                showToc:false,spoilerWarning:false,pinned:false,
                body:'LOCAL RECOVERY BODY',htmlBlocks:[],originalFrontmatter:'',
                savedAt:Date.now()
              }));
            },{path:'_posts/'+filename,sha:savedSha,date,filename});

            await page.click('[data-show-library]');
            const localCard=page.locator('[data-library-path]').filter({hasText:'Draft State QA — Local Revision'});
            await expect(localCard).toBeVisible();
            await expect(localCard).toContainText('Local changes');
            await expect(localCard.locator('img')).toHaveAttribute('src','https://example.com/local-cover.jpg');
            await expect(localCard.locator('[data-library-edit]')).toHaveText('Resume');
            await expect(page.locator('[data-library-local-draft]')).toHaveCount(0);

            await localCard.locator('[data-library-edit]').click();
            await expect.poll(()=>new URL(page.url()).searchParams.get('path')).toBe('_posts/'+filename);
            await expect(page.locator('#writer-body')).toHaveValue('LOCAL RECOVERY BODY');
            await expect(page.locator('[data-save-state]')).toContainText('Local changes restored');

            await page.goBack();
            await expect(page.locator('[data-library-view]')).toBeVisible();
            expect(new URL(page.url()).search).toBe('');
            await page.goForward();
            await expect(page.locator('[data-editor-view]')).toBeVisible();
            await expect.poll(()=>new URL(page.url()).searchParams.get('path')).toBe('_posts/'+filename);

            // Make the browser recovery stale by advancing the remote SHA.
            remote.sha='remote-new-sha';
            remote.text=remote.text.replace('title: Draft State QA','title: Draft State QA Remote');
            await page.goto(BASE,{waitUntil:'domcontentloaded'});
            await expect(page.locator('[data-library-view]')).toBeVisible();

            await page.click('[data-github-connect]');
            const dialog2=page.locator('[data-connect-dialog]');
            await dialog2.evaluate(node=>{ const d=node.querySelector('.writer-token-fallback'); if(d)d.open=true; });
            await page.fill('[data-github-token]','github_pat_state_qa_fake');
            await page.click('[data-github-authorize]');
            await expect(page.locator('[data-github-status]')).toContainText('Connected to MatlockFT/Matlock',{timeout:10000});
            const remoteCard=page.locator('[data-library-path]').filter({hasText:'Draft State QA Remote'});
            await expect(remoteCard).toBeVisible({timeout:10000});
            await expect(remoteCard).not.toContainText('Local changes');
            await expect(page.locator('[data-library-list]')).not.toContainText('Draft State QA — Local Revision');

            expect(pageErrors).toEqual([]);
          });
          NODE

      - name: Run focused Writer draft/session QA
        env:
          NODE_PATH: ${{ github.workspace }}/node_modules
        run: npx playwright test /tmp/writer-draft-state.spec.cjs --workers=1 --reporter=line
