name: Validate UFC active roster source

on:
  pull_request:
    branches:
      - main
    paths:
      - "scripts/ufc-active-validation-trigger.txt"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe UFC active roster sources
        run: |
          node <<'NODE'
          const ORIGINS = ['https://www.ufc.com','https://kr.ufc.com','https://jp.ufc.com'];
          const FILTER = 'filters%5B0%5D=status%3A23';
          const UA = 'Mozilla/5.0 (compatible; MMAMatlockRosterValidation/1.0; +https://matlockfighttalk.com/)';

          async function req(url, options={}) {
            const r = await fetch(url, {redirect:'follow', ...options, headers:{'user-agent':UA,accept:'text/html,application/json,*/*',...(options.headers||{})}});
            const text = await r.text();
            return {status:r.status,url:r.url,text};
          }
          function decode(s=''){return s.replaceAll('\\/','/').replace(/\\u0026/g,'&').replace(/\\u003C/g,'<').replace(/\\u003E/g,'>').replace(/&amp;/g,'&');}
          function norm(raw){try{const u=new URL(raw,'https://www.ufc.com');if(!/^\/athlete\/[^/?#]+\/?$/.test(u.pathname))return null;return 'https://www.ufc.com'+u.pathname.replace(/\/$/,'');}catch{return null}}
          function extract(text){const d=decode(text), out=new Set();const pats=[/href=["']([^"']*\/athlete\/[^"'?#/]+\/?(?:\?[^"']*)?)["']/gi,/https?:\/\/(?:www\.|kr\.|jp\.)?ufc\.com\/athlete\/[^"'<>\s?]+/gi];for(const p of pats)for(const m of d.matchAll(p)){const n=norm(m[1]||m[0]);if(n)out.add(n)}return out}
          function add(to,from){let n=0;for(const x of from)if(!to.has(x)){to.add(x);n++}return n}

          async function direct(origin){const all=new Set();let dup=0;for(let page=0;page<80;page++){const r=await req(`${origin}/athletes/all?${FILTER}&page=${page}`);if(r.status!==200)throw new Error(`HTTP ${r.status}`);const f=extract(r.text), n=add(all,f);console.log(`PAGE ${origin} direct page=${page} found=${f.size} new=${n} total=${all.size} bytes=${r.text.length}`);dup=(f.size===0||n===0)?dup+1:0;if(dup>=2)break}return all}
          function spec(mode,origin,page){let url=`${origin}/views/ajax?_wrapper_format=drupal_ajax`;const body=new URLSearchParams({view_name:'all_athletes',view_display_id:'page',view_args:'',view_path:'/athletes/all',view_base_path:'',pager_element:'0',gender:'All',search:'',page:String(page)});if(['query','query-body','query-viewpath'].includes(mode))url+=`&${FILTER}`;if(['body','query-body'].includes(mode))body.set('filters[0]','status:23');if(['viewpath','query-viewpath'].includes(mode))body.set('view_path','/athletes/all?filters%5B0%5D=status%3A23');return{url,body}}
          async function ajax(origin,mode){const all=new Set();let dup=0;for(let page=0;page<80;page++){const {url,body}=spec(mode,origin,page);const r=await req(url,{method:'POST',headers:{'content-type':'application/x-www-form-urlencoded; charset=UTF-8','x-requested-with':'XMLHttpRequest',referer:`${origin}/athletes/all?${FILTER}`},body});if(r.status!==200)throw new Error(`HTTP ${r.status}`);const f=extract(r.text), n=add(all,f);console.log(`PAGE ${origin} ${mode} page=${page} found=${f.size} new=${n} total=${all.size} bytes=${r.text.length}`);dup=(f.size===0||n===0)?dup+1:0;if(dup>=2)break}return all}
          function verdict(set){const knownActive=['https://www.ufc.com/athlete/islam-makhachev','https://www.ufc.com/athlete/tom-aspinall'];const knownInactive=['https://www.ufc.com/athlete/muhammad-mokaev'];return{count:set.size,islam:set.has(knownActive[0]),aspinall:set.has(knownActive[1]),mokaev:set.has(knownInactive[0]),plausible:set.size>=350&&set.size<=900,valid:set.size>=350&&set.size<=900&&knownActive.every(x=>set.has(x))&&knownInactive.every(x=>!set.has(x)),sample:[...set].slice(0,12)}}

          const results=[];
          for(const origin of ORIGINS){for(const mode of ['direct','query','body','viewpath','query-body','query-viewpath']){try{const set=mode==='direct'?await direct(origin):await ajax(origin,mode);const v=verdict(set);results.push({origin,mode,...v});console.log('VERDICT',JSON.stringify(results.at(-1)));if(v.valid){console.log('SUCCESS_ACTIVE_ROSTER',JSON.stringify(results.at(-1)));process.exit(0)}}catch(e){results.push({origin,mode,error:e.message});console.log('ERROR',JSON.stringify(results.at(-1)))}}}
          console.log('NO_VALID_ACTIVE_ROSTER',JSON.stringify(results));
          process.exit(2);
          NODE
