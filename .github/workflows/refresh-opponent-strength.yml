name: Refresh opponent strength

on:
  workflow_dispatch:
    inputs:
      post_path:
        description: "Optional article markdown path; blank auto-selects newest unpublished Tale draft"
        required: false
        default: ""
      event_url:
        description: "Optional Sherdog event URL; blank auto-discovers the matching UFC event"
        required: false
        default: ""
  schedule:
    - cron: "17 12 * * 2,5"
  push:
    branches: [main]
    paths:
      - ".github/workflows/refresh-opponent-strength.yml"
      - "scripts/writer/refresh-opponent-strength.mjs"
      - "scripts/matchmaker/build-writer-fighters.mjs"
      - "_netlify-auth/netlify/functions/_writer-career-fallback.mjs"

permissions:
  contents: write

concurrency:
  group: writer-opponent-strength
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            _netlify-auth/netlify/functions
            _posts
            assets/data
            scripts/matchmaker
            scripts/writer
          sparse-checkout-cone-mode: true

      - uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"

      - name: Validate refresh script
        run: node --check scripts/writer/refresh-opponent-strength.mjs

      - name: Refresh full-career opponent strength
        env:
          WRITER_STRENGTH_POST: ${{ inputs.post_path || '' }}
          SHERDOG_EVENT_URL: ${{ inputs.event_url || '' }}
        run: node scripts/writer/refresh-opponent-strength.mjs

      - name: Rebuild Writer fighter cache
        run: node scripts/matchmaker/build-writer-fighters.mjs

      - name: Validate generated data
        run: |
          node -e "const fs=require('fs');const c=JSON.parse(fs.readFileSync('assets/data/writer-opponent-strength.json'));if(!c.updatedAt||Object.keys(c.fighters||{}).length<20)throw Error('strength cache incomplete');console.log('Strength fighters:',Object.keys(c.fighters).length,'last refresh:',c.lastRefresh?.postPath||'none')"
          node -e "const fs=require('fs');const d=JSON.parse(fs.readFileSync('assets/data/writer-fighters.json'));const hits=(d.fighters||[]).filter(f=>f.opponentStrength?.complete);if(hits.length<20)throw Error('Writer cache missing strength data');console.log('Writer strength rows:',hits.length)"
          git diff --check

      - name: Commit refreshed strength data
        run: |
          if git diff --quiet; then
            echo "No opponent-strength changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/data/writer-opponent-strength.json assets/data/writer-fighters.json _posts
          git commit -m "Refresh full-career opponent strength"
          git push origin HEAD:main

# Manual UFC 333 refresh trigger
