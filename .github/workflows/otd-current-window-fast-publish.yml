name: OTD Current Window Fast Publish

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/otd-current-window-fast-publish.yml"
      - "scripts/apply-on-this-day-image-source-overrides.mjs"
      - "scripts/apply-on-this-day-current-poster-fallbacks.mjs"
      - "scripts/resolve-current-on-this-day-tapology-posters.mjs"
      - "scripts/resolve-on-this-day-tapology-posters.mjs"
      - "scripts/resolve-on-this-day-event-posters.mjs"
      - "scripts/resolve-on-this-day-event-poster-pipeline.mjs"
      - "scripts/sync-on-this-day-poster-registry.mjs"
      - "scripts/sanitize-on-this-day-tapology-posters.mjs"
      - "scripts/prune-on-this-day-poster-registry.mjs"
      - "scripts/finalize-on-this-day-image-metadata.mjs"
      - "scripts/check-on-this-day-images.mjs"
      - "scripts/build-on-this-day-runtime.mjs"
      - "scripts/build-on-this-day-home.mjs"
      - "scripts/build-on-this-day-leads.mjs"
      - "scripts/build-on-this-day-share-images.mjs"
      - "scripts/build-on-this-day-share-safe.mjs"
      - "scripts/share-title-layout.mjs"
      - "scripts/share-card-composition.mjs"
      - "scripts/check-on-this-day-share.mjs"
      - "assets/share-gobold.mjs"
      - "assets/textures/otd-gaffer-tape-v1.png"
      - "assets/textures/otd-xerox-paper-v1.webp"
      - "assets/data/on-this-day-share-sources.json"
      - "assets/data/on-this-day-image-source-overrides.json"
      - "assets/data/on-this-day-current-poster-fallbacks.json"

permissions:
  contents: write

concurrency:
  group: on-this-day-history
  cancel-in-progress: false

jobs:
  fast-publish:
    if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip otd-refresh]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OTD_TIME_ZONE: "America/Chicago"
      OTD_TAPOLOGY_POSTER_LIMIT: "48"
      OTD_EVENT_POSTER_LIMIT: "120"
      OTD_CURRENT_WINDOW_DAYS: "2"
      OTD_POSTER_PUBLIC_BASE: "https://raw.githubusercontent.com/MatlockFT/Matlock/otd-poster-cache"
      OTD_SHARE_WINDOW_DAYS: "2"
      OTD_SHARE_MAX_PER_DAY: "12"
      OTD_SHARE_CONCURRENCY: "3"
      OTD_SHARE_OUTPUT_DIR: ".otd-share-cache"
      OTD_SHARE_MANIFEST_PATH: "assets/data/on-this-day-share-manifest.json"
      OTD_SHARE_PUBLIC_BASE: "https://raw.githubusercontent.com/MatlockFT/Matlock/otd-share-cache"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check fast-path syntax
        run: |
          node --check scripts/apply-on-this-day-image-source-overrides.mjs
          node --check scripts/apply-on-this-day-current-poster-fallbacks.mjs
          node --check scripts/resolve-current-on-this-day-tapology-posters.mjs
          node --check scripts/resolve-on-this-day-tapology-posters.mjs
          node --check scripts/resolve-on-this-day-event-posters.mjs
          node --check scripts/resolve-on-this-day-event-poster-pipeline.mjs
          node --check scripts/sync-on-this-day-poster-registry.mjs
          node --check scripts/sanitize-on-this-day-tapology-posters.mjs
          node --check scripts/prune-on-this-day-poster-registry.mjs
          node --check scripts/finalize-on-this-day-image-metadata.mjs
          node --check scripts/check-on-this-day-images.mjs
          node --check scripts/build-on-this-day-runtime.mjs
          node --check scripts/build-on-this-day-home.mjs
          node --check scripts/build-on-this-day-leads.mjs
          node --check scripts/build-on-this-day-share-images.mjs
          node --check scripts/build-on-this-day-share-safe.mjs
          node --check scripts/share-title-layout.mjs
          node --check scripts/check-on-this-day-share.mjs

      - name: Validate deterministic current poster fallback registry
        run: |
          node -e "const d=JSON.parse(require('fs').readFileSync('assets/data/on-this-day-current-poster-fallbacks.json','utf8')); const allowed=new Set(['official-promotion-event-poster','wikipedia-event-poster','archived-promotion-event-poster','verified-manual-event-poster']); if(!Array.isArray(d.entries)) process.exit(1); for(const e of d.entries){ if(!e.date||!e.title||!e.sourceUrl||!e.imageUrl||!allowed.has(e.sourceType)||Number(e.confidence)<0.9) process.exit(1); if(e.sourceType==='verified-manual-event-poster'&&e.manualVisualVerified!==true) process.exit(1); }"

      - name: Prepare immutable poster cache checkout
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cache_dir="$RUNNER_TEMP/otd-poster-cache"
          if git ls-remote --exit-code --heads origin otd-poster-cache >/dev/null 2>&1; then
            git clone --depth 1 --branch otd-poster-cache "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$cache_dir"
          else
            mkdir -p "$cache_dir"
            git -C "$cache_dir" init
            git -C "$cache_dir" checkout -b otd-poster-cache
            git -C "$cache_dir" remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          fi
          echo "OTD_POSTER_OUTPUT_DIR=$cache_dir" >> "$GITHUB_ENV"

      - name: Resolve canonical current-window event posters
        run: node scripts/resolve-on-this-day-event-poster-pipeline.mjs --current-window

      - name: Publish immutable poster bytes
        shell: bash
        run: |
          set -euo pipefail
          git -C "$OTD_POSTER_OUTPUT_DIR" config user.name "github-actions[bot]"
          git -C "$OTD_POSTER_OUTPUT_DIR" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$OTD_POSTER_OUTPUT_DIR" add --all
          if git -C "$OTD_POSTER_OUTPUT_DIR" diff --cached --quiet; then
            echo "No new poster bytes."
          else
            git -C "$OTD_POSTER_OUTPUT_DIR" commit -m "Cache verified On This Day posters"
            git -C "$OTD_POSTER_OUTPUT_DIR" push origin HEAD:otd-poster-cache
          fi

      - name: Enforce current-window and birthday image QA
        run: npm run check:history-images

      - name: Build browser runtime immediately
        run: npm run build:history-runtime

      - name: Build current-window share images safely
        run: node scripts/build-on-this-day-share-safe.mjs

      - name: Validate current-window share manifest
        run: npm run check:history-share

      - name: Build homepage snapshot
        run: node scripts/build-on-this-day-home.mjs

      - name: Build lead-image indexes
        run: |
          node scripts/build-on-this-day-leads.mjs
          mkdir -p _data
          cp assets/data/on-this-day-leads.json _data/on_this_day_leads.json

      - name: Commit current-window OTD changes
        shell: bash
        run: |
          set -euo pipefail
          tracked_paths=(
            assets/data/on-this-day.json
            assets/data/on-this-day-image-cache.json
            assets/data/on-this-day-poster-registry.json
            assets/data/on-this-day-home.json
            assets/data/on-this-day-leads.json
            assets/data/on-this-day-share-manifest.json
            assets/data/on-this-day-runtime
            _data/on_this_day_leads.json
          )
          if [ -z "$(git status --porcelain -- "${tracked_paths[@]}")" ]; then
            echo "No current-window OTD changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "${tracked_paths[@]}"
          git commit -m "Fast-publish current On This Day images"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Publish rolling share image cache
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ -f "$OTD_SHARE_OUTPUT_DIR/.reuse-complete" ]; then
            echo "Share render inputs are unchanged; keeping the existing otd-share-cache branch."
            rm -rf "$OTD_SHARE_OUTPUT_DIR"
            exit 0
          fi
          cache_repo="$(mktemp -d)"
          cp -R "$OTD_SHARE_OUTPUT_DIR"/. "$cache_repo/"
          cd "$cache_repo"
          git init
          git checkout -b otd-share-cache
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Refresh On This Day share cache"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin HEAD:refs/heads/otd-share-cache
          cd - >/dev/null
          rm -rf "$OTD_SHARE_OUTPUT_DIR" "$cache_repo"
