name: Compare FEN embed variants

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/compare-fen-embed-variants.yml"

permissions:
  contents: write

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Chromium
        run: |
          npm install --no-save --no-package-lock @playwright/test@1.55.0
          npx playwright install --with-deps chromium

      - name: Compare embed variants from mmamatlock origin
        run: |
          node <<'NODE'
          const { chromium } = require('@playwright/test');

          const variants = [
            {
              name: 'minimal-youtube',
              src: 'https://www.youtube.com/embed/cv2svtEOyIw'
            },
            {
              name: 'minimal-nocookie',
              src: 'https://www.youtube-nocookie.com/embed/cv2svtEOyIw'
            },
            {
              name: 'minimal-autoplay-muted',
              src: 'https://www.youtube.com/embed/cv2svtEOyIw?autoplay=1&mute=1&playsinline=1&controls=1'
            },
            {
              name: 'jsapi-current',
              src: 'https://www.youtube.com/embed/cv2svtEOyIw?autoplay=1&mute=1&playsinline=1&controls=1&enablejsapi=1&origin=https%3A%2F%2Fmmamatlock.com'
            }
          ];

          (async () => {
            const browser = await chromium.launch({ channel: 'chrome' });

            for (const variant of variants) {
              const context = await browser.newContext({ viewport: { width: 1280, height: 800 } });
              const page = await context.newPage();

              await page.route('https://mmamatlock.com/embed-probe', route =>
                route.fulfill({
                  status: 200,
                  contentType: 'text/html',
                  body: '<!doctype html><meta name="referrer" content="strict-origin-when-cross-origin"><body style="margin:0;background:#000"><iframe id="p" src="' + variant.src + '" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen referrerpolicy="strict-origin-when-cross-origin" style="width:960px;height:540px;border:0"></iframe></body>'
                })
              );

              await page.goto('https://mmamatlock.com/embed-probe', { waitUntil: 'domcontentloaded', timeout: 45000 });
              await page.waitForTimeout(9000);

              const ytFrame = page.frames().find(f => f !== page.mainFrame() && (f.url().includes('youtube.com/embed') || f.url().includes('youtube-nocookie.com/embed')));
              let info = { frameUrl: ytFrame?.url() || null };
              if (ytFrame) {
                try {
                  info = {
                    ...info,
                    ...(await ytFrame.evaluate(() => {
                      const v = document.querySelector('video');
                      return {
                        title: document.title,
                        bodyText: (document.body?.innerText || '').slice(0, 1200),
                        video: v ? {
                          paused: v.paused,
                          currentTime: v.currentTime,
                          duration: Number.isFinite(v.duration) ? v.duration : null,
                          readyState: v.readyState,
                          networkState: v.networkState,
                          currentSrc: v.currentSrc,
                          muted: v.muted,
                          error: v.error ? { code: v.error.code, message: v.error.message } : null
                        } : null
                      };
                    }))
                  };
                } catch (e) {
                  info.evalError = e.message;
                }
              }

              console.log('VARIANT_RESULT', variant.name, JSON.stringify(info));
              await page.screenshot({ path: variant.name + '.png' });
              await context.close();
            }

            await browser.close();
          })().catch(err => {
            console.error(err);
            process.exit(1);
          });
          NODE

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: fen-embed-variants
          path: "*.png"

      - name: Remove comparison
        if: always()
        run: |
          git config user.name "MatlockFT"
          git config user.email "fighttalkmma@protonmail.com"
          git rm .github/workflows/compare-fen-embed-variants.yml
          git commit -m "Remove FEN embed variant comparison" || exit 0
          git push origin HEAD:main
