name: Writer auth quality

on:
  pull_request:
    paths:
      - "write.html"
      - "assets/writer.js"
      - "assets/writer-auth.js"
      - "assets/writer.css"
      - "_netlify-auth/**"
      - ".github/workflows/writer-auth-quality.yml"
  push:
    branches:
      - main
    paths:
      - "write.html"
      - "assets/writer.js"
      - "assets/writer-auth.js"
      - "assets/writer.css"
      - "_netlify-auth/**"
      - ".github/workflows/writer-auth-quality.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22.12.0"

      - name: Check Writer browser scripts
        run: |
          node --check assets/writer.js
          node --check assets/writer-auth.js

      - name: Install auth bridge dependency
        working-directory: _netlify-auth
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Check Netlify auth functions
        working-directory: _netlify-auth
        run: |
          for file in netlify/functions/*.mjs; do
            echo "Checking $file"
            node --check "$file"
          done
          node -e "import('./netlify/functions/_github-auth.mjs').then(() => console.log('Auth helper imports successfully.'))"
