name: Repair broadcast video compatibility v2

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/repair-broadcast-video-v2.yml"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      SOURCE_URL: "https://github.com/MatlockFT/Matlock/releases/download/writer-media-2026-10/broadcast-video-Video-by-titos.cantina-20261001072003475.mp4"
      RELEASE_TAG: "writer-media-2026-10"
      TARGET_NAME: "broadcast-video-Video-by-titos.cantina-20261001072003475-h264.mp4"
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install bundled ffmpeg
        run: |
          python -m pip install --disable-pip-version-check imageio-ffmpeg==0.6.0
          echo "FFMPEG_BIN=$(python -c 'import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())')" >> "$GITHUB_ENV"

      - name: Confirm ffmpeg
        run: |
          "$FFMPEG_BIN" -version | head -n 2

      - name: Download uploaded source
        run: |
          curl -L --fail --retry 3 --retry-delay 2 "$SOURCE_URL" -o source.mp4
          test -s source.mp4
          ls -lh source.mp4

      - name: Inspect source and decode one frame
        run: |
          "$FFMPEG_BIN" -hide_banner -i source.mp4 -map 0:v:0 -frames:v 1 -f null -

      - name: Transcode to browser-safe MP4
        run: |
          "$FFMPEG_BIN" -hide_banner -y -i source.mp4 \
            -map 0:v:0 -map 0:a? \
            -c:v libx264 -preset fast -crf 20 \
            -pix_fmt yuv420p -profile:v high -level 4.1 \
            -c:a aac -b:a 160k \
            -movflags +faststart \
            "$TARGET_NAME"

      - name: Verify repaired file
        run: |
          "$FFMPEG_BIN" -hide_banner -i "$TARGET_NAME" -map 0:v:0 -frames:v 1 -f null -
          ls -lh "$TARGET_NAME"

      - name: Upload repaired video
        run: |
          gh release upload "$RELEASE_TAG" "$TARGET_NAME" --clobber
