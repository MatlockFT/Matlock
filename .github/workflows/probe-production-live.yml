name: Probe production Live player

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/probe-production-live.yml"

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Chromium
        run: |
          npm install --no-save --no-package-lock @playwright/test@1.55.0
          npx playwright install --with-deps chromium

      - name: Probe real production Live page
        run: |
          node <<'NODE'
          const { chromium } = require('@playwright/test');

          (async () => {
            const browser = await chromium.launch();
            const context = await browser.newContext({
              viewport: { width: 1365, height: 900 },
              permissions: []
            });
            const page = await context.newPage();

            page.on('console', msg => console.log('PAGE_CONSOLE', msg.type(), msg.text()));
            page.on('pageerror', err => console.log('PAGE_ERROR', err.message));

            await page.goto('https://mmamatlock.com/live/?probe=' + Date.now(), {
              waitUntil: 'domcontentloaded',
              timeout: 45000
            });

            await page.waitForSelector('[data-live-page]', { timeout: 30000 });
            await page.waitForTimeout(6000);

            const initial = await page.evaluate(() => {
              const frame = document.querySelector('[data-live-player]');
              const title = document.querySelector('[data-live-title]')?.textContent?.trim();
              const rows = [...document.querySelectorAll('[data-live-list] .live-page__row--button')].map(node => node.textContent.trim());
              return {
                title,
                iframeSrc: frame?.getAttribute('src') || null,
                screenState: document.querySelector('[data-live-screen]')?.dataset?.state || null,
                rows
              };
            });
            console.log('INITIAL', JSON.stringify(initial));

            const fenRow = page.locator('[data-live-list] .live-page__row--button').filter({ hasText: 'FACE TO FACE' }).first();
            if (await fenRow.count()) {
              await fenRow.click();
              await page.waitForTimeout(2500);
            } else {
              console.log('NO_FACE_TO_FACE_ROW');
            }

            const afterSwitch = await page.evaluate(() => ({
              title: document.querySelector('[data-live-title]')?.textContent?.trim(),
              iframeSrc: document.querySelector('[data-live-player]')?.getAttribute('src') || null,
              screenState: document.querySelector('[data-live-screen]')?.dataset?.state || null,
              playLabel: document.querySelector('[data-media-play]')?.getAttribute('aria-label') || null
            }));
            console.log('AFTER_SWITCH', JSON.stringify(afterSwitch));

            const play = page.locator('[data-media-play]');
            if (await play.count()) {
              await play.click();
              await page.waitForTimeout(2500);
            }

            const afterPlay = await page.evaluate(() => ({
              title: document.querySelector('[data-live-title]')?.textContent?.trim(),
              iframeSrc: document.querySelector('[data-live-player]')?.getAttribute('src') || null,
              screenState: document.querySelector('[data-live-screen]')?.dataset?.state || null,
              playLabel: document.querySelector('[data-media-play]')?.getAttribute('aria-label') || null,
              playGlyph: document.querySelector('[data-media-play-icon]')?.textContent || null
            }));
            console.log('AFTER_PLAY', JSON.stringify(afterPlay));

            await page.screenshot({ path: 'live-probe.png', fullPage: true });
            await browser.close();
          })().catch(err => {
            console.error(err);
            process.exit(1);
          });
          NODE

      - name: Upload probe screenshot
        uses: actions/upload-artifact@v4
        with:
          name: production-live-probe
          path: live-probe.png

      - name: Remove one-shot probe
        if: always()
        run: |
          git config user.name "MatlockFT"
          git config user.email "fighttalkmma@protonmail.com"
          git rm .github/workflows/probe-production-live.yml
          git commit -m "Remove production Live probe" || exit 0
          git push origin HEAD:main
