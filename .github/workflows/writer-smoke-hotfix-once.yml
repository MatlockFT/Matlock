name: Writer smoke assertion hotfix once

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/writer-smoke-hotfix-once.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix textarea value assertions
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/writer-smoke.spec.cjs')
          s = p.read_text()
          old = "await expect(page.locator('#writer-body')).toContainText('Closing section');"
          if s.count(old) != 2:
              raise SystemExit(f'expected 2 textarea assertions, found {s.count(old)}')
          s = s.replace(old, "await expect(page.locator('#writer-body')).toHaveValue(/Closing section/);")
          p.write_text(s)
          PY
      - name: Commit smoke assertion fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/writer-smoke.spec.cjs
          git commit -m "Fix Writer smoke textarea assertions"
          git push origin HEAD:main
