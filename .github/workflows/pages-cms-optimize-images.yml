name: Optimize site images

on:
  push:
    paths:
      - '_posts/**'
      - 'assets/uploads/**'
      - 'assets/header-image.png'
      - 'scripts/optimize-post-images.mjs'
      - '.github/workflows/pages-cms-optimize-images.yml'
  workflow_dispatch:
    inputs:
      payload:
        description: Pages CMS payload as JSON
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: site-image-optimization-${{ github.ref }}
  cancel-in-progress: false

jobs:
  optimize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out current branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate responsive images
        run: npm run optimize:images

      - name: Validate content
        run: npm run check:content

      - name: Commit optimized images
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- assets/generated/posts assets/generated/site _data/responsive_images.yml; then
            echo "Images are already optimized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- assets/generated/posts assets/generated/site _data/responsive_images.yml
          git commit -m "Optimize site images"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
