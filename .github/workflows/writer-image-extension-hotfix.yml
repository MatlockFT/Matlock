name: Writer image extension hotfix

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/writer-image-extension-hotfix.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Keep optimized image extension accurate
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('assets/writer.js')
          text = path.read_text(encoding='utf-8')
          old = """    const optimized = await optimizeImage(file);\n    const safeName = (preferredName || optimized.name).replace(/[^A-Za-z0-9._-]+/g,'-');\n    const path = `assets/uploads/${safeName}`;\n"""
          new = """    const optimized = await optimizeImage(file);\n    let uploadName = preferredName || optimized.name;\n    const optimizedExtension = optimized.name.match(/\\.[^.]+$/)?.[0] || '';\n    const preferredExtension = uploadName.match(/\\.[^.]+$/)?.[0] || '';\n    if (preferredName && optimizedExtension && preferredExtension.toLowerCase() !== optimizedExtension.toLowerCase()) {\n      uploadName = `${preferredName.replace(/\\.[^.]+$/, '')}${optimizedExtension}`;\n    }\n    const safeName = uploadName.replace(/[^A-Za-z0-9._-]+/g,'-');\n    const path = `assets/uploads/${safeName}`;\n"""
          if text.count(old) != 1:
              raise SystemExit(f'Expected exactly one uploadAsset block, found {text.count(old)}')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY

      - name: Check Writer JavaScript
        run: node --check assets/writer.js

      - name: Commit hotfix
        run: |
          if git diff --quiet -- assets/writer.js; then
            echo "No changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/writer.js
          git commit -m "Keep optimized Writer image extensions accurate"
          git push
