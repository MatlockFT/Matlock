name: Deploy Writer auth to Cloudflare

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type DEPLOY to create/update free-plan KV/Queue resources and deploy the Worker."
        required: true
        type: string
  push:
    branches:
      - main
    paths:
      - "_cloudflare-auth/**"
      - ".github/workflows/deploy-writer-cloudflare.yml"

permissions:
  contents: read

concurrency:
  group: cloudflare-writer-auth-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event_name == 'push' || inputs.confirmation == 'DEPLOY' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"

      - name: Validate Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Add the CLOUDFLARE_API_TOKEN repository secret first."; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Add the CLOUDFLARE_ACCOUNT_ID repository secret first."; exit 1; }

      - name: Check Worker code and Wrangler configuration
        run: |
          node --check _cloudflare-auth/worker.mjs
          node --check _cloudflare-auth/functions/_cloudflare-store.mjs
          node --test _cloudflare-auth/test/*.test.mjs
          npx --yes wrangler@4 deploy --dry-run --config _cloudflare-auth/wrangler.toml

      - name: Install Wrangler
        run: npm install --global wrangler@4

      - name: Ensure media queues exist
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          wrangler queues list > /tmp/writer-queues.txt
          if ! grep -Fq "mmamatlock-writer-media-process" /tmp/writer-queues.txt; then
            wrangler queues create mmamatlock-writer-media-process
          fi
          if ! grep -Fq "mmamatlock-writer-media-dlq" /tmp/writer-queues.txt; then
            wrangler queues create mmamatlock-writer-media-dlq
          fi

      - name: Deploy Worker
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -o pipefail
          wrangler deploy --config _cloudflare-auth/wrangler.toml 2>&1 | tee /tmp/wrangler-deploy.log
          worker_url="$(grep -Eo 'https://mmamatlock-writer-auth\.[[:alnum:]-]+\.workers\.dev' /tmp/wrangler-deploy.log | tail -n 1 || true)"
          {
            echo "## Cloudflare Writer Auth deployment"
            echo
            echo "Deployment completed. Check the deployment log for the Worker URL."
            if [ -n "$worker_url" ]; then
              echo
              echo "**Worker URL:** $worker_url"
              echo
              echo "Health check: $worker_url/__health"
              echo "GitHub App setup: $worker_url/setup/github-app"
            else
              echo
              echo "Wrangler did not print a parsable URL. Open Cloudflare Workers & Pages and copy the URL for `mmamatlock-writer-auth`."
            fi
            echo
            echo "Do not change the live site URLs until the Worker health check and GitHub App setup both succeed."
          } >> "$GITHUB_STEP_SUMMARY"
