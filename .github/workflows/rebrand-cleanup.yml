name: One-time MMA Matlock rebrand cleanup

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/rebrand-cleanup.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace retired domain and brand identifiers
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path('.')
          old_domain = ''.join(['matlock', 'fighttalk', '.com'])
          old_compact = ''.join(['Matlock', 'FightTalk'])
          new_domain = 'mmamatlock.com'
          changed = []
          skip_dirs = {'.git', '_site', 'node_modules', 'vendor'}

          for path in root.rglob('*'):
              if not path.is_file() or any(part in skip_dirs for part in path.parts):
                  continue
              try:
                  raw = path.read_bytes()
                  if b'\x00' in raw:
                      continue
                  text = raw.decode('utf-8')
              except (UnicodeDecodeError, OSError):
                  continue

              updated = text.replace(old_domain, new_domain).replace(old_compact, 'MMAMatlock')

              if path.as_posix() == 'scripts/check-site.mjs':
                  updated = re.sub(
                      r"const internalHosts = new Set\(\[.*?\]\);",
                      "const internalHosts = new Set([\n            'mmamatlock.com',\n            'www.mmamatlock.com'\n        ]);",
                      updated,
                      count=1,
                      flags=re.S,
                  )

              if path.as_posix() == '_config.yml':
                  match = re.search(r'asset_version:\s*"(\d+)"', updated)
                  if match:
                      version = int(match.group(1))
                      updated = updated[:match.start(1)] + str(version + 1) + updated[match.end(1):]

              if updated != text:
                  path.write_text(updated, encoding='utf-8')
                  changed.append(path.as_posix())

          guard = """import { readdirSync, readFileSync, statSync } from 'node:fs';
          import { extname, join } from 'node:path';

          const retiredDomain = ['matlock', 'fighttalk', '.com'].join('');
          const retiredBrand = ['Matlock', 'Fight', 'Talk'].join(' ');
          const retiredCompact = ['Matlock', 'FightTalk'].join('');
          const roots = ['.', '.github', '_includes', '_layouts', 'assets', 'scripts'];
          const skipDirs = new Set(['.git', '_site', 'node_modules', 'vendor', '_posts', '_data']);
          const skipFiles = new Set(['scripts/check-brand-identity.mjs']);
          const textExtensions = new Set(['.html', '.md', '.js', '.mjs', '.cjs', '.css', '.scss', '.yml', '.yaml', '.json', '.xml', '.txt']);
          const failures = [];
          const seen = new Set();

          function inspect(path) {
              if (seen.has(path) || skipFiles.has(path)) return;
              seen.add(path);
              let stat;
              try { stat = statSync(path); } catch { return; }
              if (stat.isDirectory()) {
                  const name = path.split('/').pop();
                  if (skipDirs.has(name)) return;
                  for (const entry of readdirSync(path)) inspect(join(path, entry).replaceAll('\\\\', '/'));
                  return;
              }
              const ext = extname(path).toLowerCase();
              if (ext && !textExtensions.has(ext)) return;
              let text;
              try { text = readFileSync(path, 'utf8'); } catch { return; }
              for (const retired of [retiredDomain, retiredBrand, retiredCompact]) {
                  if (text.includes(retired)) failures.push(`${path}: contains retired identity ${retired}`);
              }
          }

          for (const root of roots) inspect(root);

          if (failures.length) {
              console.error('Retired MMA Matlock identity references found:');
              for (const failure of failures) console.error(`- ${failure}`);
              process.exit(1);
          }

          console.log('Brand identity check passed: mmamatlock.com / MMA Matlock only.');
          """
          guard = '\n'.join(line[10:] if line.startswith('          ') else line for line in guard.splitlines()) + '\n'
          Path('scripts/check-brand-identity.mjs').write_text(guard, encoding='utf-8')

          quality = Path('.github/workflows/site-quality.yml')
          quality_text = quality.read_text(encoding='utf-8')
          marker = '      - name: Check article content and image metadata\n'
          step = '      - name: Check current brand identity\n        run: node scripts/check-brand-identity.mjs\n\n'
          if step not in quality_text:
              if marker not in quality_text:
                  raise SystemExit('Could not locate Site Quality insertion point')
              quality_text = quality_text.replace(marker, step + marker, 1)
              quality.write_text(quality_text, encoding='utf-8')

          print(f'Rebranded {len(changed)} existing files.')
          for path in changed:
              print(path)
          PY

      - name: Validate cleanup
        run: |
          node scripts/check-brand-identity.mjs
          node --check scripts/check-brand-identity.mjs
          node --check assets/event-map-v2.js
          grep -q '^mmamatlock.com$' CNAME
          grep -q 'url: "https://mmamatlock.com"' _config.yml

      - name: Commit cleanup
        shell: bash
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo "No cleanup changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Complete MMA Matlock domain rebrand"
          git push origin HEAD:main
