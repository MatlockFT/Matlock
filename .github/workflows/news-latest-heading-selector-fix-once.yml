name: One-time News Latest heading selector fix

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/news-latest-heading-selector-fix-once.yml

permissions:
  contents: write

jobs:
  fix-selector:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Fix Latest heading selector and bump assets
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          css_path = Path('assets/news.css')
          css = css_path.read_text(encoding='utf-8')
          count = css.count('.news-latest-header h3')
          if count < 1:
              raise SystemExit('Expected Latest h3 selector not found')
          css = css.replace('.news-latest-header h3', '.news-latest-header h2')
          css_path.write_text(css, encoding='utf-8')

          cfg_path = Path('_config.yml')
          cfg = cfg_path.read_text(encoding='utf-8')
          m = re.search(r'(?m)^asset_version: "(\d+)"$', cfg)
          if not m:
              raise SystemExit('asset_version not found')
          version = int(m.group(1))
          cfg = cfg[:m.start(1)] + str(version + 1) + cfg[m.end(1):]
          cfg_path.write_text(cfg, encoding='utf-8')
          print(f'Fixed {count} Latest heading selector(s). asset_version {version} -> {version + 1}')
          PY

      - name: Validate
        shell: bash
        run: |
          set -euo pipefail
          ! grep -Fq '.news-latest-header h3' assets/news.css
          grep -Fq '.news-latest-header h2' assets/news.css
          grep -Eq '^asset_version: "[0-9]+"$' _config.yml

      - name: Commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/news.css _config.yml
          git commit -m "Fix News Latest heading spacing selector"
          git pull --rebase origin main
          git push origin HEAD:main
