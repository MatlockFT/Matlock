name: One-time Event Map click commit fix

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/event-map-click-commit-fix-once.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Apply click commit fix
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          core_path = Path('assets/event-map-v2.js')
          core = core_path.read_text(encoding='utf-8')

          old_end = "                .on('end', renderMarkers);"
          new_end = "                .on('end', event => {\n                    if (event.sourceEvent) setTimeout(renderMarkers, 0);\n                    else renderMarkers();\n                });"
          if old_end not in core:
              raise SystemExit('Could not locate zoom-end marker render')
          core = core.replace(old_end, new_end, 1)

          old_focus = "  .on('focus', (_, cluster) => {\n      if (selectedEventId || selectedClusterKey) return;\n      cluster.events.length > 1 ? previewCluster(cluster) : previewEvent(cluster.events[0]);\n  })\n  .on('blur', restoreSelectedDetail)"
          new_focus = "  .on('focus', (_, cluster) => {\n      if (!desktopHover.matches || selectedEventId || selectedClusterKey) return;\n      cluster.events.length > 1 ? previewCluster(cluster) : previewEvent(cluster.events[0]);\n  })\n  .on('blur', () => {\n      if (!desktopHover.matches) return;\n      restoreSelectedDetail();\n  })"
          if old_focus not in core:
              raise SystemExit('Could not locate marker focus preview handlers')
          core = core.replace(old_focus, new_focus, 1)
          core_path.write_text(core, encoding='utf-8')

          checker_path = Path('scripts/check-event-map-architecture.mjs')
          checker = checker_path.read_text(encoding='utf-8')
          anchor = "requireText(core, '.tapDistance(12)', 'Map zoom must use a touch tap-distance threshold.');"
          addition = anchor + "\nrequireText(core, 'setTimeout(renderMarkers, 0)', 'Input-driven zoom end must not replace a marker before its native click commits.');\nrequireText(core, '!desktopHover.matches || selectedEventId || selectedClusterKey', 'Touch focus must not masquerade as a committed mobile pin selection.');"
          if anchor not in checker:
              raise SystemExit('Could not locate architecture anchor')
          checker = checker.replace(anchor, addition, 1)
          checker_path.write_text(checker, encoding='utf-8')

          config_path = Path('_config.yml')
          config = config_path.read_text(encoding='utf-8')
          match = re.search(r'(?m)^asset_version: "(\d+)"$', config)
          if not match:
              raise SystemExit('Could not locate asset_version')
          old_version = int(match.group(1))
          config = config[:match.start(1)] + str(old_version + 1) + config[match.end(1):]
          config_path.write_text(config, encoding='utf-8')
          print(f'Event Map click commit fix prepared. asset_version {old_version} -> {old_version + 1}')
          PY

      - name: Validate click commit fix
        shell: bash
        run: |
          set -euo pipefail
          node --check assets/event-map-v2.js
          node --check scripts/check-event-map-architecture.mjs
          node scripts/validate-event-map-regional.mjs
          node scripts/validate-event-map-quality.mjs
          node scripts/check-event-map-architecture.mjs

      - name: Commit click commit fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/event-map-v2.js scripts/check-event-map-architecture.mjs _config.yml
          git commit -m "Fix Event Map native click commit timing"
          git pull --rebase origin main
          git push origin HEAD:main
