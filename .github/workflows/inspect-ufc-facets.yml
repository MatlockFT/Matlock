name: Inspect UFC athlete facets

on:
  issues:
    types:
      - opened

permissions:
  contents: write

jobs:
  inspect:
    if: github.event.issue.title == 'Inspect UFC athlete facets'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect current UFC facet markup
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node <<'NODE'
          const fs = require('fs');
          const urls = [
            'https://www.ufc.com/athletes/all',
            'https://kr.ufc.com/athletes/all',
            'https://jp.ufc.com/athletes/all',
            'https://www.ufc.ru/athletes/all'
          ];
          const ua = 'Mozilla/5.0 (compatible; MMAMatlockFacetInspector/1.0; +https://matlockfighttalk.com/)';
          const result = {checkedAt:new Date().toISOString(), pages:[]};

          function snippets(text, regex, radius=260, limit=30){
            const out=[]; let m;
            const r=new RegExp(regex.source, regex.flags.includes('g')?regex.flags:regex.flags+'g');
            while((m=r.exec(text)) && out.length<limit){
              out.push(text.slice(Math.max(0,m.index-radius), Math.min(text.length,m.index+m[0].length+radius)).replace(/\s+/g,' '));
              if(m[0].length===0) r.lastIndex++;
            }
            return out;
          }

          for(const url of urls){
            try{
              const response=await fetch(url,{redirect:'follow',headers:{'user-agent':ua,accept:'text/html,*/*'}});
              const text=await response.text();
              const statusTokens=[...new Set([...text.matchAll(/status(?::|%3A|\\u003A|\\u00253A)(\d+)/gi)].map(m=>m[0]))];
              const filterLinks=[...new Set([...text.matchAll(/(?:href|data-drupal-facet-item-id|data-drupal-facet-item-value)=["']([^"']*(?:status|filters|facet)[^"']*)["']/gi)].map(m=>m[0]))].slice(0,100);
              const drupalSettings=snippets(text,/drupalSettings|ajaxViews|views\/ajax/gi,500,15);
              const active=snippets(text,/\bActive\b|유효한|現役|Актив/gi,500,30);
              const status=snippets(text,/status(?::|%3A|\\u003A|\\u00253A)\d+/gi,500,40);
              result.pages.push({url,http:response.status,bytes:text.length,statusTokens,filterLinks,active,status,drupalSettings});
              console.log(url, response.status, text.length, statusTokens);
            }catch(e){result.pages.push({url,error:e.message})}
          }
          fs.writeFileSync('/tmp/ufc-facet-inspection.json', JSON.stringify(result,null,2)+'\n');
          NODE

          content="$(base64 -w0 /tmp/ufc-facet-inspection.json)"
          existing="$(gh api "repos/${GITHUB_REPOSITORY}/contents/.github/ufc-facet-inspection.json" --jq '.sha' 2>/dev/null || true)"
          if [ -n "$existing" ]; then
            gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/.github/ufc-facet-inspection.json" \
              -f message="Update UFC facet inspection" -f content="$content" -f sha="$existing" -f branch=main
          else
            gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/.github/ufc-facet-inspection.json" \
              -f message="Record UFC facet inspection" -f content="$content" -f branch=main
          fi
