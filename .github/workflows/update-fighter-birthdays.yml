name: Update fighter birthdays

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/update-fighter-birthdays.yml"
      - "assets/data/fighter-birthday-seeds.json"
      - "scripts/update-fighter-birthdays.mjs"
      - "scripts/check-on-this-day.mjs"
  schedule:
    - cron: "17 9 * * *"

permissions:
  contents: write

concurrency:
  group: fighter-birthdays
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check updater syntax
        run: |
          node --check scripts/update-fighter-birthdays.mjs
          node --check scripts/check-on-this-day.mjs

      - name: Refresh fighter birthdays from Wikipedia and Wikidata
        run: npm run update:birthdays

      - name: Validate On This Day archive
        run: npm run check:history

      - name: Commit birthday changes
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- assets/data/on-this-day.json; then
            echo "No fighter birthday changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- assets/data/on-this-day.json
          git commit -m "Refresh fighter birthdays"
          git pull --rebase origin main
          git push origin HEAD:main
