name: Update fighter birthdays

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/update-fighter-birthdays.yml"
      - "assets/data/fighter-birthday-seeds.json"
      - "assets/fighter-portraits.json"
      - "scripts/update-fighter-birthdays.mjs"
      - "scripts/resolve-on-this-day-images.mjs"
      - "scripts/check-on-this-day-images.mjs"
      - "scripts/check-on-this-day.mjs"
  schedule:
    - cron: "17 9 * * *"

permissions:
  contents: write

concurrency:
  group: fighter-birthdays
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Current-window entries are sorted first, followed by all birthdays.
      # 180 covers both without wasting this focused job on deep archive events.
      OTD_IMAGE_RESOLVE_LIMIT: "180"
      OTD_CURRENT_WINDOW_DAYS: "2"
      OTD_TIME_ZONE: "America/Chicago"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check updater syntax
        run: |
          node --check scripts/update-fighter-birthdays.mjs
          node --check scripts/resolve-on-this-day-images.mjs
          node --check scripts/check-on-this-day-images.mjs
          node --check scripts/check-on-this-day.mjs

      - name: Refresh fighter birthdays from Wikipedia and Wikidata
        run: npm run update:birthdays

      - name: Resolve birthday and current-window images
        run: npm run resolve:history-images

      - name: Enforce birthday and current-window image QA
        run: npm run check:history-images

      - name: Validate On This Day archive
        run: npm run check:history

      - name: Commit birthday changes
        shell: bash
        run: |
          set -euo pipefail
          tracked_paths=(
            assets/data/on-this-day.json
            assets/data/on-this-day-image-cache.json
          )
          if [ -z "$(git status --porcelain -- "${tracked_paths[@]}")" ]; then
            echo "No fighter birthday/image changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "${tracked_paths[@]}"
          git commit -m "Refresh fighter birthdays and images"
          git pull --rebase origin main
          git push origin HEAD:main
