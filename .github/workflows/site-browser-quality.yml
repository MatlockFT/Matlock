name: Site browser quality

# Browser-facing regression and performance checks share one workflow while
# retaining separate daily schedules.
on:
  workflow_dispatch:
  schedule:
    - cron: "17 8 * * *"
    - cron: "17 10 * * *"
  push:
    branches:
      - main
    paths:
      - "*.html"
      - "_layouts/**"
      - "_includes/**"
      - "assets/*.css"
      - "assets/*.js"
      - "_config.yml"
      - "scripts/qa/site-visual-smoke.spec.cjs"
      - "scripts/qa/summarize-lighthouse.mjs"
      - ".github/workflows/site-browser-quality.yml"

permissions:
  contents: read

concurrency:
  group: site-browser-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  visual-smoke:
    if: github.event_name != 'schedule' || github.event.schedule == '17 10 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Wait for matching production assets
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          version="$(awk -F'"' '/^asset_version:/ { print $2; exit }' _config.yml)"
          for attempt in $(seq 1 60); do
            html="$(curl -fsSL --retry 2 "https://mmamatlock.com/?visual_probe=${GITHUB_RUN_ID}-${attempt}" || true)"
            if grep -Fq "?v=${version}" <<<"${html}"; then
              echo "Production is serving asset version ${version}."
              exit 0
            fi
            echo "Attempt ${attempt}/60: waiting for site v${version}."
            sleep 10
          done
          echo "Production did not reach v${version} within ten minutes."
          exit 1

      - name: Install browser test runtime
        run: |
          npm install --no-save --no-package-lock @playwright/test@1.55.0
          npx playwright install --with-deps chromium

      - name: Check desktop and mobile geometry
        env:
          SITE_BASE_URL: https://mmamatlock.com
          VISUAL_SMOKE_DIR: artifacts/site-visual-smoke
        run: npx playwright test scripts/qa/site-visual-smoke.spec.cjs --browser=chromium --reporter=line

      - name: Upload viewport screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: site-visual-smoke-${{ github.run_id }}
          path: artifacts/site-visual-smoke
          if-no-files-found: ignore
          retention-days: 7

  lighthouse-mobile:
    if: github.event_name != 'schedule' || github.event.schedule == '17 8 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configure GitHub Pages for exact-commit audit
        if: github.event_name == 'push'
        uses: actions/configure-pages@v6

      - name: Build exact commit for push audit
        if: github.event_name == 'push'
        uses: actions/jekyll-build-pages@v1

      - name: Run mobile Lighthouse audits
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p lighthouse-reports

          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            audit_base="http://127.0.0.1:4000"
            python3 -m http.server 4000 --directory _site > /tmp/lighthouse-local-server.log 2>&1 &
            server_pid=$!
            trap 'kill "${server_pid}" 2>/dev/null || true' EXIT

            for attempt in $(seq 1 30); do
              if curl -fsS "${audit_base}/" >/dev/null; then
                break
              fi
              if [ "${attempt}" -eq 30 ]; then
                cat /tmp/lighthouse-local-server.log || true
                echo "Local Jekyll site did not become available."
                exit 1
              fi
              sleep 1
            done
            echo "Auditing exact commit from ${audit_base}."
          else
            audit_base="https://mmamatlock.com"
            echo "Auditing deployed production site from ${audit_base}."
          fi

          while IFS='|' read -r slug path; do
            for sample in 1 2 3; do
              echo "Auditing ${path} (sample ${sample}/3)"
              npx --yes lighthouse@12.8.2 "${audit_base}${path}" \
                --quiet \
                --only-categories=performance \
                --form-factor=mobile \
                --screenEmulation.mobile=true \
                --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" \
                --output=json \
                --output-path="lighthouse-reports/${slug}-${sample}.json"
            done
          done <<'PAGES'
          home|/
          homepage-v2|/homepage-v2/
          news|/news/
          breakdowns|/breakdowns/
          fight-card-picker|/upcoming-events/
          event-map|/event-map/
          ufc-roster|/ufc-roster/
          on-this-day|/on-this-day/
          live|/live/
          PAGES

      - name: Enforce mobile performance gate
        run: node scripts/qa/summarize-lighthouse.mjs lighthouse-reports

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-lighthouse-${{ github.run_id }}
          path: lighthouse-reports/*.json
          retention-days: 14
