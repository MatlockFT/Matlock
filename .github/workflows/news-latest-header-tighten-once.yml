name: One-time News Latest header cleanup

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/news-latest-header-tighten-once.yml

permissions:
  contents: write

jobs:
  tighten-latest-header:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Tighten Latest panel header
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          # Remove the low-value story/source count from the Latest header.
          html_path = Path('news.html')
          html = html_path.read_text(encoding='utf-8')
          old = '''                <header class="news-latest-header">\n                    <h2 id="news-latest-title">Latest</h2>\n                    <span data-news-summary>Loading…</span>\n                </header>'''
          new = '''                <header class="news-latest-header">\n                    <h2 id="news-latest-title">Latest</h2>\n                </header>'''
          if old not in html:
              raise SystemExit('Could not find Latest header markup')
          html = html.replace(old, new, 1)
          html_path.write_text(html, encoding='utf-8')

          # Remove JavaScript that only existed to maintain that count.
          js_path = Path('assets/news-feed.js')
          js = js_path.read_text(encoding='utf-8')
          js = js.replace('    const summary = newsPage.querySelector("[data-news-summary]");\n', '', 1)
          summary_fn = '''    function updateSummary() {\n        const sourceCount = new Set(allStories.map(story => story.source).filter(Boolean)).size;\n        summary.textContent = `${allStories.length} stories · ${sourceCount} sources`;\n    }\n\n'''
          if summary_fn not in js:
              raise SystemExit('Could not find updateSummary function')
          js = js.replace(summary_fn, '', 1)
          js = js.replace('        updateSummary();\n', '', 1)
          js = js.replace('                    summary.textContent = "Feed unavailable";\n', '', 1)
          if 'data-news-summary' in js or 'updateSummary()' in js or 'summary.textContent' in js:
              raise SystemExit('Summary cleanup incomplete')
          js_path.write_text(js, encoding='utf-8')

          css_path = Path('assets/news.css')
          css = css_path.read_text(encoding='utf-8')

          old_panel = '''.news-latest-panel {\n    display: flex;\n    flex-direction: column;\n    min-height: 560px;\n    padding: clamp(1.15rem, 1.8vw, 1.4rem);\n    border: 1px solid var(--border);'''
          new_panel = '''.news-latest-panel {\n    display: flex;\n    flex-direction: column;\n    min-height: 560px;\n    padding: clamp(0.8rem, 1.2vw, 1rem) clamp(1.05rem, 1.5vw, 1.3rem) clamp(1rem, 1.5vw, 1.25rem);\n    border: 1px solid var(--border);'''
          if old_panel not in css:
              raise SystemExit('Could not find Latest panel block')
          css = css.replace(old_panel, new_panel, 1)

          old_header = '''.news-latest-header {\n    display: flex;\n    align-items: center;\n    justify-content: space-between;\n    gap: 1rem;\n    padding: 0.1rem 0 1rem;\n    border-bottom: 1px solid var(--border);\n}'''
          new_header = '''.news-latest-header {\n    display: flex;\n    align-items: center;\n    padding: 0 0 0.62rem;\n    border-bottom: 1px solid var(--border);\n}'''
          if old_header not in css:
              raise SystemExit('Could not find Latest header CSS block')
          css = css.replace(old_header, new_header, 1)

          # Remove now-unused summary styling.
          css = re.sub(r'\n\.news-latest-header span \{.*?\n\}\n', '\n', css, count=1, flags=re.S)

          old_list = '''.news-latest-list {\n    display: grid;\n    gap: 0;\n    flex: 1;\n    margin-top: 0.1rem;\n}'''
          new_list = '''.news-latest-list {\n    display: grid;\n    gap: 0;\n    flex: 1;\n    margin-top: 0;\n}'''
          if old_list not in css:
              raise SystemExit('Could not find Latest list block')
          css = css.replace(old_list, new_list, 1)

          old_row = '''    padding: 0.82rem 0;\n    border-bottom: 1px solid var(--border);'''
          new_row = '''    padding: 0.74rem 0;\n    border-bottom: 1px solid var(--border);'''
          if old_row not in css:
              raise SystemExit('Could not find Latest row padding')
          css = css.replace(old_row, new_row, 1)

          # Keep the mobile panel compact too, with enough side padding for touch readability.
          mobile_anchor = '''    .news-latest-panel {\n        min-height: 0;\n    }'''
          mobile_new = '''    .news-latest-panel {\n        min-height: 0;\n        padding: 0.85rem 1rem 1rem;\n    }'''
          if mobile_anchor not in css:
              raise SystemExit('Could not find mobile Latest panel block')
          css = css.replace(mobile_anchor, mobile_new, 1)

          css_path.write_text(css, encoding='utf-8')

          cfg_path = Path('_config.yml')
          cfg = cfg_path.read_text(encoding='utf-8')
          match = re.search(r'(?m)^asset_version: "(\d+)"$', cfg)
          if not match:
              raise SystemExit('Could not locate asset_version')
          version = int(match.group(1))
          cfg = cfg[:match.start(1)] + str(version + 1) + cfg[match.end(1):]
          cfg_path.write_text(cfg, encoding='utf-8')
          print(f'Latest panel header tightened. asset_version {version} -> {version + 1}')
          PY

      - name: Validate changes
        shell: bash
        run: |
          set -euo pipefail
          ! grep -Fq 'data-news-summary' news.html
          ! grep -Fq 'data-news-summary' assets/news-feed.js
          ! grep -Fq 'stories ·' assets/news-feed.js
          grep -Fq 'padding: 0 0 0.62rem;' assets/news.css
          grep -Fq 'padding: 0.74rem 0;' assets/news.css
          grep -Eq '^asset_version: "[0-9]+"$' _config.yml
          node --check assets/news-feed.js

      - name: Commit cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news.html assets/news-feed.js assets/news.css _config.yml
          git commit -m "Tighten News Latest panel header"
          git pull --rebase origin main
          git push origin HEAD:main
