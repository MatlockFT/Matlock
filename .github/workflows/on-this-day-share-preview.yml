name: On This Day share preview

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/on-this-day-share-preview.yml"
      - "scripts/build-on-this-day-share-images.mjs"
      - "scripts/share-title-layout.mjs"
      - "scripts/share-card-composition.mjs"
      - "assets/share-gobold.mjs"
      - "assets/textures/otd-gaffer-tape-v1.png"
      - "assets/data/on-this-day-share-sources.json"

permissions:
  contents: read

concurrency:
  group: on-this-day-share-preview
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OTD_SHARE_WINDOW_DAYS: "0"
      OTD_SHARE_MAX_PER_DAY: "12"
      OTD_SHARE_CONCURRENCY: "3"
      OTD_SHARE_OUTPUT_DIR: ".otd-share-preview"
      OTD_SHARE_MANIFEST_PATH: ".otd-share-preview-manifest.json"
      OTD_SHARE_PUBLIC_BASE: "https://example.invalid/otd-share-preview"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Check renderer syntax
        run: |
          node --check scripts/build-on-this-day-share-images.mjs
          node --check scripts/share-title-layout.mjs

      - name: Render current-day share cards
        run: npm run build:history-share

      - name: Upload rendered preview
        uses: actions/upload-artifact@v4
        with:
          name: otd-share-preview
          path: .otd-share-preview/*.jpg
          if-no-files-found: error
          retention-days: 3
          include-hidden-files: true
