name: Probe production Live player v2

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/probe-production-live-v2.yml"

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Chromium
        run: |
          npm install --no-save --no-package-lock @playwright/test@1.55.0
          npx playwright install --with-deps chromium

      - name: Probe current production player
        run: |
          node <<'NODE'
          const { chromium } = require('@playwright/test');

          (async () => {
            const browser = await chromium.launch();
            const context = await browser.newContext({ viewport: { width: 1365, height: 900 } });
            const page = await context.newPage();

            await page.addInitScript(() => {
              window.__ytMessages = [];
              window.addEventListener('message', event => {
                if (!String(event.origin || '').includes('youtube')) return;
                let payload = event.data;
                try { if (typeof payload === 'string') payload = JSON.parse(payload); } catch {}
                if (!payload || typeof payload !== 'object') return;
                const info = payload.info || {};
                const vd = info.videoData || payload.videoData || {};
                const record = {
                  event: payload.event || null,
                  id: payload.id || null,
                  playerState: info.playerState ?? payload.playerState ?? null,
                  currentTime: info.currentTime ?? null,
                  duration: info.duration ?? null,
                  videoId: vd.video_id || vd.videoId || null,
                  title: vd.title || null
                };
                if (record.event || record.videoId || record.playerState !== null) {
                  window.__ytMessages.push(record);
                  if (window.__ytMessages.length > 120) window.__ytMessages.shift();
                }
              });
            });

            page.on('console', msg => console.log('PAGE_CONSOLE', msg.type(), msg.text()));
            page.on('pageerror', err => console.log('PAGE_ERROR', err.message));

            await page.goto('https://mmamatlock.com/live/?probe2=' + Date.now(), {
              waitUntil: 'domcontentloaded',
              timeout: 45000
            });
            await page.waitForSelector('[data-live-page]', { timeout: 30000 });
            await page.waitForTimeout(7000);

            async function snapshot(label) {
              const snap = await page.evaluate(() => ({
                title: document.querySelector('[data-live-title]')?.textContent?.trim() || null,
                iframeSrc: document.querySelector('[data-live-player]')?.getAttribute('src') || null,
                fallbackVisible: (() => {
                  const el = document.querySelector('[data-live-embed-fallback]');
                  return el ? !el.hidden : null;
                })(),
                screenState: document.querySelector('[data-live-screen]')?.dataset?.state || null,
                messages: (window.__ytMessages || []).slice(-15)
              }));
              console.log(label, JSON.stringify(snap));
            }

            await snapshot('INITIAL');

            const fenRow = page.locator('[data-live-list] .live-page__row--button').filter({ hasText: 'FACE TO FACE' }).first();
            if (await fenRow.count()) {
              await fenRow.click();
              await page.waitForTimeout(6000);
              await snapshot('AFTER_SWITCH');
            } else {
              console.log('NO_FACE_TO_FACE_ROW');
            }

            const frame = page.frameLocator('iframe[data-live-player]');
            const nativePlay = frame.locator('.ytp-large-play-button, .ytp-play-button').first();
            if (await nativePlay.count()) {
              try {
                await nativePlay.click({ timeout: 5000 });
                console.log('NATIVE_PLAY_CLICKED');
              } catch (e) {
                console.log('NATIVE_PLAY_CLICK_FAILED', e.message);
              }
            }
            await page.waitForTimeout(4000);
            await snapshot('AFTER_NATIVE_PLAY');

            await page.screenshot({ path: 'live-probe-v2.png', fullPage: true });
            await browser.close();
          })().catch(err => {
            console.error(err);
            process.exit(1);
          });
          NODE

      - name: Upload screenshot
        uses: actions/upload-artifact@v4
        with:
          name: production-live-probe-v2
          path: live-probe-v2.png

      - name: Remove one-shot probe
        if: always()
        run: |
          git config user.name "MatlockFT"
          git config user.email "fighttalkmma@protonmail.com"
          git rm .github/workflows/probe-production-live-v2.yml
          git commit -m "Remove production Live probe v2" || exit 0
          git push origin HEAD:main
