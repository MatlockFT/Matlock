name: Site quality

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-check:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Check article content and image metadata
        run: npm run check:content

      - name: Check browser scripts
        run: |
          node --check assets/site.js
          node --check assets/news-feed.js
          node --check scripts/build-news-feed.mjs
          node --check scripts/check-news-data.mjs
          node --check scripts/validate-upcoming-events.mjs

      - name: Check Upcoming Events source integrity
        run: node scripts/validate-upcoming-events.mjs upcoming-events.html upcoming-events.html

      - name: Check bundled MMA news data
        run: npm run check:news

      - name: Build site
        uses: actions/jekyll-build-pages@v1

      - name: Check internal links and assets
        run: node scripts/check-site.mjs _site
