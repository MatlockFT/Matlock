name: Site quality

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-check:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Check article content and image metadata
        run: npm run check:content

      - name: Check browser and data scripts
        run: |
          node --check assets/site.js
          node --check assets/site-ticker.js
          node --check assets/article-toc.js
          node --check assets/news-feed.js
          node --check assets/news-otd-deferred.js
          node --check assets/on-this-day.js
          node --check assets/event-map-v2.js
          node --check assets/event-map-enhancements.js
          node --check assets/event-map-detail.js
          node --check assets/upcoming-events-jump.js
          node --check scripts/build-news-feed.mjs
          node --check scripts/check-news-data.mjs
          node --check scripts/check-on-this-day.mjs
          node --check scripts/update-fighter-birthdays.mjs
          node --check scripts/upcoming-events-data.mjs
          node --check scripts/update-upcoming-ufc-events.mjs
          node --check scripts/update-pfl-upcoming-events.mjs
          node --check scripts/update-rizin-upcoming-events.mjs
          node --check scripts/update-event-map-regional.mjs
          node --check scripts/update-event-map-discovery.mjs
          node --check scripts/enrich-event-map-details.mjs
          node --check scripts/preserve-event-map-discovery.mjs
          node --check scripts/validate-event-map-regional.mjs
          node --check scripts/validate-regional-picker.mjs
          node --check scripts/resolve-espn-fighter-portraits.mjs
          node --check scripts/enrich-fighter-portraits.mjs
          node --check scripts/validate-upcoming-events.mjs
          node --check scripts/publish-scheduled-posts.mjs
          node --check scripts/summarize-lighthouse.mjs

      - name: Check first-paint shell invariants
        run: |
          grep -q "assets/site-ticker.css" _layouts/default.html
          grep -q "site-live-strip-reserve" _layouts/default.html
          grep -q 'width="1600"' _layouts/default.html
          grep -q 'height="640"' _layouts/default.html
          grep -q "site-live-strip-reserve" assets/site-shell.css
          grep -q "otd-list:empty" assets/site-shell.css
          grep -q "min-height: 104px" assets/ufc-roster.css
          grep -q "/assets/breakdowns.css" breakdowns.html
          grep -q 'fetchpriority="high"' breakdowns.html
          if grep -q 'document.createElement("style")' assets/site.js; then
            echo "site.js must not inject shell CSS at runtime"
            exit 1
          fi
          if grep -q '@import.*site-ticker.css' assets/site-shell.css; then
            echo "Ticker CSS must be linked directly, not discovered through @import"
            exit 1
          fi

      - name: Check fighter birthday registry JSON
        run: node -e "JSON.parse(require('fs').readFileSync('assets/data/fighter-birthday-seeds.json','utf8'));"

      - name: Check Upcoming Events data and renderer
        run: node scripts/validate-upcoming-events.mjs

      - name: Check curated regional Fight Card Picker data
        run: node scripts/validate-regional-picker.mjs

      - name: Check regional Event Map data
        run: node scripts/validate-event-map-regional.mjs

      - name: Check bundled MMA news data
        run: npm run check:news

      - name: Check On This Day MMA history data
        run: npm run check:history

      - name: Build site
        uses: actions/jekyll-build-pages@v1

      - name: Check internal links and assets
        run: node scripts/check-site.mjs _site
