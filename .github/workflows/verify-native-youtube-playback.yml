name: Verify production native YouTube playback

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/verify-native-youtube-playback.yml"

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-save --no-package-lock @playwright/test@1.55.0
      - name: Verify production player
        run: |
          node <<'NODE'
          const { chromium } = require('@playwright/test');
          const videoState = async (frame) => frame.evaluate(() => {
            const v = document.querySelector('video');
            return {
              video: v ? {
                paused: v.paused,
                currentTime: v.currentTime,
                duration: Number.isFinite(v.duration) ? v.duration : null,
                readyState: v.readyState,
                networkState: v.networkState,
                currentSrc: v.currentSrc,
                muted: v.muted,
                error: v.error ? { code: v.error.code, message: v.error.message } : null
              } : null,
              bodyText: (document.body?.innerText || '').slice(0, 1500)
            };
          });

          (async () => {
            const browser = await chromium.launch({ channel: 'chrome' });
            const page = await browser.newPage({ viewport: { width: 1365, height: 900 } });
            page.on('console', m => console.log('PAGE_CONSOLE', m.type(), m.text()));
            await page.goto('https://mmamatlock.com/live/?native_verify=' + Date.now(), {
              waitUntil: 'domcontentloaded',
              timeout: 45000
            });
            await page.waitForTimeout(8000);

            const outer = await page.evaluate(() => ({
              title: document.querySelector('[data-live-title]')?.textContent?.trim() || null,
              src: document.querySelector('[data-live-player]')?.getAttribute('src') || null,
              customPlayCount: document.querySelectorAll('[data-media-play]').length,
              customMuteCount: document.querySelectorAll('[data-media-mute]').length,
              liveJs: [...document.scripts].map(s => s.src).find(src => src.includes('/assets/live.js')) || null
            }));
            console.log('OUTER', JSON.stringify(outer));

            const yt = page.frames().find(f => f.url().includes('youtube.com/embed'));
            if (!yt) throw new Error('No YouTube iframe');

            const before = await videoState(yt);
            console.log('INNER_BEFORE_NATIVE_CLICK', JSON.stringify(before));

            if (!before.video?.currentSrc || before.video.paused) {
              const nativePlay = yt.locator('button[aria-label="Play video"]').first();
              if (await nativePlay.count()) {
                await nativePlay.click();
                await page.waitForTimeout(5000);
              }
            }

            const after = await videoState(yt);
            console.log('INNER_AFTER_NATIVE_CLICK', JSON.stringify(after));

            if (!after.video?.currentSrc || after.video.readyState < 1) {
              throw new Error('YouTube native player never acquired media');
            }

            await browser.close();
          })().catch(e => { console.error(e); process.exit(1); });
          NODE
      - name: Remove verifier
        if: always()
        run: |
          git config user.name "MatlockFT"
          git config user.email "fighttalkmma@protonmail.com"
          git rm .github/workflows/verify-native-youtube-playback.yml
          git commit -m "Remove native YouTube playback verifier" || exit 0
          git push origin HEAD:main
