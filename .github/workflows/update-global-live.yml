name: Update global MMA live status

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/update-global-live.yml"
      - "scripts/site-data/live/update-global-live.py"
      - "assets/data/live-promotions.json"
      - "live.html"
      - "assets/live.js"
  schedule:
    - cron: "4-59/5 * * * *"

permissions:
  contents: write

concurrency:
  group: global-mma-live-status
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out site
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check promotion registry
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python scripts/site-data/live/update-global-live.py

      - name: Publish live-state change
        shell: bash
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          git config user.name "mma-matlock-bot"
          git config user.email "actions@users.noreply.github.com"

          for attempt in 1 2 3; do
            if git diff --quiet -- assets/data/global-live.json; then
              echo "No global live-state change."
              exit 0
            fi

            git add assets/data/global-live.json
            git commit -m "Update global MMA live status"

            if git push origin HEAD:main; then
              exit 0
            fi

            echo "Main changed during live-state publish; regenerating against latest main (attempt ${attempt}/3)."
            git fetch origin main
            git reset --hard origin/main
            python scripts/site-data/live/update-global-live.py
            sleep 2
          done

          echo "Could not publish refreshed live state after 3 attempts."
          exit 1
