name: Update Inka live status

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/update-inka-live.yml"
      - "scripts/update-inka-live.py"
      - "live-lab.html"
      - "assets/live-lab.js"
  schedule:
    - cron: "4-59/5 * * * *"

permissions:
  contents: write

concurrency:
  group: inka-live-status
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 4

    steps:
      - name: Check out site
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install YouTube detector
        run: python -m pip install --disable-pip-version-check --quiet yt-dlp

      - name: Check Inka YouTube
        run: python scripts/update-inka-live.py

      - name: Publish state change
        shell: bash
        run: |
          if git diff --quiet -- assets/data/inka-live.json; then
            echo "No Inka live-state change."
            exit 0
          fi

          git config user.name "mma-matlock-bot"
          git config user.email "actions@users.noreply.github.com"
          git add assets/data/inka-live.json
          git commit -m "Update Inka live status"
          git pull --rebase origin main
          git push origin HEAD:main
