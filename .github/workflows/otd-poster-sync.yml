name: Sync verified On This Day posters

on:
  workflow_dispatch:
    inputs:
      limit:
        description: Maximum unresolved events to inspect
        required: false
        default: "24"
      refresh:
        description: Re-check verified records and allow reviewed hash changes
        required: false
        type: boolean
        default: false
  schedule:
    - cron: "17 11 * * *"

permissions:
  contents: write

concurrency:
  group: on-this-day-history
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OTD_TAPOLOGY_POSTER_LIMIT: ${{ inputs.limit || '24' }}
      OTD_POSTER_REFRESH: ${{ inputs.refresh && '1' || '0' }}
      OTD_CURRENT_WINDOW_DAYS: "2"
      OTD_TIME_ZONE: "America/Chicago"
      OTD_POSTER_PUBLIC_BASE: "https://raw.githubusercontent.com/MatlockFT/Matlock/otd-poster-cache"
      OTD_SHARE_WINDOW_DAYS: "2"
      OTD_SHARE_MAX_PER_DAY: "12"
      OTD_SHARE_CONCURRENCY: "3"
      OTD_SHARE_OUTPUT_DIR: ".otd-share-cache"
      OTD_SHARE_MANIFEST_PATH: "assets/data/on-this-day-share-manifest.json"
      OTD_SHARE_PUBLIC_BASE: "https://raw.githubusercontent.com/MatlockFT/Matlock/otd-share-cache"

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Prepare immutable poster cache checkout
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cache_dir="$RUNNER_TEMP/otd-poster-cache"
          if git ls-remote --exit-code --heads origin otd-poster-cache >/dev/null 2>&1; then
            git clone --depth 1 --branch otd-poster-cache "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$cache_dir"
          else
            mkdir -p "$cache_dir"
            git -C "$cache_dir" init
            git -C "$cache_dir" checkout -b otd-poster-cache
            git -C "$cache_dir" remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          fi
          echo "OTD_POSTER_OUTPUT_DIR=$cache_dir" >> "$GITHUB_ENV"

      - name: Resolve and byte-verify exact event posters
        run: npm run resolve:history-posters

      - name: Validate poster identity registry
        run: npm run check:poster-registry

      - name: Publish immutable poster bytes
        shell: bash
        run: |
          set -euo pipefail
          git -C "$OTD_POSTER_OUTPUT_DIR" config user.name "github-actions[bot]"
          git -C "$OTD_POSTER_OUTPUT_DIR" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$OTD_POSTER_OUTPUT_DIR" add --all
          if git -C "$OTD_POSTER_OUTPUT_DIR" diff --cached --quiet; then
            echo "No new poster bytes."
          else
            git -C "$OTD_POSTER_OUTPUT_DIR" commit -m "Cache verified On This Day posters"
            git -C "$OTD_POSTER_OUTPUT_DIR" push origin HEAD:otd-poster-cache
          fi

      - name: Build browser history and social images
        run: |
          npm run build:history-runtime
          npm run build:history-share
          npm run check:history-share

      - name: Publish rolling social-image cache
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cache_repo="$(mktemp -d)"
          cp -R .otd-share-cache/. "$cache_repo/"
          git -C "$cache_repo" init
          git -C "$cache_repo" checkout -b otd-share-cache
          git -C "$cache_repo" config user.name "github-actions[bot]"
          git -C "$cache_repo" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$cache_repo" add .
          git -C "$cache_repo" commit -m "Refresh On This Day share cache"
          git -C "$cache_repo" remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git -C "$cache_repo" push --force origin HEAD:refs/heads/otd-share-cache

      - name: Report unresolved poster coverage
        id: image_qa
        continue-on-error: true
        run: npm run check:history-images

      - name: Validate history data
        run: npm run check:history

      - name: Note unresolved poster coverage
        if: steps.image_qa.outcome == 'failure'
        run: echo "::warning::Some current-window event posters still need exact verification. Unverified images remain withheld."

      - name: Commit verified registry and generated data
        shell: bash
        run: |
          set -euo pipefail
          tracked_paths=(
            assets/data/on-this-day.json
            assets/data/on-this-day-image-cache.json
            assets/data/on-this-day-poster-registry.json
            assets/data/on-this-day-runtime
            assets/data/on-this-day-share-manifest.json
          )
          if [ -z "$(git status --porcelain -- "${tracked_paths[@]}")" ]; then
            echo "No verified poster changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "${tracked_paths[@]}"
          git commit -m "Refresh verified On This Day posters"
          git pull --rebase origin main
          git push origin HEAD:main
