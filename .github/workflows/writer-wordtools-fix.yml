name: Writer word tools polish

on:
  push:
    branches:
      - writer-wordtools
    paths:
      - .github/workflows/writer-wordtools-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: writer-wordtools
      - name: Apply final word tools fixes
        run: python scripts/writer-wordtools-fix.py
      - name: Validate JavaScript syntax
        run: |
          node --check assets/writer-wordtools.js
          node --check scripts/writer-wordtools-smoke.spec.cjs
      - name: Commit polish
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/writer-wordtools.js scripts/writer-wordtools-smoke.spec.cjs
          git diff --cached --check
          git commit -m "Polish Writer word processor tools"
          git push origin HEAD:writer-wordtools
