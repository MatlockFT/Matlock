name: Writer HTML block once

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/writer-html-block-once.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
      - name: Add compact HTML visual blocks
        run: |
          python - <<'PY'
          from pathlib import Path

          # ---------- write.html ----------
          path = Path('write.html')
          text = path.read_text()

          old = '''            <button type="button" data-tool="prediction" title="Fight prediction">Pick</button>\n            <button type="button" data-tool="template" title="Article template">Template</button>'''
          new = '''            <button type="button" data-tool="prediction" title="Fight prediction">Pick</button>\n            <button type="button" data-tool="html" title="Insert or edit a self-contained HTML visual">HTML</button>\n            <button type="button" data-tool="template" title="Article template">Template</button>'''
          if old not in text:
              raise SystemExit('toolbar insertion point not found')
          text = text.replace(old, new, 1)

          text = text.replace('Try /table, /tale, /pick, /youtube, /image, /source or /template', 'Try /table, /tale, /pick, /youtube, /image, /html, /source or /template', 1)

          marker = '''  <dialog class="writer-dialog writer-dialog-wide" data-template-dialog>'''
          dialog = '''  <dialog class="writer-dialog writer-dialog-wide writer-html-dialog" data-html-dialog>\n    <form method="dialog">\n      <header><div><p class="eyebrow">Visual block</p><h2 data-html-dialog-title>Insert HTML visual</h2></div><button class="writer-dialog-close" value="cancel" aria-label="Close">×</button></header>\n      <div class="writer-dialog-body writer-dialog-grid">\n        <label class="writer-field writer-field-wide"><span>Visual name <small>shown only inside Writer</small></span><input type="text" data-html-label placeholder="KI MMA World Grand Prix"></label>\n        <label class="writer-field writer-field-wide"><span>HTML + CSS</span><textarea class="writer-html-code" rows="16" data-html-code spellcheck="false" placeholder='<section class="my-visual">&#10;  <style>...</style>&#10;  ...&#10;</section>'></textarea></label>\n        <p class="writer-dialog-note writer-field-wide">Use one self-contained &lt;section&gt; block. Writer keeps the full code here while the article editor shows only one compact placeholder line. Preview and publish use the full HTML.</p>\n      </div>\n      <footer class="writer-dialog-actions writer-dialog-actions-spread">\n        <button class="writer-button writer-button-danger" type="button" data-html-delete hidden>Remove visual</button>\n        <div><button class="writer-button writer-button-subtle" value="cancel">Cancel</button><button class="writer-button writer-button-primary" type="button" data-html-insert>Insert visual</button></div>\n      </footer>\n    </form>\n  </dialog>\n\n'''
          if marker not in text:
              raise SystemExit('HTML dialog insertion point not found')
          text = text.replace(marker, dialog + marker, 1)
          path.write_text(text)

          # ---------- writer.js ----------
          path = Path('assets/writer.js')
          text = path.read_text()

          old = '''  let saveInFlight = false;\n  let previewTimer = 0;\n  let librarySearchTimer = 0;'''
          new = '''  let saveInFlight = false;\n  let previewTimer = 0;\n  let librarySearchTimer = 0;\n  let htmlBlocks = new Map();\n  let editingHtmlBlockId = '';'''
          if old not in text:
              raise SystemExit('writer state insertion point not found')
          text = text.replace(old, new, 1)

          old = '''  function fullMarkdown(publishedValue = currentPublished, options = {}) {\n    return `---\\n${buildFrontmatter(publishedValue, options)}\\n---\\n\\n${bodyEditor.value.replace(/^\\s+/, '')}`;\n  }'''
          new = '''  function fullMarkdown(publishedValue = currentPublished, options = {}) {\n    return `---\\n${buildFrontmatter(publishedValue, options)}\\n---\\n\\n${expandHtmlBlocks(bodyEditor.value).replace(/^\\s+/, '')}`;\n  }'''
          if old not in text:
              raise SystemExit('fullMarkdown block not found')
          text = text.replace(old, new, 1)

          marker = '''  function inlineMarkdown(text) {'''
          helpers = r'''  function htmlBlockId() {
    if (window.crypto?.randomUUID) return window.crypto.randomUUID().replace(/-/g, '').slice(0, 8);
    return Math.random().toString(36).slice(2, 10);
  }

  function cleanHtmlLabel(value) {
    return String(value || 'HTML visual').replace(/[\]\r\n]+/g, ' ').replace(/\s+/g, ' ').trim().slice(0, 80) || 'HTML visual';
  }

  function inferHtmlLabel(code) {
    const heading = String(code || '').match(/<h[1-6][^>]*>([\s\S]*?)<\/h[1-6]>/i);
    if (heading) {
      const label = heading[1].replace(/<[^>]+>/g, ' ').replace(/&nbsp;/gi, ' ').replace(/\s+/g, ' ').trim();
      if (label) return cleanHtmlLabel(label);
    }
    const sectionClass = String(code || '').match(/<section\b[^>]*class=["']([^"']+)["']/i);
    if (sectionClass) return cleanHtmlLabel(sectionClass[1].split(/\s+/).join(' '));
    return 'HTML visual';
  }

  function htmlBlockToken(block) {
    return `[HTML VISUAL · ${cleanHtmlLabel(block.label)} · #${block.id}]`;
  }

  function htmlTokenMatch(line) {
    return String(line || '').trim().match(/^\[HTML VISUAL · .*? · #([A-Za-z0-9_-]+)\]$/);
  }

  function expandHtmlBlocks(text) {
    return String(text || '').replace(/^\[HTML VISUAL · .*? · #([A-Za-z0-9_-]+)\]\s*$/gm, (token, id) => htmlBlocks.get(id)?.code || token);
  }

  function collapseRawHtmlSections(text) {
    return String(text || '').replace(/<section\b[\s\S]*?<\/section>/gi, code => {
      const id = htmlBlockId();
      const block = { id, label: inferHtmlLabel(code), code: code.trim() };
      htmlBlocks.set(id, block);
      return htmlBlockToken(block);
    });
  }

  function prepareEditorBody(body, savedBlocks = []) {
    htmlBlocks = new Map();
    for (const item of Array.isArray(savedBlocks) ? savedBlocks : []) {
      if (!item?.id || !item?.code) continue;
      htmlBlocks.set(String(item.id), { id: String(item.id), label: cleanHtmlLabel(item.label), code: String(item.code) });
    }
    const source = String(body || '');
    if (htmlBlocks.size) return source;
    return collapseRawHtmlSections(source);
  }

  function htmlBlockAtCursor() {
    const value = bodyEditor.value;
    const cursor = bodyEditor.selectionStart;
    const start = value.lastIndexOf('\n', Math.max(0, cursor - 1)) + 1;
    const next = value.indexOf('\n', cursor);
    const end = next === -1 ? value.length : next;
    const line = value.slice(start, end);
    const match = htmlTokenMatch(line);
    if (!match) return null;
    const block = htmlBlocks.get(match[1]);
    return block ? { block, start, end } : null;
  }

  function replaceHtmlToken(id, replacement) {
    const escaped = String(id).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    const re = new RegExp(`^\\[HTML VISUAL · .*? · #${escaped}\\]\\s*$`, 'm');
    bodyEditor.value = bodyEditor.value.replace(re, replacement);
  }

  function openHtmlDialog() {
    const dialog = app.querySelector('[data-html-dialog]');
    const current = htmlBlockAtCursor();
    editingHtmlBlockId = current?.block?.id || '';
    dialog.querySelector('[data-html-dialog-title]').textContent = current ? 'Edit HTML visual' : 'Insert HTML visual';
    dialog.querySelector('[data-html-label]').value = current?.block?.label || '';
    dialog.querySelector('[data-html-code]').value = current?.block?.code || '';
    dialog.querySelector('[data-html-insert]').textContent = current ? 'Save changes' : 'Insert visual';
    dialog.querySelector('[data-html-delete]').hidden = !current;
    dialog.showModal();
    window.setTimeout(() => dialog.querySelector('[data-html-code]').focus(), 0);
  }

'''
          if marker not in text:
              raise SystemExit('helper insertion point not found')
          text = text.replace(marker, helpers + marker, 1)

          old = '''      body: bodyEditor.value,\n      currentPath,'''
          new = '''      body: bodyEditor.value,\n      htmlBlocks: [...htmlBlocks.values()].map(block => ({ ...block })),\n      currentPath,'''
          if old not in text:
              raise SystemExit('getState body block not found')
          text = text.replace(old, new, 1)

          old = '''    bodyEditor.value = state.body || '';\n    if (remote) {'''
          new = '''    bodyEditor.value = prepareEditorBody(state.body || '', state.htmlBlocks || []);\n    if (remote) {'''
          if old not in text:
              raise SystemExit('applyState body block not found')
          text = text.replace(old, new, 1)

          old = '''    const words = countWords(bodyEditor.value);'''
          new = '''    const expandedBody = expandHtmlBlocks(bodyEditor.value);\n    const words = countWords(expandedBody);'''
          if old not in text:
              raise SystemExit('word-count block not found')
          text = text.replace(old, new, 1)

          old = '''    previewContent.innerHTML = renderMarkdown(bodyEditor.value) || '<p class="writer-preview-empty">Start writing on the left. Your article will appear here immediately.</p>';'''
          new = '''    previewContent.innerHTML = renderMarkdown(expandedBody) || '<p class="writer-preview-empty">Start writing on the left. Your article will appear here immediately.</p>';'''
          if old not in text:
              raise SystemExit('preview render block not found')
          text = text.replace(old, new, 1)

          old = '''    const map = {\n      image: '[data-image-dialog]', youtube: '[data-youtube-dialog]', table: '[data-table-dialog]',\n      tale: '[data-tale-dialog]', prediction: '[data-pick-dialog]', template: '[data-template-dialog]'\n    };'''
          new = '''    if (type === 'html') {\n      openHtmlDialog();\n      return;\n    }\n    const map = {\n      image: '[data-image-dialog]', youtube: '[data-youtube-dialog]', table: '[data-table-dialog]',\n      tale: '[data-tale-dialog]', prediction: '[data-pick-dialog]', template: '[data-template-dialog]'\n    };'''
          if old not in text:
              raise SystemExit('openTool map not found')
          text = text.replace(old, new, 1)

          old = '''    if (!/^\\/(table|tale|pick|youtube|image|source|template|divider)$/.test(line)) return '';'''
          new = '''    if (!/^\\/(table|tale|pick|youtube|image|html|source|template|divider)$/.test(line)) return '';'''
          if old not in text:
              raise SystemExit('slash command matcher not found')
          text = text.replace(old, new, 1)

          marker = '''  app.querySelector('[data-table-insert]').addEventListener('click', () => {'''
          handlers = r'''  app.querySelector('[data-html-insert]').addEventListener('click', () => {
    const dialog = app.querySelector('[data-html-dialog]');
    const code = dialog.querySelector('[data-html-code]').value.trim();
    if (!code) { showToast('Paste the HTML for the visual first.'); return; }
    if (/<script\b/i.test(code)) { showToast('Script tags are not supported in article HTML visuals.', 5000); return; }
    if (!/^<section\b[\s\S]*<\/section>\s*$/i.test(code)) { showToast('Wrap the visual in one self-contained <section>...</section> block.', 5500); return; }
    const label = cleanHtmlLabel(dialog.querySelector('[data-html-label]').value || inferHtmlLabel(code));

    if (editingHtmlBlockId && htmlBlocks.has(editingHtmlBlockId)) {
      const block = htmlBlocks.get(editingHtmlBlockId);
      block.label = label;
      block.code = code;
      replaceHtmlToken(editingHtmlBlockId, htmlBlockToken(block));
      showToast('HTML visual updated.');
    } else {
      const id = htmlBlockId();
      const block = { id, label, code };
      htmlBlocks.set(id, block);
      insertBlock(htmlBlockToken(block));
      showToast('HTML visual inserted as a compact block.');
    }

    editingHtmlBlockId = '';
    dialog.close();
    scheduleAutosave();
    updatePreview();
  });

  app.querySelector('[data-html-delete]').addEventListener('click', () => {
    if (!editingHtmlBlockId || !htmlBlocks.has(editingHtmlBlockId)) return;
    replaceHtmlToken(editingHtmlBlockId, '');
    htmlBlocks.delete(editingHtmlBlockId);
    editingHtmlBlockId = '';
    app.querySelector('[data-html-dialog]').close();
    scheduleAutosave();
    updatePreview();
    showToast('HTML visual removed.');
  });

'''
          if marker not in text:
              raise SystemExit('HTML handler insertion point not found')
          text = text.replace(marker, handlers + marker, 1)

          marker = '''  bodyEditor.addEventListener('keydown', event => {'''
          body_events = r'''  bodyEditor.addEventListener('paste', event => {
    const pasted = event.clipboardData?.getData('text/plain')?.trim() || '';
    if (!/^<section\b[\s\S]*<\/section>\s*$/i.test(pasted)) return;
    if (/<script\b/i.test(pasted)) { event.preventDefault(); showToast('Script tags are not supported in article HTML visuals.', 5000); return; }
    event.preventDefault();
    const id = htmlBlockId();
    const block = { id, label: inferHtmlLabel(pasted), code: pasted };
    htmlBlocks.set(id, block);
    insertBlock(htmlBlockToken(block));
    showToast('HTML visual collapsed into one Writer block. Double-click it to edit.');
  });

  bodyEditor.addEventListener('dblclick', () => {
    if (htmlBlockAtCursor()) openHtmlDialog();
  });

'''
          if marker not in text:
              raise SystemExit('body editor event insertion point not found')
          text = text.replace(marker, body_events + marker, 1)

          path.write_text(text)

          # ---------- writer.css ----------
          path = Path('assets/writer.css')
          text = path.read_text()
          addition = r'''

/* Compact raw HTML visual editor */
.writer-html-dialog{width:min(860px,calc(100% - 2rem))}
.writer-html-code{
  min-height:330px!important;
  max-height:52vh!important;
  resize:vertical!important;
  font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono",monospace!important;
  font-size:.76rem!important;
  line-height:1.5!important;
  tab-size:2;
  white-space:pre;
}
.writer-html-dialog .writer-dialog-note{margin:.1rem 0 0;color:#777;line-height:1.5}
@media(max-width:700px){.writer-html-code{min-height:260px!important;max-height:46vh!important}}
'''
          if '/* Compact raw HTML visual editor */' not in text:
              text += addition
          path.write_text(text)
          PY

          node --check assets/writer.js
          grep -q 'data-tool="html"' write.html
          grep -q 'data-html-dialog' write.html
          grep -q 'htmlBlocks = new Map' assets/writer.js
          grep -q 'expandHtmlBlocks(bodyEditor.value)' assets/writer.js
          grep -q 'writer-html-code' assets/writer.css
      - name: Commit Writer HTML block editor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add write.html assets/writer.js assets/writer.css
          git commit -m "Add compact HTML visual editor to Writer"
          git push origin HEAD:main
