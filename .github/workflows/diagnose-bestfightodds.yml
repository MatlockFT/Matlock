name: Diagnose BestFightOdds HTML

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/diagnose-bestfightodds.yml"

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch BestFightOdds
        run: |
          node - <<'NODE'
          const response = await fetch('https://www.bestfightodds.com/', {
            headers: {
              'user-agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/154.0.0.0 Safari/537.36',
              'accept':'text/html,application/xhtml+xml',
              'accept-language':'en-US,en;q=0.8'
            }
          });
          const html = await response.text();
          console.log('status', response.status, 'length', html.length);
          for (const needle of ['Anthony Wint','Natalia Silva','Court McGee']) {
            const i = html.indexOf(needle);
            console.log('\n===', needle, 'index', i, '===');
            console.log(i >= 0 ? html.slice(Math.max(0,i-1800), i+2600) : 'NOT FOUND');
          }
          NODE
