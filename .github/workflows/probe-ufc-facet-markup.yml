name: Verify UFC status 23 collection

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Verify status 23 against UFC profile statuses
        run: |
          node <<'NODE'
          const ORIGIN='https://www.ufc.com';
          const AJAX=`${ORIGIN}/views/ajax?_wrapper_format=drupal_ajax&filters%5B0%5D=status%3A23`;
          const UA='Mozilla/5.0 (compatible; MMAMatlockRosterProbe/5.0; +https://matlockfighttalk.com/)';

          async function request(url,options={}){
            const r=await fetch(url,{redirect:'follow',...options,headers:{'user-agent':UA,accept:'text/html,application/json;q=0.9,*/*;q=0.8',...(options.headers||{})}});
            if(!r.ok) throw new Error(`${r.status} ${url}`);
            return r.text();
          }

          function extractSlugs(text){
            const normalized=text.replaceAll('\\/','/').replaceAll('\\u002F','/');
            const out=new Set();
            for(const m of normalized.matchAll(/\/athlete\/([a-z0-9][a-z0-9-]*)/gi)) out.add(m[1].toLowerCase());
            return [...out];
          }

          async function page(n){
            const body=new URLSearchParams({
              view_name:'all_athletes',view_display_id:'page',view_args:'',view_path:'/athletes/all',
              view_base_path:'',pager_element:'0',gender:'All',page:String(n),_drupal_ajax:'1',
              'ajax_page_state[theme]':'ufc','ajax_page_state[theme_token]':''
            });
            const text=await request(AJAX,{method:'POST',headers:{'content-type':'application/x-www-form-urlencoded; charset=UTF-8','x-requested-with':'XMLHttpRequest',referer:`${ORIGIN}/athletes/all`},body});
            const slugs=extractSlugs(text);
            const countMatches=[...text.replace(/<[^>]+>/g,' ').matchAll(/(\d{2,5})\s+Athletes/gi)].map(m=>Number(m[1]));
            return {n,slugs,text,count:countMatches[0]||null};
          }

          const first=await page(0);
          console.log(`FIRST pageSlugs=${first.slugs.length} countHint=${first.count} bytes=${first.text.length}`);
          console.log('FIRST_SLUGS',JSON.stringify(first.slugs.slice(0,20)));
          if(!first.slugs.length) console.log('FIRST_RESPONSE_SNIP',first.text.slice(0,12000));

          const all=new Set(first.slugs);
          let emptyRun=0;
          for(let start=1;start<120 && emptyRun<3;start+=8){
            const batch=await Promise.all(Array.from({length:8},(_,i)=>start+i).filter(n=>n<120).map(page));
            for(const p of batch){
              console.log(`PAGE ${p.n} slugs=${p.slugs.length}`);
              p.slugs.forEach(s=>all.add(s));
              emptyRun=p.slugs.length?0:emptyRun+1;
            }
          }
          const slugs=[...all];
          console.log(`UNIQUE_STATUS23=${slugs.length}`);
          for(const slug of ['islam-makhachev','cameron-nelson','holly-holm','conor-mcgregor','jon-jones']){
            console.log(`MEMBER ${slug}=${all.has(slug)}`);
          }

          function strip(html){return html.replace(/<script[\s\S]*?<\/script>/gi,' ').replace(/<style[\s\S]*?<\/style>/gi,' ').replace(/<[^>]+>/g,' ').replace(/&nbsp;/g,' ').replace(/&amp;/g,'&').replace(/\s+/g,' ').trim();}
          function visibleStatus(html){
            const text=strip(html);
            const m=text.match(/\bStatus\s+(Active|Not Fighting|Inactive|Retired)\b/i);
            return m?m[1]:'';
          }

          const sampleIndexes=[0,Math.floor(slugs.length*.1),Math.floor(slugs.length*.25),Math.floor(slugs.length*.4),Math.floor(slugs.length*.55),Math.floor(slugs.length*.7),Math.floor(slugs.length*.85),slugs.length-1];
          const sample=[...new Set(sampleIndexes.map(i=>slugs[i]).filter(Boolean)), 'islam-makhachev','cameron-nelson'].filter((v,i,a)=>a.indexOf(v)===i && all.has(v));
          for(const slug of sample){
            try{
              const html=await request(`${ORIGIN}/athlete/${slug}`);
              console.log(`PROFILE_STATUS ${slug}=${visibleStatus(html)||'UNKNOWN'}`);
            }catch(e){console.log(`PROFILE_STATUS ${slug}=ERROR ${e.message}`);}
          }
          for(const slug of ['holly-holm']){
            const html=await request(`${ORIGIN}/athlete/${slug}`);
            console.log(`CONTROL_STATUS ${slug}=${visibleStatus(html)||'UNKNOWN'} member=${all.has(slug)}`);
          }
          NODE
