name: Probe UFC Drupal settings

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Inspect UFC Drupal settings
        run: |
          node <<'NODE'
          const PAGE='https://www.ufc.com/athletes/all';
          const r=await fetch(PAGE,{headers:{'user-agent':'Mozilla/5.0 (compatible; MMAMatlockRosterProbe/4.2; +https://matlockfighttalk.com/)'}});
          const html=await r.text();
          const m=html.match(/<script[^>]*data-drupal-selector=["']drupal-settings-json["'][^>]*>([\s\S]*?)<\/script>/i);
          if(!m){console.log('NO_DRUPAL_SETTINGS');process.exit(0);}
          const settings=JSON.parse(m[1]);
          console.log('TOP_KEYS',Object.keys(settings));

          function walk(value,path=[]){
            if(value===null||value===undefined)return;
            if(Array.isArray(value)){
              value.forEach((v,i)=>walk(v,[...path,String(i)]));
              return;
            }
            if(typeof value==='object'){
              for(const [k,v] of Object.entries(value)){
                const p=[...path,k];
                if(/facet|view|ajax|filter|athlete|search/i.test(k)||/facet|view|ajax|filter|athlete|search/i.test(String(v))){
                  let out;
                  try{out=JSON.stringify(v);}catch{out=String(v);}
                  if(out.length>5000)out=out.slice(0,5000)+'…';
                  console.log('SETTING',p.join('.'),'=',out);
                }
                walk(v,p);
              }
            }
          }
          walk(settings);
          NODE
