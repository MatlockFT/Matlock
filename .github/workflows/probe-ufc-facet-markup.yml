name: Optimize UFC active feed

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Test UFC Drupal page-size controls
        run: |
          node <<'NODE'
          const O='https://www.ufc.com';
          const UA='Mozilla/5.0 (compatible; MMAMatlockRosterProbe/5.3; +https://matlockfighttalk.com/)';
          function slugs(text){const s=text.replaceAll('\\/','/').replaceAll('\\u002F','/');return [...new Set([...s.matchAll(/\/athlete\/([a-z0-9][a-z0-9-]*)/gi)].map(m=>m[1].toLowerCase()))];}
          async function test(label,queryExtra={},bodyExtra={}){
            const q=new URLSearchParams({_wrapper_format:'drupal_ajax','filters[0]':'status:23',page:'0',...queryExtra});
            const body=new URLSearchParams({view_name:'all_athletes',view_display_id:'page',view_path:'/athletes/all',pager_element:'0',gender:'All',page:'0',...bodyExtra});
            const r=await fetch(`${O}/views/ajax?${q}`,{method:'POST',headers:{'user-agent':UA,'content-type':'application/x-www-form-urlencoded; charset=UTF-8','x-requested-with':'XMLHttpRequest',referer:`${O}/athletes/all`},body});
            const text=await r.text();
            console.log(`${label} http=${r.status} bytes=${text.length} slugs=${slugs(text).length} first=${JSON.stringify(slugs(text).slice(0,5))} last=${JSON.stringify(slugs(text).slice(-5))}`);
          }
          await test('BASE');
          for(const n of ['24','50','100','250','1000']){
            await test(`BODY_items_per_page_${n}`,{}, {items_per_page:n});
            await test(`QUERY_items_per_page_${n}`,{items_per_page:n}, {});
          }
          for(const key of ['limit','page_size','per_page']) await test(`QUERY_${key}_1000`,{[key]:'1000'},{});
          NODE
