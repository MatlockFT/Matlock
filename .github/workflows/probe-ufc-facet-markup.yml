name: Verify UFC status 23 collection

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Verify status 23 against UFC profile statuses
        run: |
          node <<'NODE'
          const ORIGIN='https://www.ufc.com';
          const AJAX=`${ORIGIN}/views/ajax?_wrapper_format=drupal_ajax&filters%5B0%5D=status%3A23`;
          const UA='Mozilla/5.0 (compatible; MMAMatlockRosterProbe/5.1; +https://matlockfighttalk.com/)';

          async function request(url,options={}){
            const r=await fetch(url,{redirect:'follow',...options,headers:{'user-agent':UA,accept:'text/html,application/json;q=0.9,*/*;q=0.8',...(options.headers||{})}});
            const text=await r.text();
            if(!r.ok) throw new Error(`${r.status} ${url}: ${text.slice(0,300)}`);
            return text;
          }

          function extractSlugs(text){
            const normalized=text.replaceAll('\\/','/').replaceAll('\\u002F','/');
            const out=new Set();
            for(const m of normalized.matchAll(/\/athlete\/([a-z0-9][a-z0-9-]*)/gi)) out.add(m[1].toLowerCase());
            return [...out];
          }

          function exposedCount(text){
            const plain=text.replace(/\\u003C/g,'<').replace(/\\u003E/g,'>').replace(/<[^>]+>/g,' ').replace(/\\n/g,' ');
            const hits=[...plain.matchAll(/\b(\d{2,5})\s+Athletes\b/gi)].map(m=>Number(m[1]));
            return hits.length?hits[0]:null;
          }

          async function page(n){
            const body=new URLSearchParams({
              view_name:'all_athletes',view_display_id:'page',view_path:'/athletes/all',
              pager_element:'0',gender:'All',page:String(n)
            });
            const text=await request(AJAX,{method:'POST',headers:{'content-type':'application/x-www-form-urlencoded; charset=UTF-8','x-requested-with':'XMLHttpRequest',referer:`${ORIGIN}/athletes/all`},body});
            return {n,slugs:extractSlugs(text),text,count:exposedCount(text)};
          }

          const first=await page(0);
          console.log(`FIRST pageSlugs=${first.slugs.length} countHint=${first.count} bytes=${first.text.length}`);
          console.log('FIRST_SLUGS',JSON.stringify(first.slugs.slice(0,20)));
          if(!first.slugs.length){
            const parsed=JSON.parse(first.text);
            console.log('COMMANDS',JSON.stringify(parsed.map((x,i)=>({i,command:x.command||'',selector:x.selector||'',dataType:typeof x.data,dataSnippet:typeof x.data==='string'?x.data.slice(0,3000):x.data})),null,2));
          }

          const all=new Set(first.slugs);
          let emptyRun=first.slugs.length?0:1;
          for(let start=1;start<120 && emptyRun<3;start+=8){
            const batch=await Promise.all(Array.from({length:8},(_,i)=>start+i).filter(n=>n<120).map(page));
            for(const p of batch){
              p.slugs.forEach(s=>all.add(s));
              emptyRun=p.slugs.length?0:emptyRun+1;
            }
          }
          const slugs=[...all];
          console.log(`UNIQUE_STATUS23=${slugs.length}`);
          for(const slug of ['islam-makhachev','cameron-nelson','holly-holm','conor-mcgregor','jon-jones']) console.log(`MEMBER ${slug}=${all.has(slug)}`);

          function decodeEntities(s){return s.replace(/&nbsp;/g,' ').replace(/&amp;/g,'&').replace(/&#039;|&#39;/g,"'").replace(/&quot;/g,'"');}
          function strip(html){return decodeEntities(html.replace(/<script[\s\S]*?<\/script>/gi,' ').replace(/<style[\s\S]*?<\/style>/gi,' ').replace(/<[^>]+>/g,' ')).replace(/\s+/g,' ').trim();}
          function visibleStatus(html){
            const text=strip(html);
            const m=text.match(/\bStatus\s+(Active|Not Fighting|Inactive|Retired)\b/i);
            return m?m[1]:'';
          }

          const sampleIndexes=[0,Math.floor(slugs.length*.12),Math.floor(slugs.length*.28),Math.floor(slugs.length*.44),Math.floor(slugs.length*.60),Math.floor(slugs.length*.76),Math.floor(slugs.length*.92),slugs.length-1];
          const sample=[...new Set([...sampleIndexes.map(i=>slugs[i]).filter(Boolean),'islam-makhachev','cameron-nelson'])].filter(s=>all.has(s));
          for(const slug of sample){
            try{
              const html=await request(`${ORIGIN}/athlete/${slug}`);
              console.log(`PROFILE_STATUS ${slug}=${visibleStatus(html)||'UNKNOWN'}`);
            }catch(e){console.log(`PROFILE_STATUS ${slug}=ERROR`);}
          }
          const holly=await request(`${ORIGIN}/athlete/holly-holm`);
          console.log(`CONTROL_STATUS holly-holm=${visibleStatus(holly)||'UNKNOWN'} member=${all.has('holly-holm')}`);
          NODE
