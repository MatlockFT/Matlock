name: Site visual geometry smoke

on:
  workflow_dispatch:
  schedule:
    - cron: "17 10 * * *"
  push:
    branches:
      - main
    paths:
      - "*.html"
      - "_layouts/**"
      - "_includes/**"
      - "assets/*.css"
      - "assets/*.js"
      - "scripts/site-visual-smoke.spec.cjs"
      - ".github/workflows/site-visual-smoke.yml"
      - "_config.yml"

permissions:
  contents: read

concurrency:
  group: site-visual-geometry-smoke
  cancel-in-progress: true

jobs:
  visual-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Wait for matching production assets
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          version="$(awk -F'"' '/^asset_version:/ { print $2; exit }' _config.yml)"
          for attempt in $(seq 1 60); do
            html="$(curl -fsSL --retry 2 "https://mmamatlock.com/?visual_probe=${GITHUB_RUN_ID}-${attempt}" || true)"
            if grep -Fq "?v=${version}" <<<"${html}"; then
              echo "Production is serving asset version ${version}."
              exit 0
            fi
            echo "Attempt ${attempt}/60: waiting for site v${version}."
            sleep 10
          done
          echo "Production did not reach v${version} within ten minutes."
          exit 1

      - name: Install browser test runtime
        run: |
          npm install --no-save --no-package-lock @playwright/test@1.55.0
          npx playwright install --with-deps chromium

      - name: Check desktop and mobile geometry
        env:
          SITE_BASE_URL: https://mmamatlock.com
          VISUAL_SMOKE_DIR: artifacts/site-visual-smoke
        run: npx playwright test scripts/site-visual-smoke.spec.cjs --browser=chromium --reporter=line

      - name: Upload viewport screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: site-visual-smoke-${{ github.run_id }}
          path: artifacts/site-visual-smoke
          if-no-files-found: ignore
          retention-days: 7
