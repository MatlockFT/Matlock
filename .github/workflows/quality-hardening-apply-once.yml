name: One-time final quality hardening apply

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/quality-hardening-apply-once.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply source hardening patches
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new, label):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'{label}: expected text not found in {path}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_once(
              'scripts/build-news-feed.mjs',
              '''                const publishedAt = itemDate(item);\n                const timestamp = Date.parse(publishedAt);\n\n                if (\n                    !title ||\n                    !url ||\n                    !Number.isFinite(timestamp) ||\n                    timestamp < cutoff\n                ) {\n                    return null;\n                }\n\n                return {''',
              '''                const sourcePublishedAt = itemDate(item);\n                const sourceTimestamp = Date.parse(sourcePublishedAt);\n\n                if (\n                    !title ||\n                    !url ||\n                    !Number.isFinite(sourceTimestamp) ||\n                    sourceTimestamp < cutoff\n                ) {\n                    return null;\n                }\n\n                // Some publisher feeds pre-date stories by hours. Treat those as current,\n                // never as future news, so relative-time UI cannot render \"in N hours\".\n                const timestamp = Math.min(sourceTimestamp, Date.now());\n                const publishedAt = new Date(timestamp).toISOString();\n\n                return {''',
              'news future timestamp clamp'
          )

          replace_once(
              'scripts/update-on-this-day-events.mjs',
              '''function conciseDetail(venue, location) {\n    if (venue && location) return clean(`Held at ${venue} in ${location}.`).slice(0, 240);\n    if (venue) return clean(`Held at ${venue}.`).slice(0, 240);\n    if (location) return clean(`Held in ${location}.`).slice(0, 240);\n    return \"\";\n}''',
              '''function cleanPlace(value) {\n    return clean(value)\n        .replace(/\\s+([,.;:!?])/g, \"$1\")\n        .replace(/,\\s*,+/g, \",\")\n        .replace(/\\.\\s*\\.+$/g, \".\")\n        .replace(/\\bU\\.S\\.\\.$/i, \"U.S.\")\n        .replace(/\\bU\\.K\\.\\.$/i, \"U.K.\")\n        .trim();\n}\n\nfunction conciseDetail(venue, location) {\n    const cleanVenue = cleanPlace(venue);\n    const cleanLocation = cleanPlace(location);\n    if (cleanVenue && cleanLocation) return clean(`Held at ${cleanVenue} in ${cleanLocation}.`).slice(0, 240);\n    if (cleanVenue) return clean(`Held at ${cleanVenue}.`).slice(0, 240);\n    if (cleanLocation) return clean(`Held in ${cleanLocation}.`).slice(0, 240);\n    return \"\";\n}''',
              'OTD place punctuation normalization'
          )
          replace_once(
              'scripts/update-on-this-day-events.mjs',
              '            title: `${eventTitle} took place`,',
              '            title: eventTitle,',
              'OTD redundant title suffix'
          )
          PY

      - name: Commit source hardening patches
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "MatlockFT"
          git config user.email "fighttalkmma@protonmail.com"
          git add scripts/build-news-feed.mjs scripts/update-on-this-day-events.mjs
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Complete news and history quality hardening"
          git pull --rebase origin main
          git push origin HEAD:main
