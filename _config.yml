title: "Matlock's Fight Talk"
tagline: "Independent MMA analysis and fight breakdowns"
description: "Independent mixed martial arts analysis, technical fight breakdowns, predictions, commentary, and opinions from Matlock's Fight Talk."

url: "https://matlockfighttalk.com"
baseurl: ""

lang: "en-US"
locale: "en_US"

logo: "/assets/logo.png"

author:
  name: "Matlock"
  url: "https://matlockfighttalk.com/"
  twitter: "mmamatlock"

twitter:
  username: "mmamatlock"
  card: "summary_large_image"

social:
  name: "Matlock's Fight Talk"
  links:
    - "https://youtube.com/@mmamatlock"
    - "https://www.instagram.com/mmamatlock/"
    - "https://x.com/mmamatlock"
    - "https://matlockfighttalk-shop.fourthwall.com/"

nav:
  - name: "Home"
    link: "/"

  - name: "The Matlock Papers"
    link: "/matlockpapers"

  - name: "MMA Yellow Pages"
    link: "/mma-yellowpages"

  - name: "Vegas Slots"
    link: "/vegas"

  - name: "Guestbook"
    link: "/guestbook"

  - name: "Picture Gallery"
    link: "/picture-gallery"

defaults:
  - scope:
      path: ""
    values:
      image:
        path: "/assets/social-card.jpg"
        width: 1200
        height: 630
        alt: "Matlock's Fight Talk — MMA analysis and fight breakdowns"

  - scope:
      path: ""
      type: posts
    values:
      layout: post
      seo:
        type: BlogPosting

permalink: /:year/:month/:day/:title.html

future: false
show_excerpts: true

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

feed:
  path: feed.xml

markdown: kramdown

kramdown:
  input: GFM
  hard_wrap: false

exclude:
  - README.md
  - SECURITY.md
  - LICENSE
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
