title: "MMA Matlock"
legal_name: "MATLOCKSFIGHTTALK"

tagline: "Independent MMA breakdowns and analysis"

description: >-
  Independent UFC and mixed martial arts breakdowns, technical analysis,
  predictions, commentary, and opinions from MMA Matlock.

url: "https://matlockfighttalk.com"
baseurl: ""

lang: "en-US"
locale: "en_US"

logo: "/assets/logo.png"

author:
  name: "MMA Matlock"
  url: "https://matlockfighttalk.com/"
  twitter: "mmamatlock"

twitter:
  username: "mmamatlock"
  card: "summary_large_image"

social:
  name: "MMA Matlock"
  links:
    - "https://youtube.com/@mmamatlock"
    - "https://www.instagram.com/mmamatlock/"
    - "https://x.com/mmamatlock"
    - "https://matlockfighttalk-shop.fourthwall.com/"

nav:
  - name: "Home"
    link: "/"

  - name: "Breakdowns"
    link: "/breakdowns/"

  - name: "MMA Yellow Pages"
    link: "/mma-yellowpages"

  - name: "Vegas Slots"
    link: "/vegas"

  - name: "Guestbook"
    link: "/guestbook"

  - name: "Picture Gallery"
    link: "/picture-gallery"

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      author: "MMA Matlock"
      seo:
        type: BlogPosting

permalink: /:year/:month/:day/:title.html

future: false
show_excerpts: true

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-redirect-from

feed:
  path: feed.xml

markdown: kramdown

kramdown:
  input: GFM
  hard_wrap: false

exclude:
  - README.md
  - SECURITY.md
  - LICENSE
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
