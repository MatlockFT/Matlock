    link: "/privacy/"



defaults:
  # Limit automatically generated description fallbacks.
  # Explicit page and post descriptions still take priority.
  - scope:
      path: ""
    values:
      seo_description_max_words: 35

  # Default settings for every post.
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      seo:
        type: "BlogPosting"

permalink: /:year/:month/:day/:title.html

future: false
show_excerpts: true

plugins:
  - jekyll-feed
  - jekyll-redirect-from
  - jekyll-seo-tag
  - jekyll-sitemap

feed:
  path: "feed.xml"

markdown: kramdown

kramdown:
  input: GFM
  hard_wrap: false

exclude:
  - README.md
  - SECURITY.md
  - LICENSE
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
