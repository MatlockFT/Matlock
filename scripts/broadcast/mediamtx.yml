# Local-only ingest/origin for the MMA Matlock direct-stream test.
# OBS publishes to: rtmp://127.0.0.1:1935/matlock
# Local HLS test:    http://127.0.0.1:8888/matlock/index.m3u8
# Public HLS is exposed through Caddy at live.mmamatlock.com.

logLevel: info

rtmpAddress: 127.0.0.1:1935

hlsAddress: 127.0.0.1:8888
hlsAllowOrigins:
  - "https://mmamatlock.com"
hlsAlwaysRemux: true
hlsVariant: fmp4

paths:
  matlock:
    source: publisher
