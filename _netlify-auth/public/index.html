<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>MMA Matlock Writer Auth</title>
  <style>html{color-scheme:dark;background:#080808;color:#f3f3f3;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{min-height:100vh;margin:0;display:grid;place-items:center;padding:1rem;box-sizing:border-box}.card{width:min(560px,100%);border:1px solid #292929;border-radius:14px;background:#101010;padding:1.5rem;box-sizing:border-box}.eyebrow{text-transform:uppercase;letter-spacing:.08em;font-size:.76rem;font-weight:800;color:#999}h1{margin:.25rem 0 .75rem}p{color:#aaa;line-height:1.55}.actions{display:flex;gap:.65rem;flex-wrap:wrap;margin-top:1rem}.button{display:inline-block;border-radius:9px;background:#f2f2f2;color:#090909;padding:.78rem 1rem;font-weight:800;text-decoration:none}.button.secondary{background:#191919;color:#eee;border:1px solid #333}</style>
</head>
<body>
  <main class="card">
    <p class="eyebrow">MMA Matlock Writer</p>
    <h1>Authentication bridge</h1>
    <p>This small service handles repository-limited GitHub authorization for the MMA Matlock Writer. It does not host the public MMA Matlock site.</p>
    <div class="actions">
      <a class="button" href="/setup/github-app">Set up GitHub App</a>
      <a class="button secondary" href="/auth/github/health">Check auth status</a>
    </div>
  </main>
</body>
</html>
