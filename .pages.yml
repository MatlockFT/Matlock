media:
  input: assets/uploads
  output: /assets/uploads
  rename: safe
  categories:
    - image

content:
  - name: posts
    label: Breakdowns
    type: collection
    path: _posts
    format: yaml-frontmatter
    subfolders: false

    filename:
      template: "{year}-{month}-{day}-{primary}.md"
      field: create

    view:
      primary: title
      fields:
        - title
        - date
        - published
      sort: date
      order: desc

    fields:
      - name: layout
        type: string
        default: post
        hidden: true

      - name: title
        label: Article Title
        type: string
        required: true
        description: "Use a specific title that clearly describes the fight, fighter, event, or topic."
        options:
          minlength: 10
          maxlength: 90

      - name: description
        label: Search and Social Description
        type: text
        required: true
        description: "Write a unique summary describing exactly what the article covers."
        options:
          minlength: 70
          maxlength: 180

      - name: date
        label: Publication Date
        type: date
        required: true

      - name: author
        label: Author
        type: string
        default: "MMA Matlock"

      - name: image
        label: Featured Image
        type: image
        required: false
        description: "Optional. Posts without an image display as text-only cards."

      - name: image_alt
        label: Featured Image Description
        type: string
        required: false
        description: "Describe the featured image for accessibility."

      - name: last_modified_at
        label: Last Updated
        type: date
        required: false

      - name: published
        label: Published
        type: boolean
        default: true

      - name: body
        label: Article
        type: rich-text
        required: true
        options:
          format: markdown
          switcher: true
