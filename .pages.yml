media:
  input: assets/uploads
  output: /assets/uploads
  rename: safe
  categories:
    - image
  extensions:
    - jpg
    - jpeg
    - png
    - webp

content:
  - name: posts
    label: Breakdowns
    type: collection
    path: _posts
    format: yaml-frontmatter
    subfolders: false

    # Prevent accidental filename changes that could alter article URLs.
    operations:
      rename: false

    # Use the selected publication date rather than the date on which
    # the editor entry happens to be created.
    filename: "{date}-{primary}.md"

    view:
      primary: title

      fields:
        - title
        - date
        - category
        - published

      sort:
        - date
        - title

      search:
        - title
        - description
        - category
        - tags

      default:
        sort: date
        order: desc

    fields:
      - name: layout
        type: string
        default: post
        hidden: true

      - name: title
        label: Article Title
        type: string
        required: true
        description: >-
          Name the fighter, fight, event, or subject clearly.
          Avoid vague titles that do not explain what the article covers.
        options:
          minlength: 10
          maxlength: 75

      - name: description
        label: Search and Social Description
        type: text
        required: true
        description: >-
          Write a unique plain-text summary of the article. Include the
          primary fighters, event, or topic naturally.
        options:
          minlength: 70
          maxlength: 170

      - name: date
        label: Publication Date
        type: date
        required: true
        description: >-
          This date is used in the post filename, article metadata,
          archive ordering, and public URL.
        options:
          format: "yyyy-MM-dd"

      - name: category
        label: Article Type
        type: select
        required: true
        default: "MMA Breakdown"
        description: >-
          Select the main type of coverage. This appears above the
          article title.
        options:
          values:
            - "MMA Breakdown"
            - "Fight Prediction"
            - "Technical Analysis"
            - "Event Preview"
            - "MMA History"
            - "MMA Commentary"

      - name: author
        type: string
        default: "MMA Matlock"
        hidden: true

      - name: image
        label: Featured Image
        type: image
        required: false
        description: >-
          Optional article cover image. Landscape images around a
          16:9 ratio work best on the homepage and archive cards.
        options:
          path: posts
          categories:
            - image
          extensions:
            - jpg
            - jpeg
            - png
            - webp
          rename: safe

      - name: image_alt
        label: Featured Image Description
        type: string
        required: false
        description: >-
          Describe who or what appears in the image. Do not write
          "image of" or repeat the article title without adding context.
        options:
          maxlength: 160

      - name: image_caption
        label: Featured Image Caption
        type: string
        required: false
        description: >-
          Optional visible caption, attribution, or brief context
          displayed beneath the featured image.
        options:
          maxlength: 220

      - name: tags
        label: Fighters and Topics
        type: string
        list:
          max: 8
        required: false
        description: >-
          Add individual fighters, events, promotions, and major topics.
          Use one item per entry, such as Islam Makhachev, UFC 330,
          Wrestling, or Welterweight.
        options:
          maxlength: 50

      - name: last_modified_at
        label: Last Updated
        type: date
        required: false
        default: ""
        description: >-
          Leave blank for a new article. Set this only after making
          a meaningful update to a published article.
        options:
          format: "yyyy-MM-dd"

      - name: published
        label: Published
        type: boolean
        default: true
        description: >-
          Turn this off to keep the post from appearing on the
          public website.

      - name: body
        label: Article
        type: rich-text
        required: true
        options:
          format: markdown
          switcher: true
          path: posts
          categories:
            - image
          extensions:
            - jpg
            - jpeg
            - png
            - webp
          rename: safe
