media:
  input: assets
  output: /assets

content:
  - name: posts
    label: Fight Analysis
    type: collection
    path: _posts
    format: yaml-frontmatter

    filename:
      template: "{year}-{month}-{day}-{title}.md"
      field: false

    view:
      fields:
        - title
        - date
      primary: title
      sort:
        - date
        - title
      default:
        sort: date
        order: desc

    fields:
      - name: layout
        type: string
        default: post
        hidden: true

      - name: title
        label: Title
        type: string
        required: true

      - name: date
        label: Publication Date
        type: date
        required: true
        options:
          format: yyyy-MM-dd

      - name: body
        label: Article
        type: rich-text
        required: true
