media:
  input: assets/uploads
  output: /assets/uploads
  rename: safe
  categories:
    - image

content:
  - name: posts
    label: Breakdowns
    type: collection
    path: _posts
    format: yaml-frontmatter
    subfolders: false

    filename:
      template: "{year}-{month}-{day}-{primary}.md"
      field: create

    view:
      primary: title
      fields:
        - title
        - date
        - category
        - published
      sort: date
      order: desc

    fields:
      - name: layout
        type: string
        default: post
        hidden: true

      - name: title
        label: Article Title
        type: string
        required: true
        description: >-
          Use a specific title that clearly names the fight, fighter,
          event, or subject.
        options:
          minlength: 10
          maxlength: 90

      - name: description
        label: Search and Social Description
        type: text
        required: true
        description: >-
          Write a unique summary explaining exactly what the article
          covers. Include the main fighters, event, or subject naturally.
        options:
          minlength: 70
          maxlength: 180

      - name: date
        label: Publication Date
        type: date
        required: true

      - name: category
        label: Article Type
        type: select
        required: true
        default: "Breakdown"
        description: >-
          Choose Breakdown for fight analysis, predictions, previews,
          and technical discussion. Choose Opinion for commentary,
          reactions, essays, and broader MMA topics.
        options:
          values:
            - "Breakdown"
            - "Opinion"

      - name: author
        label: Author
        type: string
        default: "MMA Matlock"
        hidden: true

      - name: image
        label: Featured Image
        type: object
        required: false
        description: >-
          Optional cover image and its accompanying information.

        fields:
          - name: path
            label: Image File
            type: image
            required: false
            description: >-
              Landscape images with a 16:9 shape work best on the
              homepage and breakdown archive.

          - name: alt
            label: Image Description
            type: string
            required: false
            description: >-
              Describe who or what appears in the image. Do not begin
              with the words "image of."
            options:
              maxlength: 160

          - name: caption
            label: Image Caption
            type: string
            required: false
            description: >-
              Optional visible caption, attribution, or additional context.
            options:
              maxlength: 220

      - name: tags
        label: Fighters and Topics
        type: string
        required: false
        list:
          max: 8
        description: >-
          Add one fighter, event, promotion, division, or topic per item.
          Examples include UFC 330, Islam Makhachev, Welterweight,
          Wrestling, or Fight Prediction.
        options:
          maxlength: 50

      - name: last_modified_at
        label: Last Updated
        type: date
        required: false
        description: >-
          Leave this blank for a new article. Set it only after making
          a meaningful update to an existing article.

      - name: published
        label: Published
        type: boolean
        default: true
        description: >-
          Turn this off to keep the article from appearing publicly.

      - name: body
        label: Article
        type: rich-text
        required: true
        options:
          format: markdown
          switcher: true
