media:
  input: assets/uploads
  output: /assets/uploads
  rename: safe
  categories:
    - image
  actions:
    - name: optimize-images
      label: Optimize uploaded images
      workflow: pages-cms-optimize-images.yml
      ref: current
      confirm:
        title: Optimize uploaded images?
        message: This creates lightweight responsive copies for article cards and cover images.
        button: Optimize images

content:
  - name: posts
    label: Breakdowns
    type: collection
    path: _posts
    format: yaml-frontmatter
    subfolders: false

    filename:
      template: "{year}-{month}-{day}-{primary}.md"
      field: create

    view:
      primary: title
      fields:
        - title
        - date
        - category
        - pinned
        - pin_priority
        - published
      sort:
        - date
        - title
      default:
        sort: date
        order: desc

    actions:
      - name: preview-article
        label: Build article preview
        scope: entry
        workflow: pages-cms-preview-article.yml
        ref: current
        confirm: false

      - name: validate-article
        label: Validate article
        scope: entry
        workflow: pages-cms-validate-article.yml
        ref: current
        confirm: false

    fields:
      - name: layout
        type: string
        default: post
        hidden: true

      - name: title
        label: Article Title
        type: string
        required: true
        description: >-
          Use a specific title that clearly names the fight, fighter,
          event, or subject.
        options:
          minlength: 10
          maxlength: 90

      - name: description
        label: Search and Social Description
        type: text
        required: true
        description: >-
          Write a unique summary explaining exactly what the article
          covers. Include the main fighters, event, or subject naturally.
        options:
          minlength: 70
          maxlength: 180

      - name: date
        label: Publication Date
        type: date
        required: true

      - name: category
        label: Article Type
        type: select
        required: true
        default: "Breakdown"
        description: >-
          Choose Breakdown for fight analysis, predictions, previews,
          and technical discussion. Choose Opinion for commentary,
          reactions, essays, and broader MMA topics.
        options:
          values:
            - "Breakdown"
            - "Opinion"

      - name: author
        label: Author
        type: string
        default: "MMA Matlock"
        hidden: true

      - name: image
        label: Featured Image
        type: object
        required: false
        description: >-
          Optional cover image and its accompanying information.

        fields:
          - name: path
            label: Image File
            type: image
            required: false
            description: >-
              Landscape images with a 16:9 shape work best on the
              homepage and breakdown archive.

          - name: alt
            label: Image Description
            type: string
            required: false
            description: >-
              Describe who or what appears in the image. Do not begin
              with the words "image of."
            options:
              maxlength: 160

          - name: caption
            label: Image Caption
            type: string
            required: false
            description: >-
              Optional visible caption, attribution, or additional context.
            options:
              maxlength: 220

      - name: tags
        label: Fighters and Topics
        type: string
        required: false
        list:
          max: 8
        description: >-
          Add one fighter, event, promotion, division, or topic per item.
          Examples include UFC 330, Islam Makhachev, Welterweight,
          Wrestling, or Fight Prediction.
        options:
          maxlength: 50

      - name: last_modified_at
        label: Last Updated
        type: date
        required: false
        default: ""
        description: >-
          Leave this blank for a new article. Set it only after making
          a meaningful update to an existing article.

      - name: update_note
        label: What Changed
        type: text
        required: false
        description: >-
          Optional note shown near the top of an updated article. Briefly
          explain the correction, addition, or other meaningful change.
        options:
          maxlength: 300

      - name: show_toc
        label: Show Table of Contents
        type: boolean
        default: false
        description: >-
          Build a linked contents box when the article has at least two
          section headings.

      - name: pinned
        label: Pin to top of Breakdowns
        type: boolean
        default: false
        description: >-
          Keep this article above newer posts on the Breakdowns page.
          Pinning can expire automatically. Higher-priority pins appear first.

      - name: pin_priority
        label: Pin Priority
        type: number
        default: 0
        description: >-
          Used only when pinned. Higher numbers appear first; use 0 for
          ordinary pinned articles.
        options:
          min: 0
          max: 100

      - name: pin_until
        label: Keep Pinned Until
        type: date
        required: false
        default: ""
        description: >-
          Optional. The article returns to chronological order after this day.

      - name: listing_visibility
        label: Listing Visibility
        type: select
        required: true
        default: normal
        description: >-
          Choose where this article can appear. Direct-link only keeps the URL
          working but removes the article from site listings and search indexing.
        options:
          values:
            - name: normal
              label: Normal
            - name: hide-home
              label: Hide from homepage
            - name: hide-breakdowns
              label: Hide from Breakdowns
            - name: direct-only
              label: Direct-link only

      - name: publish_at
        label: Scheduled Publication
        type: date
        required: false
        default: ""
        description: >-
          Optional. Leave Published off and choose a date and time. Scheduled
          articles are checked every 15 minutes.
        options:
          time: true
          format: "yyyy-MM-dd'T'HH:mm:ssxxx"

      - name: spoiler_warning
        label: Show Spoiler Warning
        type: boolean
        default: false

      - name: spoiler_message
        label: Spoiler Warning Text
        type: string
        required: false
        description: >-
          Optional custom wording. If blank, the site uses a standard warning.
        options:
          maxlength: 180

      - name: published
        label: Published
        type: boolean
        default: false
        description: >-
          New articles begin as drafts. Turn this on only when the
          article is ready to appear publicly.

      - name: body
        label: Article
        type: rich-text
        required: true
        options:
          format: markdown
          switcher: true
