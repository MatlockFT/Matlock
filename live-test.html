<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>Direct Live Test — MMA Matlock</title>
  <link rel="stylesheet" href="/assets/live-test.css?v={{ site.asset_version }}">
</head>
<body>
  <main
    class="live-test"
    data-live-test
    data-stream-url="https://live.mmamatlock.com/matlock/index.m3u8"
  >
    <section class="live-test-shell" aria-label="Direct OBS live stream test">
      <div class="live-test-topbar">
        <div class="live-test-brand">
          <span class="live-test-dot" data-live-dot></span>
          <strong>DIRECT LIVE</strong>
        </div>
        <span class="live-test-status" data-live-status>Checking stream…</span>
      </div>

      <div class="live-test-player">
        <video
          data-live-video
          autoplay
          muted
          playsinline
          controls
          preload="metadata"
        ></video>

        <div class="live-test-offline" data-live-offline>
          <strong>STREAM OFFLINE</strong>
          <span>Waiting for the direct OBS feed.</span>
        </div>
      </div>

      <div class="live-test-controls">
        <button type="button" data-live-audio>Turn sound on</button>
        <span data-live-detail>OBS → MediaMTX → HLS → this player</span>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/hls.js@1/dist/hls.min.js" defer></script>
  <script src="/assets/live-test.js?v={{ site.asset_version }}" defer></script>
</body>
</html>
